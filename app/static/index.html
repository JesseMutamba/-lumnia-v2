<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumnia — light where there was none</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9992a'/%3E%3C/svg%3E">
<style>
  :root {
    --surface: #f4f0e8;
    --card: #fbf9f3;
    --panel: #faf7ef;
    --border: #e4dcc9;
    --hairline: #ece5d5;
    --ink: #201d17;
    --ink-2: #5c564a;
    --ink-3: #99917e;
    --gold: #a8821f;
    --gold-strong: #c9992a;
    --gold-tint: #f3ead2;
    --good: #0ca30c;
    --good-track: #ddeedd;
    --warning: #8a6100;
    --critical: #d03b3b;
    --crit-track: #f3dcd6;
    --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(70,58,25,.05), 0 6px 22px rgba(70,58,25,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.5 var(--sans); }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-3); }

  /* ============ layout: sidebar + main ============ */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside.side { display: none; } }

  aside.side { border-right: 1px solid var(--hairline); background: var(--panel);
    padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
  .brand h1 { font-family: var(--serif); font-size: 19px; font-weight: 500;
    letter-spacing: .12em; margin: 0; }
  .side .kicker { display: block; margin: 18px 8px 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 550;
    font-size: 13px; margin-bottom: 2px; border: 1px solid transparent; }
  .nav-item:hover { background: var(--card); }
  .nav-item.active { background: var(--gold-tint); color: var(--gold);
    border-color: #e8d9ad; }
  .nav-item svg { flex: none; }
  .nav-item .cnt { margin-left: auto; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); }
  .nav-item.active .cnt { color: var(--gold); }
  .wb { padding: 7px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .wb:hover { background: var(--card); }
  .wb .name { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
  .wb.active .name { color: var(--gold); }
  .wb .meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    display: flex; justify-content: space-between; align-items: center; }
  .wb button { border: none; background: none; color: var(--ink-3); cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 3px; visibility: hidden; }
  .wb:hover button { visibility: visible; }
  .wb button:hover { color: var(--critical); }
  #newupload { color: var(--gold); }

  main { padding: 26px 32px 80px; min-width: 0; }

  /* ============ topbar ============ */
  .topbar { display: flex; align-items: baseline; gap: 16px; padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 18px; flex-wrap: wrap; }
  .topbar h2 { font-family: var(--serif); font-size: 26px; font-weight: 500; margin: 0;
    letter-spacing: .02em; overflow-wrap: anywhere; }
  .topbar .sub { color: var(--ink-3); font-family: var(--mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; }
  .topbar .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-2); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  #status { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    letter-spacing: .04em; min-height: 18px; margin: 0 0 10px; }
  #status.err { color: var(--critical); }

  /* ============ filter pills ============ */
  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; position: relative; }
  .pill { position: relative; }
  .pill > button { display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 16px; font: 13px var(--sans); color: var(--ink-2); box-shadow: var(--shadow); }
  .pill > button b { color: var(--ink); font-weight: 650; }
  .pill > button .car { color: var(--ink-3); font-size: 10px; }
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 230px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 34px rgba(70,58,25,.14); padding: 8px; display: none; }
  .pill.open .pop { display: block; }
  .pop .search { display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 6px; }
  .pop .search input { border: none; outline: none; background: transparent;
    font: 13px var(--sans); color: var(--ink); width: 100%; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; cursor: pointer;
    border-radius: 7px; font-size: 13px; }
  .opt:hover { background: var(--gold-tint); }
  .opt .radio { width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .radio { border-color: var(--gold); background: radial-gradient(circle at center, var(--gold) 0 4.5px, transparent 5px); }
  .opt .box { width: 13px; height: 13px; border-radius: 4px; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .box { border-color: var(--gold); background: var(--gold); }
  .pop .clear { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); cursor: pointer; padding: 7px 9px 3px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold-tint);
    color: var(--gold); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }

  /* ============ overview ============ */
  .overview { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(380px, 7fr);
    gap: 16px; align-items: stretch; }
  @media (max-width: 1100px) { .overview { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow); }
  .tile .label { font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3); }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 6px; line-height: 1.1; }
  .tile .value .den { font-size: 15px; color: var(--ink-3); font-weight: 500; }
  .tile .value .ico { font-size: 15px; vertical-align: 3px; margin-right: 6px; }

  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 16px 20px; box-shadow: var(--shadow); margin-bottom: 14px; position: relative; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head .ct { font-weight: 650; font-size: 14px; }
  .card-head .cs { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; text-transform: uppercase; }
  .card-head .grow { flex: 1; }
  .iconbtn { border: none; background: none; cursor: pointer; color: var(--ink-3);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 4px; }
  .iconbtn:hover { color: var(--gold); }
  .iconbtn.on { color: #fff; background: var(--gold); border-radius: 6px;
    padding: 2px 8px; }
  .iconbtn.on:hover { color: #fff; background: var(--gold-strong); }
  .narr { margin-top: 14px; }
  .narr p { margin: 10px 0 0; font-size: 14px; line-height: 1.65; max-width: 80ch; }
  .nwatch { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px;
    line-height: 1.6; color: var(--ink-2); }
  .nfoot { margin-top: 12px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .05em; color: var(--ink-3); }
  .nerr { color: var(--critical); font-size: 12.5px; margin-top: 8px; }
  /* tab bar: one story per tab, PVAK-style */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
    overflow-x: auto; }
  .tabbtn { border: none; background: none; cursor: pointer; font: inherit;
    font-size: 13.5px; font-weight: 600; color: var(--ink-3); padding: 9px 14px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabbtn:hover { color: var(--ink); }
  .tabbtn.on { color: var(--ink); border-bottom-color: var(--gold); }
  .tabbtn .tcnt { margin-left: 6px; font-family: var(--mono); font-size: 10.5px;
    background: var(--card-2); border-radius: 8px; padding: 1px 7px; color: var(--ink-3); }
  /* overview hero: the big confident numbers */
  .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; margin: 14px 0 16px; }
  .hero-tile { background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; }
  .hero-tile .hl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); }
  .hero-tile .hv { font-family: var(--serif); font-size: 34px; font-weight: 650;
    margin-top: 6px; letter-spacing: -.01em; }
  .hero-tile .hs { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  /* data profile */
  .pbadge { display: inline-block; font-family: var(--mono); font-size: 10.5px;
    background: var(--card-2); border-radius: 8px; padding: 3px 9px;
    margin: 0 6px 6px 0; color: var(--ink-2); }
  .psub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; }
  .pstats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .pstats b { font-family: var(--mono); font-size: 12px; }
  /* read-only share view: no library, no upload */
  body.share aside.side { display: none; }
  body.share .app { grid-template-columns: 1fr; }
  /* non-technical home (Flexport-style): greeting, tasks, exceptions */
  .greet { display: flex; align-items: center; gap: 16px; margin: 4px 0 14px; }
  .greet h1 { font-family: var(--serif); font-size: 32px; font-weight: 650; margin: 0; }
  .greet .gsub { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
  .gchip { margin-left: auto; font-size: 13px; font-weight: 650; color: var(--vcolor);
    border: 1.5px solid var(--vcolor); border-radius: 999px; padding: 6px 14px;
    background: var(--card); white-space: nowrap; }
  .home-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 1100px) { .home-grid { grid-template-columns: 1fr; } }
  .trow { display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .trow:last-child { border-bottom: none; }
  .trow.clicky { cursor: pointer; }
  .trow.clicky:hover b { color: var(--gold-strong); }
  .tico { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .tbody { min-width: 0; line-height: 1.45; }
  .tbody .tsub { display: block; color: var(--ink-3); font-size: 12.5px; }
  .tchip { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 600;
    background: var(--crit-track); color: var(--critical); border-radius: 8px; padding: 3px 9px; }
  .cnt2 { font-family: var(--mono); font-size: 10.5px; background: var(--card-2);
    border-radius: 8px; padding: 2px 8px; margin-left: 8px; color: var(--ink-3); }
  .seeall { font-size: 12.5px; font-weight: 600; color: var(--gold-strong); cursor: pointer; }
  .langs { margin-right: 4px; }
  .glead { font-size: 14px; line-height: 1.65; max-width: 90ch; margin: 0 0 14px; }
  .wb-group { font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold-strong); margin: 12px 10px 4px; }
  /* storytelling: brief wizard + plan approval + built dashboard */
  .bq { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }
  .binput { width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card-2); color: var(--ink); resize: vertical; }
  .binput:focus { outline: none; border-color: var(--gold); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 5px 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2);
    background: var(--card); }
  .chip:hover { border-color: var(--gold); }
  .chip.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .mchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card-2); cursor: pointer; }
  .qrow { padding: 12px 0; border-bottom: 1px solid var(--hairline);
    font-size: 13.5px; line-height: 1.5; }
  .qrow:last-of-type { border-bottom: none; }
  .qstat { font-size: 11.5px; font-weight: 600; margin-left: 8px; }
  .qmiss { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mtable td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--hairline); }
  .mtable tr:last-child td { border-bottom: none; }
  .mtable .num { text-align: right; font-variant-numeric: tabular-nums;
    font-family: var(--mono); font-size: 12px; }

  section > .kicker { display: block; margin: 30px 0 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .chart-card svg { display: block; width: 100%; height: auto; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--ink-2); cursor: pointer; padding: 2px 0; user-select: none; }
  .lg .sw { width: 10px; height: 10px; border-radius: 3px; }
  .lg.off { opacity: .32; }
  .hint { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
  .tooltip { position: absolute; pointer-events: none; background: #fffdf8;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    font-size: 12px; display: none; z-index: 40; min-width: 150px;
    box-shadow: 0 4px 16px rgba(70,58,25,.13); }
  .tooltip .tp { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .06em; margin-bottom: 4px; }
  .tooltip .tv { display: flex; justify-content: space-between; gap: 16px;
    font-variant-numeric: tabular-nums; }
  .tooltip .tv .lab { display: inline-flex; align-items: center; gap: 5px; }

  /* progress-bar panels (audit highlights) */
  .bar-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px;
    padding: 10px 0; border-bottom: 1px solid var(--hairline); align-items: center; }
  .bar-row:last-child { border-bottom: none; }
  .bar-row .bl { font-weight: 600; font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bv { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    white-space: nowrap; }
  .track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--hairline); }
  .track .fill { height: 100%; border-radius: 999px; }
  .bar-row.clicky { cursor: pointer; }
  .bar-row.clicky:hover .bl { color: var(--gold); }

  /* leaderboard */
  .lead-row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--hairline); }
  .lead-row:last-child { border-bottom: none; }
  .lead-row .rank { font-family: var(--serif); font-size: 17px; color: var(--ink-3);
    width: 22px; text-align: center; flex: none; }
  .lead-row .nm { font-weight: 600; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead-row .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .lead-row .val { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 650; white-space: nowrap; }

  /* audit table + sheets */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-weight: 500; color: var(--ink-3);
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr.frow { cursor: pointer; }
  tr.frow:hover td { background: #f6f1e4; }
  .st { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .st.ok { color: var(--good); } .st.mismatch { color: var(--critical); }
  .st.unverified { color: var(--warning); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.tidy { color: #48628f; border-color: #c4cfe0; }
  .badge.matrix { color: #6d5590; border-color: #d4c9e2; }
  .badge.multi { color: #3e7466; border-color: #bcd6cd; }
  .badge.form { color: var(--gold); border-color: #ddc98f; }
  .badge.unknown { color: var(--ink-3); }
  .sheet-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sheet-head .nm { font-weight: 650; font-size: 14px; }
  .sheet-head .dims { color: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  .reason { color: var(--ink-2); font-size: 12.5px; margin: 7px 0 0; }
  details { margin-top: 9px; }
  summary { cursor: pointer; color: var(--gold); font-size: 12.5px; }
  .preview-wrap { overflow-x: auto; margin-top: 10px; }
  .preview-wrap table { font-size: 12px; }
  .preview-wrap th, .preview-wrap td { padding: 4px 9px; white-space: nowrap;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .panel-blk { border-left: 2px solid var(--border); padding-left: 14px; margin-top: 12px; }
  .muted { color: var(--ink-3); }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: #f3e8cd; } 100% { background: var(--card); } }

  /* executive mode */
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; }
  .modes button { border: none; background: var(--card); color: var(--ink-3);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .modes button.on { background: var(--gold-tint); color: var(--gold); }
  .verdict { display: flex; gap: 16px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 18px 22px; box-shadow: var(--shadow); margin-bottom: 16px;
    border-left: 4px solid var(--vcolor, var(--ink-3)); }
  .verdict .vic { font-size: 26px; line-height: 1; color: var(--vcolor); }
  .verdict .vlabel { font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--vcolor); font-weight: 600; }
  .verdict p { margin: 6px 0 0; font-size: 14px; line-height: 1.65; max-width: 75ch; }
  .action-card { background: var(--card); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 15px 19px; box-shadow: var(--shadow);
    margin-bottom: 12px; border-left: 4px solid var(--acolor, var(--border)); }
  .action-card .ahead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .action-card .asheet { font-weight: 650; }

/* ---------- brand sun ---------- */
(function drawSun() {
  let dots = `<circle cx="0" cy="0" r="7.5" fill="#c9992a"/>`;
  for (let ring = 1; ring <= 8; ring++) {
    const R = 9 + ring * 4.6, n = 10 + ring * 6;
    const r = Math.max(.5, 2.1 - ring * .18), o = Math.max(.28, 1 - ring * .09);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 2 * Math.PI + ring * .35;
      dots += `<circle cx="${(R*Math.cos(a)).toFixed(1)}" cy="${(R*Math.sin(a)).toFixed(1)}" r="${r}" fill="#c9992a" opacity="${o.toFixed(2)}"/>`;
    }
  }
  $("#sun").innerHTML = dots;
})();

/* ---------- upload ---------- */
const fileInput = $("#file"), statusEl = $("#status");
if (!SHARE) {
  $("#newupload").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
  window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropring"); });
  window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropring"); });
  window.addEventListener("drop", e => {
    e.preventDefault(); document.body.classList.remove("dropring");
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
  });
} else {
  document.body.classList.add("share");
}

async function upload(file) {
  setStatus(T.analyzing(file.name));
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/analyze", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    setStatus("");
    await loadWorkbooks();
    select(body.id);
  } catch (err) { setStatus(T.analysis_failed(err.message), true); }
  fileInput.value = "";
}
function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = isErr ? "err" : ""; }

/* ---------- sidebar: workbooks + analysis nav ---------- */
async function loadWorkbooks() {
  const items = await (await fetch("/analyses")).json();
  // group the library by client workspace; unassigned last
  const groups = new Map();
  for (const i of items) {
    const key = i.client || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  const ordered = [...groups.keys()].sort((a, b) =>
    (a === "") - (b === "") || a.localeCompare(b));
  const wbRow = i => `
    <div class="wb ${i.id === current ? "active" : ""}" data-id="${esc(i.id)}" data-client="${esc(i.client || "")}">
      <div class="name">${esc(i.filename)}</div>
      <div class="meta"><span>${T.wb_meta(i.n_sheets, (i.size_bytes/1024).toFixed(0))}</span>
        <span><button data-act="client">${T.client_btn}</button><button data-act="rerun">${T.rerun}</button><button data-act="del">${T.del}</button></span></div>
    </div>`;
  $("#wb-list").innerHTML = items.length ? ordered.map(key => `
      ${groups.size > 1 || key ? `<div class="wb-group">${esc(key || T.wb_general)}</div>` : ""}
      ${groups.get(key).map(wbRow).join("")}`).join("")
    : `<div class="muted" style="font-size:12px;padding:0 10px">${T.nothing_yet}</div>`;
  $$("#wb-list .wb").forEach(el => el.addEventListener("click", async e => {
    const act = e.target.dataset && e.target.dataset.act, id = el.dataset.id;
    if (act === "del") { e.stopPropagation();
      await fetch(`/analyses/${id}`, { method: "DELETE" });
      if (current === id) { current = null; REPORT = null; renderEmpty(); }
      loadWorkbooks();
    } else if (act === "client") { e.stopPropagation();
      const cur = el.closest("#wb-list").querySelector(`.wb[data-id="${id}"]`);
      const name = window.prompt(T.client_prompt,
        (cur && cur.dataset.client) || "");
      if (name === null) return;
      await fetch(`/analyses/${id}/client`, { method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ client: name }) });
      loadWorkbooks();
    } else if (act === "rerun") { e.stopPropagation();
      const prev = (current === id && AUDIT) ? AUDIT.total_abs_delta : null;
      setStatus(T.reanalyzing);
      await fetch(`/analyses/${id}/rerun`, { method: "POST" });
      await select(id);
      if (prev != null) {
        const d = prev - AUDIT.total_abs_delta;
        setStatus(d > 0.01
          ? T.resolved(compact(d), compact(prev), compact(AUDIT.total_abs_delta))
          : T.unchanged(compact(AUDIT.total_abs_delta)));
      } else setStatus("");
    } else select(id);
  }));
}

function availableTabs() {
  const exec = MODE === "exec";
  const t = [["overview", T.tab_overview]];
  // the briefing tab: intake + plan + built dashboard. In the read-only
  // share view it only appears once a dashboard was actually built.
  if (REPORT.story && (!SHARE || (REPORT.plan && REPORT.plan.approved)))
    t.push(["story", T.tab_story]);
  if (REPORT.model) t.push(["financials", T.tab_financials]);
  if (REPORT.model && REPORT.model.scenario_ready) t.push(["whatif", T.tab_whatif]);
  t.push(["data", exec ? T.tab_trends : T.tab_data]);
  t.push(["audit", exec ? T.tab_actions : T.tab_audit]);
  return t;
}
function tabCounts() {
  return { audit: AUDIT.n_mismatched_relations,
           data: CHARTS.filter(c => !c.pseudo).length || null };
}

function setTab(id) { TAB = id; renderAll(); window.scrollTo(0, 0); }

function renderNav() {
  const counts = tabCounts();
  $("#nav-analysis").innerHTML = `<span class="kicker">Analysis</span>` +
    availableTabs().map(([id, label]) => `
      <div class="nav-item ${TAB === id ? "active" : ""}" data-tab="${id}">
        ${TAB_ICONS[id]}${label}${counts[id] != null ? `<span class="cnt">${counts[id]}</span>` : ""}
      </div>`).join("");
  $$("#nav-analysis .nav-item").forEach(el =>
    el.addEventListener("click", () => setTab(el.dataset.tab)));
}

function renderTabBar() {
  const counts = tabCounts();
  return `<div class="tabs">${availableTabs().map(([id, label]) => `
    <button class="tabbtn ${TAB === id ? "on" : ""}" data-tab="${id}">${label}${
      counts[id] != null ? `<span class="tcnt">${counts[id]}</span>` : ""}</button>`).join("")}</div>`;
}
function attachTabBar() {
  $$(".tabs .tabbtn").forEach(b =>
    b.addEventListener("click", () => setTab(b.dataset.tab)));
  $$(".seeall").forEach(a =>
    a.addEventListener("click", () => setTab(a.dataset.tab)));
}

/* ---------- select + render ---------- */
async function select(id) {
  current = id;
  if (!SHARE) loadWorkbooks();
  [REPORT, AUDIT] = await Promise.all(SHARE
    ? [fetch(`${API}/report`).then(r => r.json()),
       fetch(`${API}/findings`).then(r => r.json())]
    : [fetch(`/analyses/${id}`).then(r => r.json()),
       fetch(`/analyses/${id}/findings`).then(r => r.json())]);
  FILTER.sheets = null; FILTER.status = null; FILTER.periods = "all";
  MC_RESULTS = null; SCEN = { price: 1.0, vol: 1.0, cost: 1.0 };
  TAB = "overview";
  renderAll();
}

function renderEmpty() {
  $("#nav-analysis").innerHTML = "";
  $("#wb-kicker").textContent = T.wb_kicker;
  $("#newupload-txt").textContent = T.new_upload;
  $("#topbar").innerHTML = `<div class="topbar"><h2>Lumnia</h2>
    <span class="sub">${LANG === "fr" ? "La lumière là où il n'y en avait pas" : "Light where there was none"}</span>
    <span class="grow"></span>${langToggle()}</div>`;
  attachLang();
  $("#content").innerHTML = `<div id="drop">
    <div class="big">${T.drop_big}</div>
    <div class="hint2">${T.drop_hint}</div></div>`;
  $("#drop").addEventListener("click", () => fileInput.click());
}

function langToggle() {
  return `<span class="modes langs">
    <button data-lang="fr" class="${LANG === "fr" ? "on" : ""}">FR</button>
    <button data-lang="en" class="${LANG === "en" ? "on" : ""}">EN</button></span>`;
}
function attachLang() {
  $$(".langs button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang !== LANG) setLang(b.dataset.lang);
  }));
}

function renderAll() {
  const r = REPORT, a = AUDIT;
  SHEET_IDX = {}; r.sheets.forEach((s, i) => { SHEET_IDX[s.name] = i; });
  CHARTS = collectCharts(r);
  const exec = MODE === "exec";
  if (!availableTabs().some(([id]) => id === TAB)) TAB = "overview";

  renderNav();
  $("#wb-kicker").textContent = T.wb_kicker;
  $("#newupload-txt").textContent = T.new_upload;
  $("#topbar").innerHTML = `<div class="topbar">
    <h2>${esc(r.filename)}</h2>
    <span class="sub">${T.sheets_analyzed(r.n_sheets)}${SHARE ? ` · ${T.shared_view}` : ""}</span>
    <span class="grow"></span>
    ${langToggle()}
    <span class="modes">
      <button data-mode="exec" class="${exec ? "on" : ""}">${T.mode_exec}</button>
      <button data-mode="analyst" class="${exec ? "" : "on"}">${T.mode_analyst}</button>
    </span>
    <button class="btn" id="print-report">⎙&nbsp; ${T.btn_report}</button>
    ${SHARE ? "" : `<button class="btn" id="share-link">↗&nbsp; ${T.btn_share}</button>
    ${exec ? "" : `<button class="btn" id="dl-corrections">⤓&nbsp; ${T.btn_corrections}</button>
    <button class="btn" id="dl-findings">⤓&nbsp; ${T.btn_findings}</button>`}`}
  </div>`;
  attachLang();
  $$(".modes:not(.langs) button").forEach(b => b.addEventListener("click", () => {
    MODE = b.dataset.mode; localStorage.setItem("lumnia_mode", MODE); renderAll();
  }));
  $("#print-report").addEventListener("click", printReport);
  const dlc = $("#dl-corrections");
  if (dlc) dlc.addEventListener("click", downloadCorrections);
  const dlf = $("#dl-findings");
  if (dlf) dlf.addEventListener("click", downloadFindings);
  const shr = $("#share-link");
  if (shr) shr.addEventListener("click", shareLink);

  let body = "";
  if (TAB === "overview") {
    body = exec
      // non-technical home: greeting, story, big numbers, tasks & exceptions
      ? `<section id="sec-overview">${renderGreeting()}${renderNarrative()}${renderHero()}${renderHome()}${renderInsights()}</section>`
      : `<section id="sec-overview">${renderVerdict()}${renderNarrative()}${renderHero()}${renderOverview()}${renderInsights()}</section>`;
  } else if (TAB === "story") {
    body = renderStory();
  } else if (TAB === "financials") {
    body = renderFinancials();
  } else if (TAB === "whatif") {
    body = renderScenario() + renderMC();
  } else if (TAB === "data") {
    body = (exec ? "" : renderFilters()) +
      `<section id="sec-charts"><span class="kicker">${exec ? T.ch_trends : T.ch_kicker}</span>${renderChartGrid()}</section>` +
      ((!exec || !r.model) ? `<section id="sec-profile"><span class="kicker">${T.pf_kicker}</span>${renderProfile()}</section>` : "") +
      (exec ? "" : `<section id="sec-sheets"><span class="kicker">${T.sh_kicker(r.n_sheets)}</span>${renderSheets()}</section>`);
  } else if (TAB === "audit") {
    body = exec
      ? `<section id="sec-audit"><span class="kicker">${T.tab_actions}</span>${renderActionList()}${renderExecDownloads()}</section>`
      : (renderFilters() +
         `<section id="sec-audit"><span class="kicker">${T.tab_audit}</span>${renderHighlights()}${renderLeaderboards()}${renderFindingsTable()}</section>`);
  }
  $("#content").innerHTML = renderTabBar() + body;

  attachTabBar(); attachFilters(); attachCharts(); attachFindingRows();
  attachBarRows(); attachScenario(); attachMC(); attachNarrative();
  attachStory();
  const dlx = $("#dl-corrections-exec");
  if (dlx) dlx.addEventListener("click", downloadCorrections);
}

/* ---------- filters ---------- */
function sheetVisible(name) { return !FILTER.sheets || FILTER.sheets.has(name); }
function visCharts() { return CHARTS.filter(c => sheetVisible(c.sheet)); }

function renderFilters() {
  const sheets = [...new Set(CHARTS.map(c => c.sheet).concat(REPORT.sheets.map(s => s.name)))];
  const selN = FILTER.sheets ? FILTER.sheets.size : 0;
  const periodLabels = { all: T.fl_all, p30: T.fl_p30, p90: T.fl_p90 };
  const statusLabels = { mismatch: T.fl_mismatch, ok: T.fl_ok, unverified: T.fl_unv };
  return `<div class="filters">
    <div class="pill" id="pf-periods"><button>${T.fl_periods}: <b>${periodLabels[FILTER.periods]}</b> <span class="car">▾</span></button>
      <div class="pop">${Object.entries(periodLabels).map(([k, l]) =>
        `<div class="opt ${FILTER.periods === k ? "sel" : ""}" data-v="${k}"><span class="radio"></span>${l}</div>`).join("")}
      </div></div>
    <div class="pill" id="pf-sheets"><button>${T.fl_sheets}: <b>${selN ? T.fl_sel(selN) : T.fl_all}</b> <span class="car">▾</span></button>
      <div class="pop" style="min-width:280px">
        ${selN ? `<div class="fchips">${[...FILTER.sheets].map(s =>
          `<span class="fchip" data-v="${esc(s)}">${esc(s)} ✕</span>`).join("")}</div>` : ""}
        <div class="search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#99917e" stroke-width="1.4"/><path d="M8 8l2.6 2.6" stroke="#99917e" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input placeholder="${T.fl_search}" id="sheet-search"></div>
        <div id="sheet-opts">${sheets.map(s =>
          `<div class="opt ${FILTER.sheets && FILTER.sheets.has(s) ? "sel" : ""}" data-v="${esc(s)}"><span class="box"></span>${esc(s)}</div>`).join("")}</div>
        ${selN ? `<div class="clear" id="sheets-clear">${T.fl_clear}</div>` : ""}
      </div></div>
    <div class="pill" id="pf-status"><button>${T.fl_status}: <b>${FILTER.status ? statusLabels[FILTER.status] : T.fl_all}</b> <span class="car">▾</span></button>
      <div class="pop">
        <div class="opt ${!FILTER.status ? "sel" : ""}" data-v=""><span class="radio"></span>${T.fl_all}</div>
        ${Object.entries(statusLabels).map(([k, l]) =>
          `<div class="opt ${FILTER.status === k ? "sel" : ""}" data-v="${k}"><span class="radio"></span>${l}</div>`).join("")}
      </div></div>
  </div>`;
}

document.addEventListener("click", e => {   // close popovers on outside click
  if (!e.target.closest(".pill")) $$(".pill").forEach(p => p.classList.remove("open"));
});

function attachFilters() {
  $$(".pill > button").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const pill = btn.parentElement, was = pill.classList.contains("open");
    $$(".pill").forEach(p => p.classList.remove("open"));
    if (!was) pill.classList.add("open");
  }));
  $$(".pop").forEach(p => p.addEventListener("click", e => e.stopPropagation()));

  $$("#pf-periods .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.periods = o.dataset.v; renderAll();
  }));
  $$("#pf-status .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.status = o.dataset.v || null; renderAll();
  }));
  $$("#pf-sheets #sheet-opts .opt").forEach(o => o.addEventListener("click", () => {
    const v = o.dataset.v;
    if (!FILTER.sheets) FILTER.sheets = new Set();
    FILTER.sheets.has(v) ? FILTER.sheets.delete(v) : FILTER.sheets.add(v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  $$("#pf-sheets .fchip").forEach(ch => ch.addEventListener("click", () => {
    FILTER.sheets.delete(ch.dataset.v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  const clr = $("#sheets-clear");
  if (clr) clr.addEventListener("click", () => { FILTER.sheets = null; renderAll(); openPill("pf-sheets"); });
  const search = $("#sheet-search");
  if (search) search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    $$("#sheet-opts .opt").forEach(o =>
      o.style.display = o.dataset.v.toLowerCase().includes(q) ? "" : "none");
  });
}
function openPill(id) {
  const p = document.getElementById(id);
  if (p) { p.classList.add("open"); const s = $("#sheet-search"); if (s) s.focus(); }
}

/* ---------- non-technical home: greeting + tasks + exceptions ------------ */
function renderGreeting() {
  const v = verdictInfo();
  const date = new Date().toLocaleDateString(LOCALE,
    { day: "numeric", month: "long", year: "numeric" });
  return `<div class="greet"><div>
      <h1>${T.greet}</h1>
      <div class="gsub">${esc(REPORT.filename)} · ${date}</div></div>
    <span class="gchip" style="--vcolor:${v.color}">${v.icon} ${v.label}</span></div>
    <p class="glead">${execSummary()}</p>`;
}

function renderHome() {
  const vis = visCharts().filter(c => !c.pseudo);
  const primary = vis.filter(c => c.chart.kind === "timeseries")
    .sort((x, y) => y.chart.periods.length - x.chart.periods.length)[0];
  const left = primary ? chartCard(primary, true)
    : `<div class="card"><div class="muted" style="padding:40px 0;text-align:center">${T.no_ts}</div></div>`;

  // tasks = the concrete problems, one row each, Flexport-style
  const tasks = AUDIT.findings.slice(0, 4).map(f => `
    <div class="trow clicky bar-row" data-sheet="${esc(f.sheet)}" style="display:flex">
      <span class="tico" style="background:var(--crit-track);color:var(--critical)">✕</span>
      <span class="tbody"><b>${esc(f.sheet)}</b>
        <span class="tsub">${T.task_sub(f.n_mismatched, f.n_checked)}</span></span>
      <span class="tchip">${compact(f.total_abs_delta)}</span>
    </div>`).join("");
  const taskCard = `<div class="card"><div class="card-head">
      <span class="ct">${T.tasks_t}</span><span class="cnt2">${AUDIT.findings.length}</span>
      <span class="grow"></span><a class="seeall" data-tab="audit">${T.see_all}</a></div>
    ${tasks || `<div class="trow"><span class="tico" style="background:var(--good-track);color:var(--good)">✓</span>
      <span class="tbody">${T.all_clear}</span></div>`}</div>`;

  // exceptions = things a human must look at
  const ex = [];
  if (AUDIT.n_unverified_relations)
    ex.push({ ico: "?", c: "var(--warning)", tr: "#f3ecd6", txt: T.ex_unv(AUDIT.n_unverified_relations) });
  for (const s of REPORT.sheets.filter(s => s.orientation === "error").slice(0, 3))
    ex.push({ ico: "!", c: "var(--critical)", tr: "var(--crit-track)", txt: T.ex_err(esc(s.name)) });
  const exCard = `<div class="card" style="margin-top:14px"><div class="card-head">
      <span class="ct">${T.exceptions_t}</span><span class="cnt2">${ex.length}</span></div>
    ${ex.length ? ex.map(e => `<div class="trow"><span class="tico" style="background:${e.tr};color:${e.c}">${e.ico}</span>
      <span class="tbody">${e.txt}</span></div>`).join("")
      : `<div class="trow"><span class="tico" style="background:var(--good-track);color:var(--good)">✓</span><span class="tbody">${T.ex_none}</span></div>`}</div>`;

  return `<div class="home-grid"><div>${left}</div><div>${taskCard}${exCard}</div></div>`;
}

function renderExecDownloads() {
  const cells = AUDIT.findings.reduce((t, f) => t + safeFixes(f).length, 0);
  return cells && !SHARE
    ? `<button class="btn" id="dl-corrections-exec" style="margin-top:12px">${T.a_dl}</button>` : "";
}

/* ---------- overview hero: the 3-4 numbers that lead this workbook -------- */
function renderHero() {
  const m = REPORT.model, tiles = [];
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
  if (m) {
    const rev = m.metrics.revenue;
    if (rev) {
      const v = rev.values, fi = v.findIndex(x => x != null);
      let li = -1; for (let i = v.length - 1; i >= 0; i--) if (v[i] != null) { li = i; break; }
      const growth = fi >= 0 && li > fi && v[fi] ? ((v[li] / v[fi] - 1) * 100) : null;
      tiles.push(`<div class="hero-tile"><div class="hl">${T.h_revenue(esc(m.periods[fi]), esc(m.periods[li]))}</div>
        <div class="hv">${compact(sum(v))}</div>
        ${growth != null ? `<div class="hs" style="color:var(--good)">${growth >= 0 ? "▲" : "▼"} ${T.h_horizon(Math.abs(growth).toFixed(0))}</div>` : ""}</div>`);
    }
    const mp = m.derived.margin_pct && last(m.derived.margin_pct);
    if (mp != null) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_margin}</div>
      <div class="hv">${pctFmt(mp)}</div><div class="hs">${T.h_latest}</div></div>`);
    const vr = m.derived.volume_ratio && last(m.derived.volume_ratio);
    if (vr != null) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_conversion}</div>
      <div class="hv">${pctFmt(vr * 100, 1)}</div>
      <div class="hs">${esc(m.metrics.volume_secondary.label.slice(0, 16))} / ${esc(m.metrics.volume.label.slice(0, 16))}</div></div>`);
    if (m.metrics.capex) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_capex}</div>
      <div class="hv">${compact(sum(m.metrics.capex.values))}</div></div>`);
  } else {
    // no business model role-tagged -> lead with the data-profile numbers
    const es = collectEda();
    const rows = es.reduce((t, e) => t + (e.eda.row_count || 0), 0);
    if (!rows) return "";
    let cells = 0, nulls = 0, dupes = 0;
    for (const e of es) {
      cells += (e.eda.row_count || 0) * (e.eda.column_count || 0);
      dupes += e.eda.duplicates || 0;
      for (const info of Object.values(e.eda.missingness || {})) nulls += info.count || 0;
    }
    tiles.push(`<div class="hero-tile"><div class="hl">${T.h_rows}</div>
      <div class="hv">${compact(rows)}</div><div class="hs">${T.h_tables(es.length)}</div></div>`);
    if (cells) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_complete}</div>
      <div class="hv">${(100 - nulls / cells * 100).toFixed(0)}%</div><div class="hs">${T.h_filled}</div></div>`);
    tiles.push(`<div class="hero-tile"><div class="hl">${T.h_dupes}</div>
      <div class="hv">${dupes}</div></div>`);
  }
  return tiles.length ? `<div class="hero">${tiles.slice(0, 4).join("")}</div>` : "";
}

/* ---------- data profile: EDA facts as a dashboard (any file type) ------- */
function collectEda() {
  const out = [];
  for (const s of REPORT.sheets) {
    if (s.tidy && s.tidy.eda && s.tidy.eda.row_count) out.push({ sheet: s.name, eda: s.tidy.eda });
    for (const p of s.panels || [])
      if (p.tidy && p.tidy.eda && p.tidy.eda.row_count) out.push({ sheet: s.name, eda: p.tidy.eda });
  }
  return out;
}

function renderProfile() {
  const es = collectEda().filter(e => sheetVisible(e.sheet));
  if (!es.length) return `<div class="card muted">${T.pf_none}</div>`;
  const cards = es.slice(0, 6).map(({ sheet, eda }) => {
    const cells = eda.row_count * eda.column_count;
    let nulls = 0;
    for (const info of Object.values(eda.missingness || {})) nulls += info.count || 0;
    const badges = [
      T.pf_dims(compact(eda.row_count), eda.column_count),
      cells ? T.pf_complete((100 - nulls / cells * 100).toFixed(0)) : null,
      eda.duplicates ? T.pf_dupes(eda.duplicates) : null,
      (eda.constant_columns || []).length ? T.pf_const(eda.constant_columns.length) : null,
    ].filter(Boolean).map(b => `<span class="pbadge">${esc(b)}</span>`).join("");

    // top categories by average of the detected target column
    let breakdown = "";
    const bd = (eda.categorical_breakdowns || [])[0];
    if (bd && eda.target_column) {
      const mx = Math.max(1, ...bd.categories.map(c => Math.abs(c.mean)));
      breakdown = `<div class="psub">${T.pf_avg(esc(String(eda.target_column).slice(0, 24)), esc(bd.column.slice(0, 24)))}</div>` +
        bd.categories.slice(0, 5).map(c => `<div class="bar-row">
          <span class="bl">${esc(c.category.slice(0, 40))} <span class="muted">(${c.count})</span></span>
          <span class="bv">${compact(c.mean)}</span>
          <div class="track"><div class="fill" style="width:${Math.max(3, Math.abs(c.mean) / mx * 100)}%;background:var(--gold)"></div></div>
        </div>`).join("");
    }

    // the detected target column's shape
    let stats = "";
    const t = eda.target_column && (eda.numeric_columns || {})[eda.target_column];
    if (t) {
      stats = `<div class="psub">${esc(String(eda.target_column).slice(0, 28))}</div>
        <div class="pstats">
          <span>${T.pf_min} <b>${compact(t.min)}</b></span><span>${T.pf_med} <b>${compact(t.median)}</b></span>
          <span>${T.pf_max} <b>${compact(t.max)}</b></span>
          ${t.outlier_count ? `<span style="color:var(--warning)">${T.pf_out} <b>${t.outlier_count}</b></span>` : ""}
        </div>`;
    }
    return `<div class="card"><div class="card-head"><span class="ct">${esc(sheet)}</span></div>
      <div style="margin-top:8px">${badges}</div>${stats}${breakdown}</div>`;
  });
  return `<div class="grid2">${cards.join("")}</div>`;
}

/* ---------- share: read-only link for clients ---------- */
async function shareLink() {
  const r = await fetch(`/analyses/${current}/share`, { method: "POST" });
  if (!r.ok) { setStatus(T.share_failed, true); return; }
  const full = location.origin + (await r.json()).url;
  try {
    await navigator.clipboard.writeText(full);
    setStatus(T.share_copied(full));
  } catch { setStatus(T.share_manual(full)); }
}
