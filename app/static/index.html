      const m = metricById[k];
      return (m.id === "mom" || m.id === "yoy") && m._sid === h._sid;
    }).map(k => {
      const m = metricById[k]; done.add(k);
      const p = m.pct;
      return `<div class="kd" style="color:${p == null ? "var(--ink-3)" : p >= 0 ? "var(--good)" : "var(--critical)"}">
        ${p == null ? "—" : (p >= 0 ? "+" : "") + pctFmt(p, 1)} <span>${esc(mlabel(m))}</span></div>`;
    }).join("");
    done.add(headKey);
    hero = `<div class="hero"><div class="hero-tile"><div class="hl">${esc(storySentence(h))}</div>
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <div class="hv">${compact(h.value)}</div>
        ${kds ? `<div class="kds">${kds}</div>` : ""}</div></div></div>`;
  }

  // Step 5b: amount + change on the same grain AND sheet merge into a pair
  const paired = {};                   // by_ key -> {html, partner avg_ key}
  const claimed = new Set();
  for (const key of approved) {
    const m = metricById[key];
    if (!m.id.startsWith("by_") || done.has(key)) continue;
    const chgKey = approved.find(o => {
      const c = metricById[o];
      return c.id.startsWith("avg_") && !claimed.has(o)
        && c._sid === m._sid && c.grain === m.grain;
    });
    if (chgKey) {
      paired[key] = { html: pairCard(m, metricById[chgKey]), partner: chgKey };
      claimed.add(chgKey);
    }
  }

  // Step 5c: zones follow the brief's question order; first claim wins
  const zones = [];
  const emit = key => {
    if (done.has(key) || !metricById[key]) return "";
    done.add(key);
    if (paired[key]) { done.add(paired[key].partner); return paired[key].html; }
    // an avg_ that was absorbed into a pair never renders alone
    if (Object.values(paired).some(p => p.partner === key)) return "";
    return storyVisual(metricById[key]);
  };
  let qn = 0;
  for (const q of plan.questions) {
    const vis = q.metrics.filter(id => approved.includes(id))
      .map(emit).filter(Boolean);
    qn++;
    if (vis.length) zones.push({ title: q.question, cards: vis, n: qn, status: q.status });
  }
  const rest = approved.map(emit).filter(Boolean);
  if (rest.length) zones.push({ title: T.st_also, cards: rest });

  const BADGE = { answerable: "good", partial: "warn" };
  const zoneHtml = zones.map(z => `
    <div class="zq">${z.n ? `<span class="zn">Q${z.n}</span> — ` : ""}${esc(z.title)}${
      z.status ? ` <span class="vbadge ${BADGE[z.status] || ""}">${T.st_badge[z.status]}</span>` : ""}</div>
    <div class="grid2">${z.cards.join("")}</div>`).join("");

  // Step 6: takeaways lead, recommendations close — both computed from the
  // page's own figures, every recommendation with its because-clause
  const takes = storyTakeaways(metricById, approved);
  const takesCard = takes.length ? `<div class="card" style="margin-bottom:16px">
      <div class="card-head"><span class="ct">${T.tk_title}</span>
        <span class="cs">${T.tk_sub}</span></div>
      ${takes.map(t => `<div class="bar-row"><span style="font-size:13.5px;line-height:1.55">${esc(t)}</span></div>`).join("")}
    </div>` : "";

  const recs = storyRecs(metricById, approved);
  const recsCard = recs.length ? `<div class="card" style="margin-top:18px">
      <div class="card-head"><span class="ct">${T.rc_title}</span></div>
      ${recs.map((r, i) => `<div class="trow">
        <span class="tico" style="background:var(--card-2);color:var(--gold-strong)">${i + 1}</span>
        <span class="tbody"><b>${esc(r.text)}</b>
          <span class="tsub">— ${T.rc_because} ${esc(r.because)}</span></span>
      </div>`).join("")}</div>` : "";

  const misses = plan.questions.filter(q => q.status === "unanswerable" || q.status === "unmatched"
    || (q.status === "partial" && q.missing.length));
  const gapsCard = misses.length ? `<div class="card" style="margin-top:14px">
      <div class="card-head"><span class="ct">${T.st_gaps_t}</span></div>
      ${misses.map(q => `<div class="qrow"><b>${esc(q.question)}</b>
        <span class="qstat" style="color:var(--ink-3)">${T.st_status[q.status]}</span>
        ${q.missing.map(g => `<div class="qmiss">→ ${T.st_needs(esc(g.requires))}</div>`).join("")}
      </div>`).join("")}</div>` : "";

  const nA = plan.questions.filter(q => q.status === "answerable").length;
  const nP = plan.questions.filter(q => q.status === "partial").length;
  const statbar = `<div class="statbar">
    <span>${T.sb_q} <b>${plan.questions.length}</b></span>
    ${nA ? `<span class="sbgood">${T.st_badge.answerable} <b>${nA}</b></span>` : ""}
    ${nP ? `<span class="sbwarn">${T.st_badge.partial} <b>${nP}</b></span>` : ""}
    <span>${T.sb_series} <b>${approved.length}</b></span>
  </div>`;
  return `<section id="sec-story">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px">
      <span class="kicker">${esc(T.st_brief_line(brief.role, T.st_cadences[brief.cadence] ? T.st_cadences[brief.cadence].toLowerCase() : brief.cadence))} · ${esc(story.sheet.trim())}</span>
      <span class="grow"></span>
      ${SHARE ? "" : `<span>
        <button class="iconbtn" id="bf-edit">${T.st_edit}</button>
        <button class="iconbtn" id="plan-reopen">${T.st_replan}</button></span>`}</div>
    ${statbar}
    ${hero}
    ${takesCard}
    ${zoneHtml}
    ${recsCard}
    ${gapsCard}
  </section>`;
}

function attachStory() {
  $$("#sec-story .chip[data-role]").forEach(c => c.addEventListener("click", () => {
    $("#bf-role").value = c.dataset.role;
  }));
  $$("#sec-story .chip[data-cad]").forEach(c => c.addEventListener("click", () => {
    CADENCE = c.dataset.cad;
    $$("#sec-story .chip[data-cad]").forEach(x => x.classList.toggle("on", x === c));
  }));
  const submit = $("#bf-submit");
  if (submit) submit.addEventListener("click", async () => {
    const lines = el => $(el).value.split("\n").map(s => s.trim()).filter(Boolean);
    const questions = lines("#bf-questions");
    if (!questions.length) { $("#bf-err").textContent = T.st_need_q; return; }
    submit.disabled = true;
    const r = await fetch(`/analyses/${current}/brief`, { method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ role: $("#bf-role").value.trim(),
        goals: lines("#bf-goals"), questions, cadence: CADENCE, lang: LANG }) });
    if (!r.ok) { submit.disabled = false;
      $("#bf-err").textContent = (await r.json().catch(() => ({}))).detail || "!"; return; }
    const body = await r.json();
    REPORT.brief = body.brief; REPORT.plan = body.plan;
    rerender(renderAll);
  });
  const approve = $("#plan-approve");
  if (approve) approve.addEventListener("click", async () => {
    const ids = [...new Set($$("#sec-story input[data-mid]:checked").map(i => i.dataset.mid))];
    approve.disabled = true;
    const r = await fetch(`/analyses/${current}/plan`, { method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ approved: ids }) });
    if (r.ok) { REPORT.plan.approved = (await r.json()).approved; rerender(renderAll); }
    else approve.disabled = false;
  });
  const edit = $("#bf-edit");
  if (edit) edit.addEventListener("click", () => {
    CADENCE = (REPORT.brief && REPORT.brief.cadence) || "monthly";
    REPORT.plan = null; rerender(renderAll);   // wizard prefills from REPORT.brief
  });
  const reopen = $("#plan-reopen");
  if (reopen) reopen.addEventListener("click", () => {
    REPORT.plan.approved = null; rerender(renderAll);
  });
  // intake helpers: "same brief as last month?" + goal/question chips
  // generated from what THIS file can actually answer
  const sugBox = $("#brief-suggestion");
  if (sugBox && !SHARE) {
    fetch(`/analyses/${current}/brief-suggestion?lang=${LANG}`).then(r => r.json()).then(s => {
      if (s.brief) {
        const slot = $("#use-prev-slot") || sugBox;
        slot.innerHTML = `<a class="seeall" id="use-prev" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase">↺ ${T.st_use_prev(esc(s.from))}</a>`;
        $("#use-prev").addEventListener("click", () => {
          REPORT.brief = s.brief; CADENCE = s.brief.cadence || "monthly";
          renderAll();
        });
      }
      const ideaRow = (boxId, taId, lines) => {
        const box = $(boxId), ta = $(taId);
        if (!box || !ta || !lines || !lines.length) return;
        box.innerHTML = `<div class="chiprow" style="margin:8px 0 0;align-items:center">
          <span class="kicker" style="font-size:8.5px">${T.st_ideas}</span>
          ${lines.map((q, i) =>
            `<span class="chip idea" data-idea="${i}">+ ${esc(q)}</span>`).join("")}</div>`;
        box.querySelectorAll(".chip").forEach(ch =>
          ch.addEventListener("click", () => {
            const line = lines[+ch.dataset.idea];
            if (!ta.value.split("\n").map(l => l.trim()).includes(line))
              ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + line;
            ch.classList.add("on");
          }));
      };
      if (s.ideas) {
        ideaRow("#goal-ideas", "#bf-goals", s.ideas.goals);
        ideaRow("#q-ideas", "#bf-questions", s.ideas.questions);
      }
    }).catch(() => {});
  }
}

/* ---------- financials: generated from the semantic business model ------- */
const ROLE_LABELS = T.roles;

function renderFinancials(execView) {
  const m = REPORT.model;
  if (!m || !Object.keys(m.metrics || {}).length) return execView ? ""
    : mappableSeries().length
      ? `<section id="sec-financials"><span class="kicker">${T.fin_kicker}</span>
          <p class="chcap" style="max-width:56ch">${T.mp_none}</p>
          ${mappingCard()}</section>`
      : "";
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const lastIdx = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };
  const met = m.metrics;

  // header stat row — the roles actually found, as one terminal line
  const stats = [];
  if (met.revenue) {
    const v = met.revenue.values, li = lastIdx(v);
    const fi = v.findIndex(x => x != null);
    const growth = fi >= 0 && li > fi && v[fi] ? ((v[li] / v[fi] - 1) * 100) : null;
    stats.push(`<span>${T.roles.revenue} <b>${compact(sum(v))}</b>${growth != null
      ? ` <span class="${growth >= 0 ? "sbgood" : "sbbad"}">${growth >= 0 ? "▲" : "▼"} ${growth >= 0 ? "+" : "−"}${Math.abs(growth).toFixed(0)}%</span>` : ""}</span>`);
  }
  if (met.capex) stats.push(`<span>CAPEX <b>${compact(sum(met.capex.values))}</b></span>`);
  if (met.opex) {
    const v = met.opex.values, li = lastIdx(v);
    stats.push(`<span>${T.fin_opex_at(esc(m.periods[li]))} <b>${compact(v[li])}</b></span>`);
  }
  if (met.area) {
    const v = met.area.values;
    const peak = v.indexOf(Math.max(...v.filter(x => x != null)));
    stats.push(`<span>${T.fin_peak(esc(met.area.label.slice(0, 16)))} <b>${esc(m.periods[peak])}</b></span>`);
  }
  const mp = m.derived.margin_pct;
  if (mp) {
    const li = lastIdx(mp);
    if (li >= 0) stats.push(`<span>${T.fin_margin_at(esc(m.periods[li]))} <b>${pctFmt(mp[li])}</b></span>`);
  }
  const upv = m.derived.opex_per_volume_out || m.derived.opex_per_volume;
  if (upv) {
    const li = lastIdx(upv);
    if (li >= 0) stats.push(`<span>${T.fin_cpu(esc(m.periods[li]))} <b>${compact(upv[li])}</b></span>`);
  }
  const cpa = m.derived.opex_per_area;
  if (cpa) {
    const li = lastIdx(cpa);
    if (li >= 0) stats.push(`<span>${T.fin_cpa(esc(m.periods[li]))} <b>${compact(cpa[li])}</b></span>`);
  }
  const bv = m.derived.opex_budget_variance_pct;
  if (bv) {
    const li = lastIdx(bv);
    if (li >= 0) stats.push(`<span>${T.fin_budget_at(esc(m.periods[li]))}
      <b class="${bv[li] > 0 ? "sbbad" : "sbgood"}">${bv[li] >= 0 ? "+" : "−"}${Math.abs(bv[li]).toFixed(1)}% ${bv[li] > 0 ? T.fin_over : T.fin_under}</b></span>`);
  }

  // trajectory chart: the role series as a pseudo-timeseries (reuses hover/legend)
  const lines = Object.entries(met).map(([role, s], k) => ({
    label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 26)}`,
    values: s.values, color: SERIES_COLORS[k % SERIES_COLORS.length], on: true,
  }));
  // exec page shows no source-sheet name; the analyst keeps the provenance
  const traj = { pseudo: true, loc: null,
    sheet: execView ? T.fin_traj_x : T.fin_traj(m.source_sheet.trim()),
    chart: { kind: "timeseries", periods: m.periods, series: [], other: null,
             truncated: false }, lines, i: CHARTS.length, range: null };
  CHARTS.push(traj);

  let marginCard = "";
  if (mp && mp.some(v => v != null)) {
    const bars = { pseudo: true, sheet: T.fin_margin, loc: null,
      chart: { kind: "profile", x: m.periods,
               y: mp.map(v => v ?? 0) }, i: CHARTS.length, range: null };
    CHARTS.push(bars);
    marginCard = chartCard(bars, false);
  }

  // unit economics: the efficiency curve — cost & revenue per unit of volume
  let unitCard = "", convCard = "";
  const d = m.derived;
  if (met.volume && (d.opex_per_volume || d.revenue_per_volume)) {
    const ulines = [];
    if (d.revenue_per_volume) ulines.push({
      label: LANG === "fr" ? "Revenu par unité" : "Revenue per unit",
      values: d.revenue_per_volume, color: SERIES_COLORS[0], on: true });
    if (d.opex_per_volume) ulines.push({
      label: LANG === "fr" ? "Coût par unité" : "Cost per unit",
      values: d.opex_per_volume, color: SERIES_COLORS[2], on: true });
    const uc = { pseudo: true, sheet: T.fin_unit,
      loc: T.fin_per(met.volume.label.slice(0, 24)),
      chart: { kind: "timeseries", periods: m.periods, series: [], other: null,
               truncated: false }, lines: ulines, i: CHARTS.length, range: null };
    CHARTS.push(uc);
    unitCard = chartCard(uc, false);
  }
  if (d.volume_ratio && met.volume_secondary) {
    const conv = { pseudo: true,
      sheet: T.fin_conv(met.volume_secondary.label.slice(0, 20), met.volume.label.slice(0, 20)),
      loc: null, chart: { kind: "profile", x: m.periods,
        y: d.volume_ratio.map(v => v != null ? +(v * 100).toFixed(2) : 0) },
      i: CHARTS.length, range: null };
    CHARTS.push(conv);
    convCard = chartCard(conv, false);
  }

  // breakdown panels: ranked bars — fill fades by rank, ONE shared scale
  const RANK_FADE = ["#a8821f", "#c2a960", "#d5c391"];
  const bds = (m.breakdowns || []).slice(0, 4).map(b => {
    const items = b.items.slice(0, 6);
    const mx = Math.max(1, ...items.map(i => Math.abs(i.value)));
    const rows = items.map((it, k) => `<div class="rrow ${k === 0 ? "top" : ""}">
        <span class="rl">${esc(it.label.slice(0, 38))}</span>
        <span class="rtrack"><span style="width:${Math.max(2, Math.abs(it.value) / mx * 100).toFixed(1)}%;background:${RANK_FADE[Math.min(k, 2)]}"></span></span>
        <span class="rv">${compact(it.value)}</span>
      </div>`).join("");
    const hidden = b.items.length - items.length;
    const foot = hidden > 0
      ? `<div class="rfoot">${T.fin_rfoot(items.length, b.items.length,
          compact(b.items.slice(items.length).reduce((t, x) => t + Math.abs(x.value), 0)))}</div>` : "";
    return `<div class="card"><div class="card-head">
        <span class="ct">${esc(b.sheet)}</span>
        <span class="cs">${T.fin_top(esc(b.value_col.slice(0, 26)))}</span></div>
      <div style="margin-top:8px">${rows}</div>${foot}</div>`;
  }).join("");

  return `<section id="sec-financials"><span class="kicker">${execView ? T.xt_costs_kicker : T.fin_kicker}</span>
    ${stats.length ? `<div class="statbar">${stats.join("")}</div>` : ""}
    <div class="grid2">${chartCard(traj, false)}${marginCard}</div>
    ${unitCard || convCard ? `<div class="grid2" style="margin-top:14px">${unitCard}${convCard}</div>` : ""}
    ${finTable(m)}
    ${bds ? `<div class="grid2" style="margin-top:14px">${bds}</div>` : ""}
    ${execView ? "" : mappingCard()}
  </section>`;
}

/* ---------- production: monthly actuals from date-axis matrices --------- */
const derLabel = k => T["der_" + k] || k;

function renderProduction() {
  const mo = REPORT.model && REPORT.model.monthly;
  if (!mo) return "";
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const met = mo.metrics;

  const stats = Object.entries(met).map(([role, s]) =>
    `<span>${T.pr_total(ROLE_LABELS[role] || role)} <b>${compact(sum(s.values))}</b></span>`);
  const vr = mo.derived.volume_ratio;
  let avg = null;
  if (vr) {
    const vals = vr.filter(v => v != null);
    if (vals.length) avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (avg != null)
      stats.push(`<span>${T.pr_ratio} <b>${(avg * 100).toFixed(1)}%</b></span>`);
  }
  const prim = met.volume || Object.values(met)[0];
  if (prim) {
    let pi = -1, pv = -Infinity;
    prim.values.forEach((v, i) => { if (v != null && v > pv) { pv = v; pi = i; } });
    if (pi >= 0) stats.push(`<span>${T.pr_peak} <b>${esc(String(mo.periods[pi]))}</b>
      <span class="muted">(${compact(pv)})</span></span>`);
  }

  const lines = Object.entries(met).map(([role, s], k) => ({
    label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 26)}`,
    values: s.values, color: SERIES_COLORS[k % SERIES_COLORS.length], on: true,
  }));
  const volChart = { pseudo: true, sheet: T.pr_chart,
    loc: PAGE === "exec" ? null : T.pr_src(String(mo.source_sheet || "").trim()),
    chart: { kind: "timeseries", periods: mo.periods, series: [], other: null,
             truncated: false }, lines, i: CHARTS.length, range: null };
  CHARTS.push(volChart);

  let ratioCard = "";
  if (vr && vr.some(v => v != null)) {
    const rc = { pseudo: true, sheet: T.pr_ratio_chart,
      loc: avg != null ? T.pr_avg(`${(avg * 100).toFixed(1)}%`) : null,
      chart: { kind: "profile", x: mo.periods,
               y: vr.map(v => v != null ? +(v * 100).toFixed(2) : 0) },
      i: CHARTS.length, range: null };
    CHARTS.push(rc);
    ratioCard = chartCard(rc, false);
  }

  // actual $/t against the plan — everything here is pipeline-computed
  // (mo.derived + mo.unit_cost_budget); this block only formats it
  let costCard = "";
  const ub = mo.unit_cost_budget;
  if (ub) {
    const actual = mo.derived[ub.basis];
    const lastIdx = actual.map((v, i) => v != null ? i : -1)
      .reduce((a, b) => Math.max(a, b), -1);
    if (lastIdx >= 0) {
      const pct = ub.variance_pct[lastIdx];
      const over = pct != null && pct > 0;
      stats.push(`<span>${derLabel(ub.basis)} <b>${compact(actual[lastIdx])}</b>
        <b style="color:var(--${over ? "critical" : "good"})">${T.pr_vs_budget(pct, ub.target_period)}</b></span>`);
    }
    const cc = { pseudo: true, sheet: T.pr_cost_chart,
      loc: T.pr_cost_target(compact(ub.target), ub.target_period),
      chart: { kind: "timeseries", periods: mo.periods, series: [],
               other: null, truncated: false },
      lines: [
        { label: derLabel(ub.basis), values: actual,
          color: SERIES_COLORS[0], on: true },
        { label: T.pr_budget_line(ub.target_period),
          values: mo.periods.map(() => ub.target),
          color: OTHER_COLOR, on: true },
      ], i: CHARTS.length, range: null };
    CHARTS.push(cc);
    costCard = chartCard(cc, false);
  }

  return `<section id="sec-production"><span class="kicker">${T.pr_kicker}</span>
    ${stats.length ? `<div class="statbar">${stats.join("")}</div>` : ""}
    <div class="grid2">${chartCard(volChart, false)}${ratioCard}${costCard}</div>
  </section>`;
}

/* ---------- config-first mapping: pin role -> series, gated by checks --- */
let MAP_EDIT = false;

function mappingCard() {
  const avail = mappableSeries();
  if (!avail.length) return "";
  const mp = REPORT.mapping;
  const prov = mp ? (mp.provenance || {}) : null;
  const rec = mp ? (mp.reconciliation || {}) : null;
  const chip = !mp ? ""
    : prov.kind === "inherited"
      ? `<span class="schip good">${T.mp_chip_inherited(esc(String(prov.from || "").slice(0, 26)))}</span>`
      : `<span class="schip good">${T.mp_chip_manual}</span>`;
  const recChip = !mp ? "" : rec.ok === true
    ? `<span class="schip good">✓ ${T.mp_verified}</span>`
    : `<span class="schip warn">${T.mp_unverified}</span>`;

  const current = {};
  if (mp && mp.roles)
    for (const [role, ref] of Object.entries(mp.roles)) current[role] = ref.label;
  else if (REPORT.model)
    for (const [role, s] of Object.entries(REPORT.model.metrics)) current[role] = s.label;

  let body;
  if (!MAP_EDIT) {
    const rows = Object.entries(current).map(([role, label]) => `
      <div class="bar-row" style="display:flex;gap:10px;align-items:baseline">
        <span class="bl" style="min-width:150px">${ROLE_LABELS[role] || role}</span>
        <span class="bv">${esc(String(label).slice(0, 36))}</span></div>`).join("");
    body = rows +
      `<div style="margin-top:10px"><button class="iconbtn" id="mp-edit">${T.mp_edit}</button>
       ${mp ? `<button class="iconbtn" id="mp-clear">${T.mp_clear}</button>` : ""}</div>`;
  } else {
    const opts = sel => `<option value="">${T.mp_auto}</option>` + avail.map(a =>
      `<option value="${esc(a.sheet)}|||${esc(a.label)}"${sel === a.label ? " selected" : ""}>${
        esc(String(a.label).slice(0, 36))} — ${esc(String(a.sheet).slice(0, 18))}</option>`).join("");
    const roles = ["revenue", "opex", "budget", "volume", "volume_secondary",
                   "price", "capex", "area", "margin"];
    body = roles.map(role => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span class="sln" style="min-width:150px">${ROLE_LABELS[role] || role}</span>
        <select data-mprole="${role}" style="flex:1;font:inherit;font-size:12.5px;padding:5px 8px;
          background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--ink)">${
          opts(current[role])}</select></div>`).join("") +
      `<div id="mp-error" class="chcap" style="color:var(--critical)"></div>
       <div style="margin-top:10px;display:flex;gap:8px">
         <button class="runbtn" id="mp-save" style="max-width:220px">${T.mp_save}</button>
         <button class="iconbtn" id="mp-cancel">${T.mp_cancel}</button></div>`;
  }
  const recDetail = mp && rec.checks && rec.checks.length
    ? `<div class="chcap" style="margin-top:8px">${rec.checks.map(c =>
        `${c.ok ? "✓" : "✕"} ${esc(c.detail)} · Δ ${(c.max_rel_delta * 100).toFixed(2)}%`).join(" &nbsp;·&nbsp; ")}</div>`
    : "";
  return `<div class="card" style="margin-top:14px"><div class="card-head">
      <span class="ct">${T.mp_title}</span><span class="cs">${T.mp_sub}</span>
      <span style="flex:1"></span>${chip}${recChip}</div>
    <div style="margin-top:10px">${body}</div>${recDetail}</div>`;
}

function attachMapping() {
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("#mp-edit", () => { MAP_EDIT = true; renderAll(); });
  on("#mp-cancel", () => { MAP_EDIT = false; renderAll(); });
  on("#mp-clear", async () => {
    const out = await fetch(`/analyses/${current}/mapping`, { method: "DELETE" })
      .then(r => r.json());
    REPORT.mapping = null; REPORT.model = out.model; MAP_EDIT = false;
    renderAll();
  });
  on("#mp-save", async () => {
    const mapping = {};
    $$("select[data-mprole]").forEach(sel => {
      if (!sel.value) return;
      const [sheet, label] = sel.value.split("|||");
      mapping[sel.dataset.mprole] = { sheet, label };
    });
    if (!Object.keys(mapping).length) return;
    const res = await fetch(`/analyses/${current}/mapping`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mapping }) });
    if (res.ok) {
      const out = await res.json();
      REPORT.model = out.model; REPORT.mapping = out.mapping;
      MAP_EDIT = false;
      renderAll();
      setStatus(T.mp_saved);
    } else {
      const err = await res.json().catch(() => ({}));
      const d = err.detail;
      const msg = typeof d === "string" ? d
        : d && d.reconciliation
          ? d.reconciliation.checks.filter(c => c.ok === false)
              .map(c => `${c.detail} — Δ ${(c.max_rel_delta * 100).toFixed(1)}%`).join("; ")
          : "";
      const el = $("#mp-error");
      if (el) el.textContent = `${T.mp_err}${msg ? ": " + msg : ""}`;
    }
  });
}

/* every detected series + derived indicator, one row each, periods across —
   the "read the whole plan in one screen" table; formats only, no math */
function finTable(m) {
  const mpctCls = v => v == null ? "" : v >= 50 ? "good" : v >= 20 ? "warn" : "bad";
  const rows = [];
  for (const [role, s] of Object.entries(m.metrics))
    rows.push({ label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 24)}`,
      values: s.values, fmt: compact });
  const D = m.derived, derived = [
    ["margin", compact, null],
    ["margin_pct", v => `${v.toFixed(0)}%`, mpctCls],
    ["opex_per_volume", compact, null],
    ["opex_per_volume_out", compact, null],
    ["revenue_per_volume", compact, null],
    ["revenue_per_area", compact, null],
    ["opex_per_area", compact, null],
    ["volume_ratio", v => `${(v * 100).toFixed(1)}%`, null],
    ["opex_budget_variance_pct",
      v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}%`,
      v => v == null ? "" : v > 0 ? "bad" : "good"],
  ];
  for (const [key, fmt, cls] of derived)
    if (D[key] && D[key].some(v => v != null))
      rows.push({ label: T["der_" + key], values: D[key], fmt, cls });
  if (!rows.length) return "";
  const last = m.periods.length - 1;
  const body = rows.map(r => `<tr><td>${esc(r.label)}</td>${
    m.periods.map((_, i) => {
      const v = r.values[i];
      const cls = [i === last ? "hi" : "", r.cls ? r.cls(v) : ""].join(" ").trim();
      return `<td${cls ? ` class="${cls}"` : ""}>${v == null ? "—" : r.fmt(v)}</td>`;
    }).join("")}</tr>`).join("");
  return `<div class="card" style="margin-top:14px"><div class="card-head">
      <span class="ct">${T.fin_table}</span><span class="cs">${T.fin_table_sub}</span></div>
    <div class="ftwrap" style="margin-top:8px"><table class="ftable">
      <thead><tr><th>${T.fin_ind}</th>${m.periods.map(p =>
        `<th>${esc(String(p))}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

/* ---------- scenario analysis + monte carlo (generic over the model) ----- */
const SCEN_DEFS = {
  bear:   { label: T.sc_bear, color: "#b03a2a", price: 0.7, vol: 0.85, cost: 1.2, ext: 0.9 },
  base:   { label: T.sc_base, color: "#a8821f", price: 1.0, vol: 1.0,  cost: 1.0, ext: 1.0 },
  bull:   { label: T.sc_bull, color: "#2c5f1a", price: 1.3, vol: 1.1,  cost: 0.9, ext: 1.08 },
  custom: { label: T.sc_custom, color: "#c8a04a" },
};
let SCEN = { price: 1.0, vol: 1.0, cost: 1.0, ext: 1.0 };
let MCP = { priceSd: 0.15, volSd: 0.10, costSd: 0.08, N: 2000, metric: "rev" };
let MC_RESULTS = null;

function scenSeries(f) {           // apply factors to the model, per period
  const m = REPORT.model, rev = m.metrics.revenue.values;
  const opx = m.metrics.opex ? m.metrics.opex.values : null;
  // the conversion lever only exists when the file has an input->output
  // ratio (two volume series); it scales output, hence revenue
  const e = m.derived.volume_ratio ? (f.ext ?? 1) : 1;
  return rev.map((r, i) => {
    if (r == null) return { rev: null, opex: null, margin: null, marginPct: null };
    const r2 = r * f.price * f.vol * e;
    const o2 = opx && opx[i] != null ? opx[i] * f.cost : null;
    const mg = o2 != null ? r2 - o2 : null;
    return { rev: r2, opex: o2, margin: mg,
             marginPct: mg != null && r2 ? mg / r2 * 100 : null };
  });
}
const scenTotal = rows => rows.reduce((t, r) => t + (r.rev ?? 0), 0);

function renderScenario() {
  const m = REPORT.model;
  if (!m || !m.scenario_ready) return "";
  const hasCost = !!m.metrics.opex;
  const scens = {
    bear: scenSeries(SCEN_DEFS.bear), base: scenSeries(SCEN_DEFS.base),
    bull: scenSeries(SCEN_DEFS.bull), custom: scenSeries(SCEN),
  };
  const cards = Object.entries(SCEN_DEFS).map(([k, d]) => {
    const rows = scens[k];
    const mt = rows.reduce((t, r) => t + (r.margin ?? 0), 0);
    const f = k === "custom" ? SCEN : d;
    const lastM = [...rows].reverse().find(r => r.marginPct != null);
    return `<div class="scard" style="--scolor:${d.color}">
      <div class="sn">${d.label}</div>
      <div class="sv">${compact(scenTotal(rows))}</div>
      <div class="ss">${T.sc_total}${hasCost ? ` · ${T.sc_margin(compact(mt))}` : ""}</div>
      ${hasCost && lastM ? `<div class="ss">${T.sc_final(esc(String(m.periods[rows.lastIndexOf(lastM)])))} <b>${lastM.marginPct.toFixed(0)}%</b></div>` : ""}
      <div class="ss" style="margin-top:2px">${T.sc_assume(deltaPct(f.price), deltaPct(f.vol), hasCost ? deltaPct(f.cost) : null)}</div>
    </div>`;
  }).join("");

  const lines = Object.entries(SCEN_DEFS).map(([k, d]) => ({
    label: d.label, color: d.color, on: true,
    values: scens[k].map(r => r.rev),
  }));
  const chart = { pseudo: true, i: "scen", range: null, lines,
    chart: { kind: "timeseries", periods: m.periods, series: [], other: null, truncated: false } };

  // margin % per scenario, per period — the reference's second lens
  let marginChart = "";
  if (hasCost) {
    const mlines = Object.entries(SCEN_DEFS).map(([k, d]) => ({
      label: d.label, color: d.color, on: true,
      values: scens[k].map(r => r.marginPct == null ? null : +r.marginPct.toFixed(1)),
    }));
    const mc = { pseudo: true, i: "scenm", range: null, lines: mlines,
      chart: { kind: "timeseries", periods: m.periods, series: [], other: null, truncated: false } };
    marginChart = `<div class="card chart-card" style="margin-top:14px">
      <div class="card-head"><span class="ct">${T.sc_mchart}</span>
        <span class="cs">%</span></div>
      <div class="plot">${svgTimeseries(mc)}</div>
      <div class="legend">${mlines.map(l => `<span class="lg"><span class="sw" style="background:${l.color}"></span>${l.label}</span>`).join("")}</div>
    </div>`;
  }

  // conversion-rate lever, shown as the real resulting rate, not a factor
  const vr = m.derived.volume_ratio;
  const baseExt = vr ? [...vr].reverse().find(v => v != null) : null;
  const extSlider = baseExt
    ? slider(T.sc_extract, "ext", 0.7, 1.3, 0.02, SCEN.ext ?? 1,
        v => `${(baseExt * v * 100).toFixed(1)}%`)
    : "";

  const sliders = `
    ${slider(T.sc_price, "price", 0.5, 1.8, 0.05, SCEN.price, deltaPct)}
    ${slider(T.sc_vol, "vol", 0.5, 1.5, 0.05, SCEN.vol, deltaPct)}
    ${extSlider}
    ${hasCost ? slider(T.sc_cost, "cost", 0.7, 1.5, 0.05, SCEN.cost, deltaPct) : ""}
    <div style="margin-top:10px">
      ${Object.entries(SCEN_DEFS).filter(([k]) => k !== "custom").map(([k, d]) =>
        `<button class="preset" data-preset="${k}" style="background:${d.color}22;color:${d.color}">${d.label}</button>`).join("")}
    </div>`;

  return `<section id="sec-scenario"><span class="kicker">${T.sc_kicker}</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px">${cards}</div>
    <div class="scen-grid">
      <div class="card"><div class="card-head"><span class="ct">${T.sc_levers}</span></div>
        <div style="margin-top:10px">${sliders}</div></div>
      <div class="card chart-card"><div class="card-head"><span class="ct">${T.sc_chart}</span>
        <span class="cs">${esc(m.metrics.revenue.label.slice(0, 30))} · ${T.sc_adj}</span></div>
        <div class="plot">${svgTimeseries(chart)}</div>
        <div class="legend">${lines.map(l => `<span class="lg"><span class="sw" style="background:${l.color}"></span>${l.label}</span>`).join("")}</div>
      </div>
    </div>
    ${marginChart}
    ${scenTable(m, scens, hasCost)}</section>`;
}

/* year × scenario comparison — every number from the factor math above */
function scenTable(m, scens, hasCost) {
  const keys = Object.keys(SCEN_DEFS);
  const cols = hasCost ? [["rev", T.sc_th_rev], ["opex", T.sc_th_opex],
                          ["marginPct", T.sc_th_margin]] : [["rev", T.sc_th_rev]];
  const cell = (v, key) => v == null ? "—"
    : key === "marginPct" ? `${v.toFixed(0)}%` : compact(v);
  const cls = (v, key) => key !== "marginPct" || v == null ? ""
    : v >= 50 ? "good" : v >= 20 ? "warn" : "bad";
  const head1 = `<tr><th></th>${keys.map(k =>
    `<th colspan="${cols.length}" style="color:${SCEN_DEFS[k].color}">${SCEN_DEFS[k].label}</th>`).join("")}</tr>`;
  const head2 = `<tr><th></th>${keys.map(() =>
    cols.map(([, lb]) => `<th>${lb}</th>`).join("")).join("")}</tr>`;
  const body = m.periods.map((p, i) => `<tr><td>${esc(String(p))}</td>${
    keys.map(k => cols.map(([key]) => {
      const v = scens[k][i][key];
      const c = cls(v, key);
      return `<td${c ? ` class="${c}"` : ""}>${cell(v, key)}</td>`;
    }).join("")).join("")}</tr>`).join("");
  const totals = `<tr class="total"><td>${T.sc_total_row}</td>${keys.map(k => {
    const rows = scens[k];
    const tr = rows.reduce((t, r) => t + (r.rev ?? 0), 0);
    const to = rows.reduce((t, r) => t + (r.opex ?? 0), 0);
    const mp = tr ? (tr - to) / tr * 100 : null;
    return cols.map(([key]) => key === "rev" ? `<td>${compact(tr)}</td>`
      : key === "opex" ? `<td>${compact(to)}</td>`
      : `<td class="${cls(mp, "marginPct")}">${mp == null ? "—" : mp.toFixed(0) + "%"}</td>`).join("");
  }).join("")}</tr>`;
  return `<div class="card" style="margin-top:14px"><div class="card-head">
      <span class="ct">${T.sc_table}</span><span class="cs">${T.sc_table_sub}</span></div>
    <div class="ftwrap" style="margin-top:8px"><table class="ftable">
      <thead>${head1}${head2}</thead><tbody>${body}${totals}</tbody></table></div></div>`;
}

function slider(name, key, min, max, step, val, fmt) {
  return `<div class="sl"><div class="slh"><span class="sln">${name}</span>
    <span class="slv">${fmt(val)}</span></div>
    <input type="range" data-scen="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}

function attachScenario() {
  $$('#sec-scenario input[data-scen]').forEach(inp => inp.addEventListener("input", () => {
    SCEN[inp.dataset.scen] = +inp.value;
    refreshScenario();
  }));
  $$('#sec-scenario .preset').forEach(b => b.addEventListener("click", () => {
    const d = SCEN_DEFS[b.dataset.preset];
    SCEN = { price: d.price, vol: d.vol, cost: d.cost, ext: d.ext ?? 1 };
    refreshScenario();
  }));
}
function refreshScenario() {
  const sec = $("#sec-scenario");
  if (!sec) return;
  sec.outerHTML = renderScenario();
  attachScenario();
}

/* monte carlo */
function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function runMC() {
  const out = [];
  for (let i = 0; i < MCP.N; i++) {
    const f = {
      price: Math.max(0.2, 1 + gauss() * MCP.priceSd),
      vol: Math.max(0.2, 1 + gauss() * MCP.volSd),
      cost: Math.max(0.4, 1 + gauss() * MCP.costSd),
    };
    const rows = scenSeries(f);
    const lastM = [...rows].reverse().find(r => r.marginPct != null);
    out.push({ price: f.price,
      rev: rows.reduce((t, r) => t + (r.rev ?? 0), 0),
      margin: rows.reduce((t, r) => t + (r.margin ?? 0), 0),
      mpct: lastM ? lastM.marginPct : null });
  }
  MC_RESULTS = out;
}
const pctl = (a, p) => a[Math.min(a.length - 1, Math.floor(p / 100 * a.length))];

/* which outcome the histogram measures — margin lenses need a cost series */
function mcMetrics() {
  const out = [["rev", T.mc_metric_rev]];
  if (REPORT.model && REPORT.model.metrics.opex)
    out.push(["margin", T.mc_metric_margin], ["mpct", T.mc_metric_mpct]);
  return out;
}
function mcBase(key) {
  const rows = scenSeries(SCEN_DEFS.base);
  if (key === "mpct") {
    const lastM = [...rows].reverse().find(r => r.marginPct != null);
    return lastM ? lastM.marginPct : null;
  }
  return rows.reduce((t, r) => t + (r[key === "rev" ? "rev" : "margin"] ?? 0), 0);
}

/* price factor vs outcome, one dot per sampled draw — hand-built, no libs */
function mcScatter(draws, key, fmtV) {
  const pts = draws.filter((_, i) => i % Math.max(1, Math.floor(draws.length / 160)) === 0)
    .map(d => [d.price, d[key]]).filter(([, v]) => v != null);
  if (pts.length < 10) return "";
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const HS = 200, MT = 12;
  const px = v => ML + (v - x0) / ((x1 - x0) || 1) * (W - ML - MR);
  const py = v => MT + (1 - (v - y0) / ((y1 - y0) || 1)) * (HS - MT - MB);
  const dots = pts.map(([x, y]) =>
    `<circle cx="${px(x).toFixed(1)}" cy="${py(y).toFixed(1)}" r="2" fill="var(--gold)" fill-opacity=".45"/>`).join("");
  const gy = [y0, (y0 + y1) / 2, y1].map(v => `
    <line x1="${ML}" x2="${W - MR}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}" stroke="var(--hairline)" stroke-dasharray="2 4"/>
    <text x="${ML - 6}" y="${(py(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">${fmtV(v)}</text>`).join("");
  const gx = [x0, 1, x1].filter((v, i, a) => a.indexOf(v) === i).map(v => `
    <text x="${px(v).toFixed(1)}" y="${HS - 8}" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">×${v.toFixed(2)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${HS}" role="img">${gy}${gx}${dots}
    <text x="${W - MR}" y="${HS - 8}" text-anchor="end" font-size="9" fill="var(--ink-3)">${T.mc_price_axis}</text></svg>`;
}

function renderMC() {
  const m = REPORT.model;
  if (!m || !m.scenario_ready) return "";
  const metrics = mcMetrics();
  if (!metrics.some(([k]) => k === MCP.metric)) MCP.metric = "rev";
  const mLabel = metrics.find(([k]) => k === MCP.metric)[1];
  const fmtV = MCP.metric === "mpct" ? v => `${v.toFixed(1)}%` : compact;
  const picker = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${
    metrics.map(([k, lb]) => `<button class="preset ${k === MCP.metric ? "on" : ""}" data-mcmetric="${k}"
      style="${k === MCP.metric ? "background:var(--ink);color:var(--card)" : ""}">${lb}</button>`).join("")}</div>`;

  let body = `<div class="muted" style="padding:24px 0;text-align:center">${T.mc_press}</div>`;
  if (MC_RESULTS) {
    const r = MC_RESULTS.map(d => d[MCP.metric]).filter(v => v != null).sort((a, b) => a - b);
    const base = mcBase(MCP.metric);
    const p10 = pctl(r, 10), p50 = pctl(r, 50), p90 = pctl(r, 90);
    const mean = r.reduce((a, b) => a + b, 0) / r.length;
    const sd = Math.sqrt(r.reduce((s, v) => s + (v - mean) ** 2, 0) / r.length);
    const bins = 30, mn = r[0], mx = r[r.length - 1], step = (mx - mn) / bins || 1;
    const y = Array.from({ length: bins }, () => 0);
    for (const v of r) y[Math.min(bins - 1, Math.floor((v - mn) / step))]++;
    const hist = { pseudo: true, i: "mc", range: null,
      chart: { kind: "profile", x: y.map((_, i2) => fmtV(mn + i2 * step)), y } };
    // dashed P10/P50/P90 marker lines over the histogram (spec §11)
    const band = (W - ML - MR) / bins;
    const marks = [[p10, "#b03a2e", "P10"], [p50, "#201d17", "P50"], [p90, "#0a7d33", "P90"]]
      .map(([v, col, lb]) => {
        const x = ML + band * Math.min(bins, Math.max(0, (v - mn) / step));
        return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${mtCur() + 10}" y2="${H - MB}"
            stroke="${col}" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="${(x + 4).toFixed(1)}" y="${mtCur() + 8}" font-size="8.5" fill="${col}"
            font-family="'IBM Plex Mono',ui-monospace,monospace">${lb}</text>`;
      }).join("");
    const histSvg = svgProfile(hist).replace("</svg>", marks + "</svg>");
    const probs = base ? [0.8, 1.0, 1.2].map(f2 => {
      const t = base * f2, p = r.filter(v => v >= t).length / r.length * 100;
      return `<div class="prob-row"><span>${T.mc_row(mLabel, fmtV(t), (f2*100).toFixed(0))}</span>
        <span class="pv" style="color:${p >= 70 ? "var(--good)" : p >= 40 ? "var(--gold)" : "var(--critical)"}">${p.toFixed(1)}%</span></div>`;
    }).join("") : "";
    const scatter = mcScatter(MC_RESULTS, MCP.metric, fmtV);
    body = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px">
        <div class="scard" style="--scolor:#b03a2a"><div class="sn">${T.mc_p10}</div><div class="sv">${fmtV(p10)}</div></div>
        <div class="scard" style="--scolor:#a8821f"><div class="sn">${T.mc_p50}</div><div class="sv">${fmtV(p50)}</div></div>
        <div class="scard" style="--scolor:#2c5f1a"><div class="sn">${T.mc_p90}</div><div class="sv">${fmtV(p90)}</div></div>
        <div class="scard" style="--scolor:#8a8375"><div class="sn">${T.mc_mean}</div><div class="sv">${fmtV(mean)}</div>
          <div class="ss">σ = ${fmtV(sd)}</div></div>
      </div>
      <div class="grid2">
        <div class="card chart-card"><div class="card-head"><span class="ct">${T.mc_dist(mLabel)}</span>
          <span class="cs">${T.mc_draws(nf.format(MCP.N))}</span></div>
          <div class="plot">${histSvg}</div>
          <div class="chcap">${T.mc_range(fmtV(p10), fmtV(p90))}</div></div>
        <div class="card"><div class="card-head"><span class="ct">${T.mc_prob}</span></div>${probs}</div>
      </div>
      ${scatter ? `<div class="card chart-card" style="margin-top:14px">
        <div class="card-head"><span class="ct">${T.mc_scatter}</span>
          <span class="cs">${T.mc_scatter_sub}</span></div>
        <div class="plot">${scatter}</div></div>` : ""}`;
  }
  return `<section id="sec-mc"><span class="kicker">${T.mc_kicker}</span>
    <div class="scen-grid">
      <div class="card"><div class="card-head"><span class="ct">${T.mc_unc}</span></div>
        <div style="margin-top:10px">
        ${mcslider(T.mc_price, "priceSd", 0.02, 0.4, 0.01, MCP.priceSd)}
        ${mcslider(T.mc_vol, "volSd", 0.02, 0.3, 0.01, MCP.volSd)}
        ${REPORT.model.metrics.opex ? mcslider(T.mc_cost, "costSd", 0.02, 0.3, 0.01, MCP.costSd) : ""}
        ${mcslider(T.mc_n, "N", 500, 5000, 500, MCP.N)}
        <button class="runbtn" id="mc-run">${T.mc_run(nf.format(MCP.N))}</button>
        </div></div>
      <div>${picker}<div id="mc-body">${body}</div></div>
    </div></section>`;
}
function mcslider(name, key, min, max, step, val) {
  const fmt = key === "N" ? v => (+v).toLocaleString() : v => "±" + (v * 100).toFixed(0) + "%";
  return `<div class="sl"><div class="slh"><span class="sln">${name}</span>
    <span class="slv">${fmt(val)}</span></div>
    <input type="range" data-mc="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function attachMC() {
  $$('#sec-mc input[data-mc]').forEach(inp => inp.addEventListener("input", () => {
    MCP[inp.dataset.mc] = +inp.value;
    const sec = $("#sec-mc"); sec.outerHTML = renderMC(); attachMC();
  }));
  $$('#sec-mc [data-mcmetric]').forEach(b => b.addEventListener("click", () => {
    MCP.metric = b.dataset.mcmetric;
    const sec = $("#sec-mc"); sec.outerHTML = renderMC(); attachMC();
  }));
  const run = $("#mc-run");
  if (run) run.addEventListener("click", () => {
    runMC();
    const sec = $("#sec-mc"); sec.outerHTML = renderMC(); attachMC();
  });
}

/* ---------- insights: decision-support bullets from the data ---------- */
function pct(a, b) { return b ? ((a - b) / Math.abs(b) * 100) : null; }

function renderInsights() {
  const out = [];   // {html, sheet}

  // 1. corrections story: what fixing the high-confidence cells is worth
  const fixable = AUDIT.findings
    .map(f => ({ ...f, safe: f.fix_confidence === "high"
      ? f.mismatches.filter(m => m.suggest !== false) : [] }))
    .filter(f => f.safe.length);
  if (fixable.length) {
    const cells = fixable.reduce((t, f) => t + f.safe.length, 0);
    const worth = fixable.reduce((t, f) =>
      t + f.safe.reduce((u, m) => u + Math.abs(m.delta), 0), 0);
    out.push({ html: T.ins_fix(cells, compact(worth), compact(AUDIT.total_abs_delta)) });
    const worst = fixable[0], m = worst.safe[0];
    if (m) out.push({ sheet: worst.sheet,
      html: T.ins_largest(esc(worst.sheet),
        m.cell ? T.ins_cell(esc(m.cell)) : T.ins_row(m.row),
        esc(m.label), num(m.actual), num(m.expected), worst.n_matched) });
  } else if (AUDIT.findings.length === 0) {
    out.push({ html: T.ins_ok });
  }

  // 2. trend: latest movement of the biggest time series
  const ts = visCharts().filter(c => c.chart.kind === "timeseries")
    .sort((a, b) => b.chart.periods.length - a.chart.periods.length)[0];
  if (ts && ts.lines.length) {
    const s = ts.lines[0];
    const pts = s.values.map((v, i) => [v, i]).filter(([v]) => v != null);
    if (pts.length >= 2) {
      const [vLast, iLast] = pts[pts.length - 1], [vPrev] = pts[pts.length - 2];
      const p = pct(vLast, vPrev);
      out.push({ sheet: ts.sheet,
        html: T.ins_latest(esc(ts.sheet), esc(String(ts.chart.periods[iLast])),
          esc(s.label), num(vLast)) +
          (p != null ? " " + T.ins_vs(`<span style="color:${p >= 0 ? "var(--good)" : "var(--critical)"}">${p >= 0 ? "+" : ""}${p.toFixed(1)}%</span>`) : "") + "." });
    }
  }

  // 3. seasonality: where the biggest profile peaks
  const pf = visCharts().filter(c => c.chart.kind === "profile")
    .sort((a, b) => Math.max(...b.chart.y) - Math.max(...a.chart.y))[0];
  if (pf) {
    const iMax = pf.chart.y.indexOf(Math.max(...pf.chart.y));
    out.push({ sheet: pf.sheet, html: T.ins_peak(esc(pf.sheet),
      esc(String(pf.chart.x[iMax])), compact(pf.chart.y[iMax])) });
  }

  // 4. server-side EDA: drivers, gaps, duplicates (computed on full data)
  const SEV = { high: "var(--critical)", medium: "var(--warning)", low: "var(--ink-3)" };
  for (const i of (REPORT.insights || []).slice(0, 3)) {
    const msg = LANG === "fr" && i.message_fr ? i.message_fr : i.message;
    out.push({ sheet: i.sheet, html: `<span style="color:${SEV[i.severity] || "var(--ink-3)"}">●</span>
      <b>${esc(i.sheet)}</b> — ${esc(msg)}` });
  }

  // 5. what still needs a human
  if (AUDIT.n_unverified_relations) {
    out.push({ html: T.ins_unv(AUDIT.n_unverified_relations) });
  }

  if (!out.length) return "";
  return `<div class="card" style="margin-top:16px"><div class="card-head">
      <span class="ct">${T.ins_title}</span><span class="cs">${T.ins_sub}</span></div>
    ${out.slice(0, 5).map(i => `<div class="bar-row ${i.sheet ? "clicky" : ""}"
      ${i.sheet ? `data-sheet="${esc(i.sheet)}"` : ""}>
      <span style="font-size:13px;line-height:1.55">${i.html}</span></div>`).join("")}
  </div>`;
}

/* ---------- charts ---------- */
/* one gold primary per chart, one contrasting blue, then warm context greys */
const SERIES_COLORS = ["#a8821f", "#5c6f8a", "#b9ad8d", "#c8bfa7", "#a39a82"];
const OTHER_COLOR = "#d5ccb4";
const W = 720, H = 250, ML = 52, MR = 14, MB = 30;
// executive charts reserve headroom for the peak/latest annotations
const mtCur = () => MODE === "exec" ? 44 : 12;

function collectCharts(report) {
  const out = [];
  for (const s of report.sheets) {
    const grab = (tidy, loc) => {
      const c = tidy && tidy.summary && tidy.summary.chart;
      if (c) out.push({ sheet: s.name, loc, chart: c });
    };
    grab(s.tidy, null);
    for (const p of s.panels || []) {
      grab(p.tidy, "col_start" in p && p.col_start != null
        ? `cols ${p.col_start}–${p.col_end}` : `rows ${p.row_start}–${p.row_end}`);
    }
  }
  return out.map((c, i) => {
    if (c.chart.kind === "timeseries") {
      const all = c.chart.series.concat(c.chart.other ? [c.chart.other] : []);
      c.lines = all.map((s, k) => ({
        label: LANG === "fr" ? s.label.replace(/^Other \(/, "Autres (") : s.label,
        values: s.values,
        color: k < c.chart.series.length ? SERIES_COLORS[k % SERIES_COLORS.length] : OTHER_COLOR,
        on: true,
      }));
    }
    c.i = i; c.range = null;                     // [lo,hi] from brush
    return c;
  });
}

function chartRange(c) {
  const n = c.chart.periods.length;
  if (c.range) return c.range;
  if (FILTER.periods === "p30" && n > 30) return [n - 30, n - 1];
  if (FILTER.periods === "p90" && n > 90) return [n - 90, n - 1];
  return [0, n - 1];
}

let SHOWALL = false;
function renderChartGrid() {
  const vis = visCharts().filter(c => !c.pseudo);
  if (!vis.length) return `<div class="card muted">${CHARTS.length ? T.ch_none_f : T.ch_none}</div>`;
  // progressive disclosure: a uniform grid of the first six, the rest
  // behind an explicit overflow card
  const show = (SHOWALL || vis.length <= 6) ? vis : vis.slice(0, 5);
  const hidden = vis.length - show.length;
  const over = hidden > 0 ? `<div class="overflow-card" id="show-all-charts">
      <span class="kicker">+ ${hidden} ${T.tr_more}</span>
      <div style="font-size:12.5px;color:var(--ink-3);max-width:34ch;margin:10px 0">${
        vis.slice(show.length, show.length + 4).map(c => esc(c.sheet.trim().slice(0, 22))).join(", ")}…</div>
      <span class="seeall">${T.tr_showall} →</span>
    </div>` : "";
  return `<div class="grid2">${show.map(c => chartCard(c, false)).join("")}${over}</div>`;
}

function chartCard(c, isPrimary) {
  const exec = MODE === "exec";
  let span;
  if (c.chart.kind === "timeseries") {
    const [lo, hi] = chartRange(c);
    span = T.ch_periods(hi - lo + 1, c.chart.periods.length);
  } else {
    span = T.ch_cols(c.chart.x.length);
  }
  const sub = [c.loc, span,
    c.chart.truncated ? T.ch_trunc : null].filter(Boolean).join(" · ");
  const legend = c.chart.kind === "timeseries" && c.lines.length > 1
    ? `<div class="legend">${c.lines.map((s, k) => `
        <span class="lg ${s.on ? "" : "off"}" data-chart="${c.i}" data-k="${k}">
          <span class="sw" style="background:${s.color}"></span>${esc(s.label)}</span>`).join("")}</div>` : "";
  const hint = c.chart.kind === "timeseries" && !exec
    ? `<div class="hint">${T.ch_hint}</div>` : "";
  const cumBtn = c.chart.kind === "profile" && !c.pseudo
    ? `<button class="iconbtn ${c.cum ? "on" : ""}" data-cum="${c.i}">${T.ch_cum}</button>` : "";
  const csvBtn = exec ? "" : `<button class="iconbtn" data-csv="${c.i}">⤓ csv</button>`;
  // one-line insight caption: every chart says what it means (spec, Trends)
  let cap = "";
  if (c.chart.kind === "timeseries") cap = execCapline(c);
  else if (c.chart.y && c.chart.y.length > 1) {
    const iMax = c.chart.y.indexOf(Math.max(...c.chart.y));
    if (iMax >= 0) cap = T.tr_prof_cap(esc(String(c.chart.x[iMax]).slice(0, 22)),
      compact(c.chart.y[iMax]));
  }
  return `<div class="card chart-card" data-chart="${c.i}" data-sheet="${esc(c.sheet)}">
    <div class="card-head"><span class="ct">${esc(c.sheet)}</span><span class="cs">${esc(sub)}</span>
      <span class="grow"></span>${cumBtn}${csvBtn}</div>
    <div class="plot">${c.chart.kind === "timeseries" ? svgTimeseries(c) : svgProfile(c)}</div>
    ${legend}${cap ? `<div class="chcap">${cap}</div>` : ""}${hint}<div class="tooltip"></div></div>`;
}

function yScale(vals) {
  const MT = mtCur();
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1;
  const pad = (hi - lo) * .06; hi += pad; if (lo < 0) lo -= pad;
  return v => MT + (H - MT - MB) * (1 - (v - lo) / (hi - lo));
}
const AXIS_FONT = `font-size="8.5" fill="#99917e" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" letter-spacing=".04em"`;
/* horizontal-only dashed gridlines, y labels right-aligned against the plot,
   and a solid baseline at zero with 4px tick marks */
function gridAndTicks(vals) {
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1;
  const sy = yScale(vals);
  const dash = MODE === "exec" ? "1 5" : "2 3";
  let g = "";
  for (let t = 1; t <= 3; t++) {
    const v = lo + (hi - lo) * t / 3, y = sy(v);
    g += `<line x1="${ML}" x2="${W - MR}" y1="${y}" y2="${y}" stroke="#e8e1cf" stroke-dasharray="${dash}"/>
          <text x="${ML - 7}" y="${y + 3}" text-anchor="end" ${AXIS_FONT}>${compact(v)}</text>`;
  }
  const y0 = sy(Math.max(0, lo));
  g += `<line x1="${ML}" x2="${W - MR}" y1="${y0}" y2="${y0}" stroke="#c9bfa8"/>
        <text x="${ML - 7}" y="${y0 + 3}" text-anchor="end" ${AXIS_FONT}>${compact(Math.max(0, lo))}</text>`;
  return g;
}
function baselineTick(x, y0) {
  return `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0 + 4}" stroke="#c9bfa8"/>`;
}
/* Catmull-Rom -> bezier: the executive headline line reads as one gesture */
function smoothPath(pts) {
  if (pts.length < 3) return pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i],
          p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ` +
         `${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ` +
         `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
/* leader-line annotation: mono kicker + semibold value over a ringed dot */
function annotate(x, y, kicker, value, anchor) {
  const above = y > 60;
  const ty = above ? y - 14 : y + 22;
  const leader = above
    ? `<line x1="${x}" x2="${x}" y1="${ty + 4}" y2="${y - 7}" stroke="#c9bfa8"/>`
    : `<line x1="${x}" x2="${x}" y1="${y + 7}" y2="${ty - 14}" stroke="#c9bfa8"/>`;
  return `${leader}
    <circle cx="${x}" cy="${y}" r="4" fill="#a8821f" stroke="#f6f3ec" stroke-width="1.5"/>
    <text x="${x}" y="${ty - 12}" text-anchor="${anchor}" ${AXIS_FONT} letter-spacing=".12em">${esc(kicker.toUpperCase())}</text>
    <text x="${x}" y="${ty}" text-anchor="${anchor}" font-size="12.5" font-weight="600"
      fill="#201d17" font-family="'IBM Plex Mono',ui-monospace,monospace">${esc(value)}</text>`;
}

function svgTimeseries(c) {
  const exec = MODE === "exec", MT = mtCur();
  const [lo, hi] = chartRange(c);
  const idx = i => lo + i;
  const n = hi - lo + 1;
  const on = c.lines.filter(s => s.on);
  const flat = on.flatMap(s => s.values.slice(lo, hi + 1).filter(v => v != null));
  if (!flat.length) return `<div class="muted" style="padding:30px 0;text-align:center">${T.ch_hidden}</div>`;
  const sy = yScale(flat);
  const sx = i => ML + (W - ML - MR) * (n === 1 ? .5 : i / (n - 1));
  const y0 = sy(Math.max(0, Math.min(0, ...flat)));

  let out = gridAndTicks(flat);
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) {
    out += baselineTick(sx(i), y0) +
      `<text x="${sx(i)}" y="${H - 8}" text-anchor="middle" ${AXIS_FONT}>${esc(String(c.chart.periods[idx(i)]).slice(0, 10))}</text>`;
  }
  // primary = the first visible series: gold, heavier; the rest are context
  const primary = on[0];
  for (let si = on.length - 1; si >= 0; si--) {
    const s = on[si];
    const pts = [];
    for (let i = 0; i < n; i++)
      if (s.values[idx(i)] != null) pts.push([sx(i), sy(s.values[idx(i)]), i]);
    if (!pts.length) continue;
    const isP = s === primary;
    if (exec && isP && pts.length > 2) {
      // executive headline line: one smooth gesture + gradient underlay
      const d = smoothPath(pts);
      out = `<defs><linearGradient id="gfill${c.i}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8821f" stop-opacity=".16"/>
          <stop offset="1" stop-color="#a8821f" stop-opacity="0"/>
        </linearGradient></defs>` + out +
        `<path d="${d} L${pts[pts.length - 1][0].toFixed(1)},${y0} L${pts[0][0].toFixed(1)},${y0} Z"
          fill="url(#gfill${c.i})" stroke="none"/>
        <path class="ln" pathLength="1" d="${d}" fill="none" stroke="${s.color}"
          stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    } else {
      let d = "", pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[idx(i)];
        if (v == null) { pen = false; continue; }
        d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; pen = true;
      }
      out += `<path class="ln" pathLength="1" d="${d}" fill="none" stroke="${s.color}"
        stroke-width="${isP ? 1.75 : 1}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  if (exec && primary) {
    // annotate the primary's peak and latest — the two points the eye needs
    const pv = primary.values;
    let pk = null, last = null;
    for (let i = 0; i < n; i++) {
      const v = pv[idx(i)];
      if (v == null) continue;
      if (pk == null || v > pv[idx(pk)]) pk = i;
      last = i;
    }
    if (pk != null) {
      const per = i => String(c.chart.periods[idx(i)]).slice(0, 10);
      out += annotate(sx(pk), sy(pv[idx(pk)]), `${T.ch_peak} · ${per(pk)}`,
        compact(pv[idx(pk)]), pk > n * .8 ? "end" : pk < n * .15 ? "start" : "middle");
      if (last != null && last !== pk)
        out += annotate(sx(last), sy(pv[idx(last)]), `${T.ch_latest} · ${per(last)}`,
          compact(pv[idx(last)]), "end");
    }
  } else if (on.length <= 4) {
    // analyst: direct end labels in the series color — no swatch legend needed;
    // labels that would collide get pushed apart vertically
    const used = [];
    for (const s of on) {
      let last = null;
      for (let i = n - 1; i >= 0; i--) if (s.values[idx(i)] != null) { last = i; break; }
      if (last == null) continue;
      let ly = sy(s.values[idx(last)]) - 5;
      while (used.some(u => Math.abs(u - ly) < 9)) ly += 9;
      used.push(ly);
      out += `<text x="${W - MR - 2}" y="${ly.toFixed(1)}"
        text-anchor="end" font-size="8.5" font-weight="${s === primary ? "600" : "400"}"
        fill="${s.color}" font-family="'IBM Plex Mono',ui-monospace,monospace">${esc(s.label.slice(0, 14).toUpperCase())}</text>`;
    }
  }
  out += `<g class="hoverlayer"></g><rect class="brushrect" y="${MT}" height="${H - MT - MB}"
      fill="#c9992a" opacity="0" x="0" width="0"/>
    <rect class="hitbox" x="${ML}" y="0" width="${W - ML - MR}" height="${H}" fill="transparent" style="cursor:crosshair"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" data-kind="timeseries">${out}</svg>`;
}

/* Figma-style capsule bars on light tracks, in brand gold.
   c.cum adds the running-total line (shared axis, honestly extended) plus a
   dashed per-column average as the reference line. */
function cumOf(y) { let t = 0; return y.map(v => +(t += v).toFixed(4)); }

function svgProfile(c) {
  const ys = c.chart.y;
  const cum = c.cum ? cumOf(ys) : null;
  const domain = cum ? ys.concat(cum) : ys;
  const sy = yScale(domain);
  const y0 = sy(0), yBot = H - MB;
  const n = c.chart.x.length;
  const band = (W - ML - MR) / n;
  const bw = Math.min(46, Math.max(7, band * .62));
  let out = gridAndTicks(domain);
  const step = Math.max(1, Math.ceil(n / 8));
  // values labeled on the extremes only — the max carries the story
  const iMax = ys.indexOf(Math.max(...ys)), iMin = ys.indexOf(Math.min(...ys));
  ys.forEach((v, i) => {
    const x = ML + band * i + (band - bw) / 2;
    const yv = sy(v);
    const top = Math.min(yv, y0), h = Math.max(1, Math.abs(y0 - yv));
    const fillc = (c.chart.colors && c.chart.colors[i]) || "#a8821f";
    out += `<rect class="bar" data-i="${i}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" fill="${fillc}"/>`;
    if (i === iMax || (i === iMin && n > 2 && iMin !== iMax))
      out += `<text x="${(x + bw / 2).toFixed(1)}" y="${top - 6}" text-anchor="middle" font-size="10.5"
        font-weight="${i === iMax ? "600" : "400"}" fill="#201d17"
        font-family="'IBM Plex Mono',ui-monospace,monospace">${compact(v)}</text>`;
    if (i % step === 0) out += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${AXIS_FONT}>${esc(String(c.chart.x[i]).slice(0, 12))}</text>`;
  });
  if (cum) {
    const mean = ys.reduce((a, b) => a + b, 0) / n, my = sy(mean);
    out += `<line x1="${ML}" x2="${W - MR}" y1="${my}" y2="${my}" stroke="#99917e" stroke-dasharray="4 3"/>
      <text x="${ML + 4}" y="${my - 5}" ${AXIS_FONT}>${T.ch_avg} ${compact(mean)}</text>`;
    let dp = "";
    cum.forEach((v, i) => { dp += `${i ? "L" : "M"}${(ML + band * i + band / 2).toFixed(1)},${sy(v).toFixed(1)}`; });
    out += `<path d="${dp}" fill="none" stroke="#5c6f8a" stroke-width="1.5"
        stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${W - MR - 4}" y="${sy(cum[n - 1]) - 7}" text-anchor="end" font-size="10"
        fill="#5c6f8a" font-family="'IBM Plex Mono',ui-monospace,monospace">Σ ${compact(cum[n - 1])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" data-kind="profile">${out}</svg>`;
}

function attachCharts() {
  // only legends wired to a real CHARTS entry toggle; bare .lg swatches in
  // exec-dashboard and scenario legends carry no data-chart and are inert
  $$(".lg[data-chart]").forEach(lg => lg.addEventListener("click", () => {
    const c = CHARTS[+lg.dataset.chart], s = c.lines[+lg.dataset.k];
    s.on = !s.on;
    $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => {
      card.querySelector(".plot").innerHTML = svgTimeseries(c);
    });
    lg.classList.toggle("off", !s.on);
    bindHoverAll(c);
  }));
  $$(".iconbtn[data-csv]").forEach(b => b.addEventListener("click",
    () => downloadChartCSV(CHARTS[+b.dataset.csv])));
  const showAll = $("#show-all-charts");
  if (showAll) showAll.addEventListener("click", () => {
    SHOWALL = true; rerender(renderAll);
  });
  $$(".iconbtn[data-cum]").forEach(b => b.addEventListener("click", () => {
    const c = CHARTS[+b.dataset.cum];
    c.cum = !c.cum;
    $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => {
      card.querySelector(".plot").innerHTML = svgProfile(c);
      const btn = card.querySelector(`[data-cum="${c.i}"]`);
      if (btn) btn.classList.toggle("on", c.cum);
    });
    bindHoverAll(c);
  }));
  CHARTS.forEach(bindHoverAll);
}

function bindHoverAll(c) {
  $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => bindHover(c, card));
}

function bindHover(c, card) {
  const svg = card.querySelector("svg"), tip = card.querySelector(".tooltip");
  if (!svg || !tip) return;
  const show = (html, evt) => {
    tip.innerHTML = html; tip.style.display = "block";
    const r = card.getBoundingClientRect();
    let x = evt.clientX - r.left + 14, y = evt.clientY - r.top + 10;
    if (x + tip.offsetWidth > r.width - 6) x -= tip.offsetWidth + 26;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  };
  const hide = () => { tip.style.display = "none"; };

  if (svg.dataset.kind === "profile") {
    svg.querySelectorAll(".bar").forEach(bar => {
      bar.addEventListener("mousemove", e => {
        const i = +bar.dataset.i;
        const cumRow = c.cum ? `<div class="tv"><span>${T.ch_cumt}</span><b>${num(cumOf(c.chart.y)[i])}</b></div>` : "";
        show(`<div class="tp">${esc(String(c.chart.x[i]))}</div>
              <div class="tv"><span>${T.ch_sum}</span><b>${num(c.chart.y[i])}</b></div>${cumRow}`, e);
      });
      bar.addEventListener("mouseleave", hide);
    });
    return;
  }
  const hit = svg.querySelector(".hitbox"), layer = svg.querySelector(".hoverlayer");
  const brush = svg.querySelector(".brushrect");
  let dragFrom = null;

  const toIdx = e => {
    const box = svg.getBoundingClientRect();
    const fx = (e.clientX - box.left) / box.width * W;
    const [lo, hi] = chartRange(c), n = hi - lo + 1;
    return Math.max(0, Math.min(n - 1, Math.round((fx - ML) / (W - ML - MR) * (n - 1))));
  };
  const sxOf = (i, n) => ML + (W - ML - MR) * (n === 1 ? .5 : i / (n - 1));

  hit.addEventListener("mousedown", e => { dragFrom = toIdx(e); });
  hit.addEventListener("mousemove", e => {
    const [lo, hi] = chartRange(c), n = hi - lo + 1;
    const i = toIdx(e);
    if (dragFrom != null) {
      const a = Math.min(dragFrom, i), b = Math.max(dragFrom, i);
      brush.setAttribute("x", sxOf(a, n));
      brush.setAttribute("width", Math.max(1, sxOf(b, n) - sxOf(a, n)));
      brush.setAttribute("opacity", ".14");
      return;
    }
    const on = c.lines.filter(s => s.on);
    const flat = on.flatMap(s => s.values.slice(lo, hi + 1).filter(v => v != null));
    if (!flat.length) return;
    const sy = yScale(flat), x = sxOf(i, n);
    let marks = `<line x1="${x}" x2="${x}" y1="${mtCur()}" y2="${H - MB}" stroke="#b9ad8d"
      stroke-width=".75" stroke-dasharray="3 3"/>`;
    let rows = "";
    for (const s of on) {
      const v = s.values[lo + i];
      if (v == null) continue;
      marks += `<circle cx="${x}" cy="${sy(v)}" r="3.5" fill="${s.color}" stroke="#fbf9f3" stroke-width="1.5"/>`;
      rows += `<div class="tv"><span class="lab"><span class="sw" style="width:8px;height:8px;border-radius:2px;display:inline-block;background:${s.color}"></span>${esc(s.label.slice(0, 24))}</span><b>${num(v)}</b></div>`;
    }
    layer.innerHTML = marks;
    show(`<div class="tp">${esc(String(c.chart.periods[lo + i]))}</div>${rows}`, e);
  });
  const endDrag = e => {
    if (dragFrom == null) return;
    const [lo] = chartRange(c);
    const i = toIdx(e), a = Math.min(dragFrom, i), b = Math.max(dragFrom, i);
    dragFrom = null; brush.setAttribute("opacity", "0");
    if (b - a >= 2) { c.range = [lo + a, lo + b]; redrawChart(c); }
  };
  hit.addEventListener("mouseup", endDrag);
  hit.addEventListener("mouseleave", e => { layer.innerHTML = ""; hide(); endDrag(e); });
  hit.addEventListener("dblclick", () => { c.range = null; redrawChart(c); });
}

function redrawChart(c) {
  $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => {
    card.querySelector(".plot").innerHTML = svgTimeseries(c);
    const cs = card.querySelector(".cs");
    if (cs) {
      const [lo, hi] = chartRange(c);
      cs.textContent = [c.loc, T.ch_periods(hi - lo + 1, c.chart.periods.length),
        c.chart.truncated ? T.ch_trunc : null].filter(Boolean).join(" · ");
    }
  });
  bindHoverAll(c);
}

/* ---------- audit highlights (Figma topics panels) ---------- */
function auditRows() {
  let rows = [...AUDIT.findings, ...AUDIT.verified, ...AUDIT.unverified];
  rows = rows.filter(f => sheetVisible(f.sheet));
  if (FILTER.status) rows = rows.filter(f => f.status === FILTER.status);
  return rows;
}

function renderHighlights() {
  const mism = AUDIT.findings.filter(f => sheetVisible(f.sheet)).slice(0, 4);
  const ok = AUDIT.verified.filter(f => sheetVisible(f.sheet))
    .sort((a, b) => b.n_checked - a.n_checked).slice(0, 4);
  const maxD = Math.max(1, ...mism.map(f => f.total_abs_delta));
  const rowM = f => `<div class="bar-row clicky" data-sheet="${esc(f.sheet)}">
    <span class="bl" title="${esc(f.formula)}">${esc(f.sheet)} — ${plainFormula(f)}</span>
    <span class="bv">|Δ| ${num(f.total_abs_delta)}</span>
    <div class="track" style="background:var(--crit-track)"><div class="fill"
      style="width:${Math.max(4, f.total_abs_delta / maxD * 100)}%;background:var(--critical)"></div></div></div>`;
  const rowV = f => `<div class="bar-row clicky" data-sheet="${esc(f.sheet)}">
    <span class="bl" title="${esc(f.formula)}">${esc(f.sheet)} — ${plainFormula(f)}</span>
    <span class="bv">${f.n_matched}/${f.n_checked} rows</span>
    <div class="track" style="background:var(--good-track)"><div class="fill"
      style="width:${f.n_checked ? f.n_matched / f.n_checked * 100 : 0}%;background:var(--good)"></div></div></div>`;
  return `<div class="grid2">
    <div class="card"><div class="card-head"><span class="ct">${T.au_largest}</span></div>
      ${mism.length ? mism.map(rowM).join("") : `<div class="muted" style="padding:18px 0">${T.au_none_f}</div>`}</div>
    <div class="card"><div class="card-head"><span class="ct">${T.au_verified}</span></div>
      ${ok.length ? ok.map(rowV).join("") : `<div class="muted" style="padding:18px 0">${T.au_none_f}</div>`}</div>
  </div>`;
}

function renderLeaderboards() {
  const bySheetD = {};
  for (const f of AUDIT.findings) bySheetD[f.sheet] = (bySheetD[f.sheet] || 0) + f.total_abs_delta;
  const dRows = Object.entries(bySheetD).filter(([s]) => sheetVisible(s))
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rRows = REPORT.sheets.filter(s => sheetVisible(s.name)).map(s => {
    let n = s.tidy ? s.tidy.n_records : 0;
    for (const p of s.panels || []) n += p.tidy ? p.tidy.n_records : 0;
    return [s.name, n, s.orientation];
  }).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const lead = (rows, fmt) => rows.map((r, i) => `<div class="lead-row">
      <span class="rank">${i + 1}</span>${fmt(r)}</div>`).join("");
  return `<div class="grid2">
    <div class="card"><div class="card-head"><span class="ct">${T.au_most}</span></div>
      ${rRows.length ? lead(rRows, ([s, n, o]) => `<div style="min-width:0"><div class="nm">${esc(s)}</div>
        <div class="sub">${esc(o)}</div></div><span class="val">${compact(n)}</span>`)
        : `<div class="muted" style="padding:18px 0">${T.au_nothing}</div>`}</div>
    <div class="card"><div class="card-head"><span class="ct">${T.au_by_sheet}</span></div>
      ${dRows.length ? lead(dRows, ([s, d]) => `<div style="min-width:0"><div class="nm">${esc(s)}</div></div>
        <span class="val" style="color:var(--critical)">${compact(d)}</span>`)
        : `<div class="muted" style="padding:18px 0">${T.au_no_disc}</div>`}</div>
  </div>`;
}

const STATUS = {
  ok: { ico: "✓", cls: "ok", word: T.st_ok },
  mismatch: { ico: "✕", cls: "mismatch", word: T.st_mismatch },
  unverified: { ico: "?", cls: "unverified", word: T.st_unverified },
};
const stBadge = s => {
  const t = STATUS[s] || STATUS.unverified;
  return `<span class="st ${t.cls}">${t.ico} ${t.word}</span>`;
};

function fixCell(f) {
  if (f.status !== "mismatch") return "";
  const safe = f.fix_confidence === "high"
    ? f.mismatches.filter(m => m.suggest !== false) : [];
  if (!safe.length)
    return `<span class="muted">${T.fx_hand}</span>`;
  return safe.slice(0, 2).map(m =>
    m.cell ? `<div><b>${esc(m.cell)}</b>: ${num(m.actual)} → <b style="color:var(--good)">${num(m.expected)}</b></div>`
           : `<div>${T.row_w} ${m.row}: → <b style="color:var(--good)">${num(m.expected)}</b></div>`
  ).join("") + (safe.length > 2 ? `<div class="muted">${T.fx_more(safe.length - 2)}</div>` : "");
}

function renderFindingsTable() {
  const rows = auditRows();
  if (!rows.length) return `<div class="card muted">No relations for this filter.</div>`;
  const row = f => {
    const worst = f.mismatches[0];
    return `<tr class="frow" data-sheet="${esc(f.sheet)}">
      <td>${stBadge(f.status)}</td>
      <td>${esc(f.sheet)}${f.panel ? ` <span class="muted">[${esc(f.panel)}]</span>` : ""}</td>
      <td>${plainFormula(f)}</td>
      <td class="num">${f.n_mismatched}/${f.n_checked}</td>
      <td class="num">${num(f.total_abs_delta)}</td>
      <td>${worst ? T.f_worst(worst.row, esc(worst.label), num(worst.expected), num(worst.actual)) : ""}</td>
      <td>${fixCell(f)}</td>
    </tr>`;
  };
  return `<div class="card"><div class="preview-wrap"><table>
    <tr><th>${T.tb_status}</th><th>${T.tb_sheet}</th><th>${T.tb_relation}</th><th class="num">${T.tb_rows}</th>
        <th class="num">|Δ|</th><th>${T.tb_worst}</th><th>${T.tb_fix}</th></tr>
    ${rows.map(row).join("")}</table></div></div>`;
}

function attachFindingRows() {
  $$("tr.frow").forEach(tr => tr.addEventListener("click", () => jumpToSheet(tr.dataset.sheet)));
}
function attachBarRows() {
  $$(".bar-row.clicky").forEach(el => el.addEventListener("click", () => jumpToSheet(el.dataset.sheet)));
}
function jumpToSheet(name) {
  const idx = SHEET_IDX[name];
  if (idx === undefined) return;
  // sheet cards live on the Data tab (analyst view) — go there first
  if (TAB !== "data" || MODE === "exec") {
    MODE = "analyst"; localStorage.setItem("lumnia_mode", MODE);
    TAB = "data"; renderAll();
  }
  const el = document.getElementById("sheetcard-" + idx);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  const d = el.querySelector("details"); if (d) d.open = true;
}

/* ---------- sheets ---------- */
function renderSheets() {
  return REPORT.sheets.map((s, i) =>
    sheetVisible(s.name) ? sheetCard(s, i) : "").join("") || `<div class="card muted">No sheets for this filter.</div>`;
}

function sheetCard(s, idx) {
  let body = "";
  if (s.panels) {
    body = s.panels.map(p => {
      const where = "col_start" in p && p.col_start != null
        ? `cols ${p.col_start}–${p.col_end}` : `rows ${p.row_start}–${p.row_end}`;
      return `<div class="panel-blk">
        <span class="badge ${esc(p.orientation)}">${esc(p.orientation)}</span>
        <span class="muted" style="font-size:11px;font-family:var(--mono)">${where}</span>
        <div class="reason">${esc(p.reason)}</div>
        ${p.tidy ? tidyBlock(p.tidy) : ""}</div>`;
    }).join("");
  } else if (s.tidy) body = tidyBlock(s.tidy);
  return `<div class="card" id="sheetcard-${idx}">
    <div class="sheet-head">
      <span class="nm">${esc(s.name)}</span>
      <span class="badge ${esc(s.orientation)}">${esc(s.orientation)}</span>
      <span class="dims">${s.n_rows} × ${s.n_cols} · ${(s.fill_ratio * 100).toFixed(0)}% filled</span>
    </div>
    <div class="reason">${esc(s.orientation_reason)}</div>
    ${body}</div>`;
}

function tidyBlock(t) {
  const cols = t.columns, shown = cols.slice(0, 10), recs = t.records.slice(0, 5);
  const preview = recs.length ? `
    <div class="preview-wrap"><table>
      <tr>${shown.map(c => `<th>${esc(c)}</th>`).join("")}${cols.length > shown.length ? "<th>…</th>" : ""}</tr>
      ${recs.map(r => `<tr>${shown.map(c =>
        `<td class="${typeof r[c] === "number" ? "num" : ""}">${typeof r[c] === "number" ? num(r[c]) : esc(r[c])}</td>`).join("")}
        ${cols.length > shown.length ? "<td>…</td>" : ""}</tr>`).join("")}
    </table></div>` : "";
  const s = t.summary || {};
  const bits = [`${t.n_records} records`, `${t.n_columns} columns`];
  if (s.n_periods) bits.push(`${s.n_series} series × ${s.n_periods} periods (${esc(s.period_min)} → ${esc(s.period_max)})`);
  if (t.total_rows) bits.push(`totals rows: ${t.total_rows.join(", ")}`);
  return `<details><summary>${bits.join(" · ")}</summary>${preview}</details>`;
}

/* ---------- CSV export ---------- */
function downloadCSV(name, rows) {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function downloadChartCSV(c) {
  if (c.chart.kind === "timeseries") {
    const head = ["period", ...c.lines.map(s => s.label)];
    const rows = c.chart.periods.map((p, i) => [p, ...c.lines.map(s => s.values[i] ?? "")]);
    downloadCSV(`${c.sheet.trim()}-timeseries.csv`, [head, ...rows]);
  } else {
    downloadCSV(`${c.sheet.trim()}-profile.csv`,
      [["column", "sum"], ...c.chart.x.map((x, i) => [x, c.chart.y[i]])]);
  }
}
function downloadCorrections() {
  const rows = [["sheet", "panel", "cell", "row", "label", "current", "suggested",
    "rule", "confidence"]];
  for (const f of AUDIT.findings) {
    for (const m of f.mismatches) {
      const safe = f.fix_confidence === "high" && m.suggest !== false;
      rows.push([f.sheet, f.panel ?? "", m.cell ?? "", m.row, m.label ?? "",
        m.actual, m.expected, f.formula,
        safe ? "high — rule verified on " + f.n_matched + " rows"
             : "review — other rules contest this cell; verify inputs by hand"]);
    }
  }
  downloadCSV(`${AUDIT.filename.replace(/\.[^.]+$/, "")}-corrections.csv`, rows);
}

function downloadFindings() {
  const rows = [["status", "sheet", "panel", "kind", "formula", "rows_mismatched",
    "rows_checked", "total_abs_delta", "worst_row", "worst_label", "expected", "actual"]];
  for (const f of [...AUDIT.findings, ...AUDIT.verified, ...AUDIT.unverified]) {
    const w = f.mismatches[0] || {};
    rows.push([f.status, f.sheet, f.panel ?? "", f.kind, f.formula, f.n_mismatched,
      f.n_checked, f.total_abs_delta, w.row ?? "", w.label ?? "", w.expected ?? "", w.actual ?? ""]);
  }
  downloadCSV(`${AUDIT.filename.replace(/\.[^.]+$/, "")}-audit.csv`, rows);
}

/* ---------- boot ---------- */
(async function boot() {
  if (PUB) {             // public exec page: the frozen snapshot, nothing else
    document.body.classList.add("home");
    const r = await fetch(`/published/${PUB}`);
    if (!r.ok) {         // revoked or unknown token (8c)
      $("#content").innerHTML = `<div class="home-empty">
        <svg class="sunmark" width="30" height="30" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
        <h1 style="font-size:22px">${T.pub_dead}</h1>
        <p class="lede">${T.pub_dead_sub}</p></div>`;
      return;
    }
    renderPublishedPage(await r.json());
    return;
  }
  if (HUB) {             // authed client hub: session cookie, no report loads
    await bootHub();
    return;
  }
  if (PORTAL) {          // public client portal: a live index, no report loads
    document.body.classList.add("home");
    const r = await fetch(`/portal/${PORTAL}`);
    if (!r.ok) {         // revoked or unknown token
      $("#content").innerHTML = `<div class="home-empty">
        <svg class="sunmark" width="30" height="30" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
        <h1 style="font-size:22px">${T.portal_dead}</h1>
        <p class="lede">${T.portal_dead_sub}</p></div>`;
      return;
    }
    renderPortalPage(await r.json());
    return;
  }
  fetch("/health").then(r => r.json())
    .then(h => { NARR_READY = !!h.narrative_ready; })
    .catch(() => {});
  // land on the workspace: Command Center when workbooks exist, the
  // first-run promise when none — a workbook opens only when chosen
  await renderHomePage();
  $(".brand").style.cursor = "pointer";
  $(".brand").addEventListener("click", goHome);
})();
</script>
