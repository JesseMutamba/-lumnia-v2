<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumnia — light where there was none</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9992a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* two-mode surfaces: executive is airier, analyst a stop deeper */
    --surface: #f6f3ec;
    --surface-analyst: #f2eee4;
    --panel: #f6f3ec;
    --panel-analyst: #ece7d9;
    --card: #fbf9f3;
    --card-2: #f6f1e4;
    --border: #ddd4bf;
    --border-exec: #e7dfcd;
    --line: var(--border);
    --hairline: #e8e1cf;
    --border-strong: #ccc2a8;
    --baseline: #c9bfa8;
    --ink: #201d17;
    --ink-2: #5c564a;
    --ink-3: #99917e;
    --ink-4: #8a8271;
    --gold: #a8821f;
    --gold-strong: #c9992a;
    --gold-tint: #f3ead2;
    --chip-bg: #f7f1df;
    --chip-bd: #e0d3ac;
    --good: #0a7d33;
    --good-series: #5e7d54;
    --good-track: #ddeedd;
    --warning: #8a6100;
    --critical: #b03a2e;
    --crit-track: #f3dcd6;
    --blue: #5c6f8a;
    --blue-soft: #8496ad;
    --bar-track: #efe9d8;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow: none;
    --radius-card: 10px;      /* exec */
  }
  body[data-mode="analyst"] {
    --surface: var(--surface-analyst);
    --panel: var(--panel-analyst);
    --ink-2: #44413a;
    --ink-3: #948b76;
    --radius-card: 6px;
  }
  body[data-mode="exec"] { --border: var(--border-exec); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.5 var(--sans); }
  b, strong, .value, .hv, .kd, .bv, .pv { font-variant-numeric: tabular-nums; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-3); }

  /* ============ layout: sidebar + main ============ */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside.side { display: none; } }

  aside.side { border-right: 1px solid var(--border); background: var(--panel);
    padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
  .brand h1 { font-family: var(--serif); font-size: 18px; font-weight: 600;
    letter-spacing: .14em; margin: 0; }
  .side .kicker { display: block; margin: 18px 8px 8px; font-size: 9px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    cursor: pointer; color: var(--ink-4); font-weight: 550; font-size: 13px;
    margin-bottom: 2px; border: 1px solid transparent;
    border-left: 2px solid transparent; border-radius: 0; }
  .nav-item:hover { color: var(--ink); }
  /* exec: a 2px gold rule carries the state; analyst: a card pill */
  .nav-item.active { border-left-color: var(--gold); color: var(--ink);
    font-weight: 650; }
  body[data-mode="analyst"] .nav-item { border-radius: 6px; border-left-width: 1px; }
  body[data-mode="analyst"] .nav-item:hover { background: var(--card); }
  body[data-mode="analyst"] .nav-item.active { background: var(--card);
    border-color: var(--border); color: var(--ink); }
  .nav-item svg { flex: none; }
  .nav-item .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px;
    color: var(--ink-3); }
  .nav-item.active .cnt { color: var(--gold); }
  .wb { padding: 7px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .wb:hover { background: var(--card); }
  .wb .name { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
  .wb.active .name { color: var(--gold); }
  .wb .meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    display: flex; justify-content: space-between; align-items: center; }
  .wb button { border: none; background: none; color: var(--ink-3); cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 3px; visibility: hidden; }
  .wb:hover button { visibility: visible; }
  .wb button:hover { color: var(--critical); }
  #newupload { color: var(--gold); }

  main { padding: 26px 32px 80px; min-width: 0; }

  /* ============ topbar ============ */
  .topbar { display: flex; align-items: center; gap: 14px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
  .topbar h2 { font-size: 15.5px; font-weight: 650; margin: 0;
    overflow-wrap: anywhere; }
  .topbar .sub { color: var(--ink-3); font-family: var(--mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; }
  .topbar .tkick { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); overflow-wrap: anywhere; }
  .topbar.exec { border-bottom: none; padding-bottom: 4px; margin-bottom: 6px; }
  .topbar .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-2); background: var(--card);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 13px; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  #status { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    letter-spacing: .04em; min-height: 18px; margin: 0 0 10px; }
  #status.err { color: var(--critical); }

  /* ============ filter pills ============ */
  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; position: relative; }
  .pill { position: relative; }
  .pill > button { display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 16px; font: 13px var(--sans); color: var(--ink-2); box-shadow: var(--shadow); }
  .pill > button b { color: var(--ink); font-weight: 650; }
  .pill > button .car { color: var(--ink-3); font-size: 10px; }
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 230px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 34px rgba(70,58,25,.14); padding: 8px; display: none; }
  .pill.open .pop { display: block; }
  .pop .search { display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 6px; }
  .pop .search input { border: none; outline: none; background: transparent;
    font: 13px var(--sans); color: var(--ink); width: 100%; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; cursor: pointer;
    border-radius: 7px; font-size: 13px; }
  .opt:hover { background: var(--gold-tint); }
  .opt .radio { width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .radio { border-color: var(--gold); background: radial-gradient(circle at center, var(--gold) 0 4.5px, transparent 5px); }
  .opt .box { width: 13px; height: 13px; border-radius: 4px; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .box { border-color: var(--gold); background: var(--gold); }
  .pop .clear { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); cursor: pointer; padding: 7px 9px 3px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold-tint);
    color: var(--gold); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }

  /* ============ overview ============ */
  .overview { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(380px, 7fr);
    gap: 16px; align-items: stretch; }
  @media (max-width: 1100px) { .overview { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 16px 18px; }
  .tile .label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3); }
  .tile .value { font-family: var(--serif); font-size: 28px; font-weight: 600;
    margin-top: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .value .den { font-size: 15px; color: var(--ink-3); font-weight: 500; }
  .tile .value .ico { font-size: 15px; vertical-align: 3px; margin-right: 6px; }

  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 16px 20px; margin-bottom: 14px;
    position: relative; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head .ct { font-weight: 650; font-size: 14px; }
  .card-head .cs { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; text-transform: uppercase; }
  .card-head .grow { flex: 1; }
  .iconbtn { border: none; background: none; cursor: pointer; color: var(--ink-3);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 4px; }
  .iconbtn:hover { color: var(--gold); }
  .iconbtn.on { color: #fff; background: var(--gold); border-radius: 6px;
    padding: 2px 8px; }
  .iconbtn.on:hover { color: #fff; background: var(--gold-strong); }
  .narr { margin-top: 14px; }
  .narr p { margin: 10px 0 0; font-size: 14px; line-height: 1.65; max-width: 80ch; }
  .nwatch { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px;
    line-height: 1.6; color: var(--ink-2); }
  .nfoot { margin-top: 12px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .05em; color: var(--ink-3); }
  .nerr { color: var(--critical); font-size: 12.5px; margin-top: 8px; }
  /* tab bar: one story per tab, PVAK-style */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
    overflow-x: auto; }
  .tabbtn { border: none; background: none; cursor: pointer; font: inherit;
    font-size: 13.5px; font-weight: 600; color: var(--ink-3); padding: 9px 14px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabbtn:hover { color: var(--ink); }
  .tabbtn.on { color: var(--ink); border-bottom-color: var(--gold); }
  .tabbtn .tcnt { margin-left: 6px; font-family: var(--mono); font-size: 10.5px;
    background: var(--card-2); border-radius: 8px; padding: 1px 7px; color: var(--ink-3); }
  /* overview hero: the big confident numbers */
  .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; margin: 14px 0 16px; }
  .hero-tile { background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; }
  .hero-tile .hl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); }
  .hero-tile .hv { font-family: var(--serif); font-size: 34px; font-weight: 650;
    margin-top: 6px; letter-spacing: -.01em; }
  .hero-tile .hs { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  /* data profile */
  .pbadge { display: inline-block; font-family: var(--mono); font-size: 10.5px;
    background: var(--card-2); border-radius: 8px; padding: 3px 9px;
    margin: 0 6px 6px 0; color: var(--ink-2); }
  .psub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; }
  .pstats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .pstats b { font-family: var(--mono); font-size: 12px; }
  /* read-only share view: no library, no upload */
  body.share aside.side { display: none; }
  body.share .app { grid-template-columns: 1fr; }
  /* non-technical home (Flexport-style): greeting, tasks, exceptions */
  .greet { display: flex; align-items: center; gap: 16px; margin: 4px 0 14px; }
  .greet h1 { font-family: var(--serif); font-size: 32px; font-weight: 650; margin: 0; }
  .greet .gsub { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
  .gchip { margin-left: auto; font-size: 13px; font-weight: 650; color: var(--vcolor);
    border: 1.5px solid var(--vcolor); border-radius: 999px; padding: 6px 14px;
    background: var(--card); white-space: nowrap; }
  .home-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 1100px) { .home-grid { grid-template-columns: 1fr; } }
  .trow { display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .trow:last-child { border-bottom: none; }
  .trow.clicky { cursor: pointer; }
  .trow.clicky:hover b { color: var(--gold-strong); }
  .tico { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .tbody { min-width: 0; line-height: 1.45; }
  .tbody .tsub { display: block; color: var(--ink-3); font-size: 12.5px; }
  .tchip { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 600;
    background: var(--crit-track); color: var(--critical); border-radius: 8px; padding: 3px 9px; }
  .cnt2 { font-family: var(--mono); font-size: 10.5px; background: var(--card-2);
    border-radius: 8px; padding: 2px 8px; margin-left: 8px; color: var(--ink-3); }
  .seeall { font-size: 12.5px; font-weight: 600; color: var(--gold-strong); cursor: pointer; }
  .langs { margin-right: 4px; }
  .glead { font-size: 14px; line-height: 1.65; max-width: 90ch; margin: 0 0 14px; }

  /* ============ motion system ============
     Discipline: 150-450ms, ease-out, no bounce. Everything below is gated
     by prefers-reduced-motion; the app is fully usable with zero motion. */
  .btn, .iconbtn, .tabbtn, .chip, .mchip, .nav-item, .wb, .opt, .preset,
  .modes button, .lg, .runbtn, .seeall {
    transition: background-color .15s ease, color .15s ease,
      border-color .15s ease, box-shadow .2s ease, transform .15s ease; }
  .btn:hover, .runbtn:hover { transform: translateY(-1px); }
  .btn:active, .runbtn:active, .tabbtn:active, .chip:active { transform: translateY(0); }
  :is(.btn, .iconbtn, .tabbtn, .chip, .runbtn, .modes button):focus-visible {
    outline: 2px solid var(--gold-strong); outline-offset: 2px; border-radius: 8px; }

  /* sticky tab bar: the wayfinding stays put while the page scrolls */
  .tabs { position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* popovers ease in instead of popping */
  @keyframes popin { from { opacity: 0; transform: translateY(-4px); } }
  .pill.open .pop { animation: popin .16s ease; }

  @media (prefers-reduced-motion: no-preference) {
    /* view-transition crossfade between tabs/modes */
    ::view-transition-old(root), ::view-transition-new(root) {
      animation-duration: .22s; }

    /* content enters with a quiet rise; sliders' live re-renders excluded */
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
    #content section:not(#sec-scenario):not(#sec-mc)
      :is(.card, .hero-tile, .tile, .scard, .action-card, .greet) {
      animation: rise .38s cubic-bezier(.2, .7, .3, 1) backwards; }
    :is(.grid2, .hero, .kpis, .overview, .home-grid) >
      :is(.card, .hero-tile, .tile):nth-child(2) { animation-delay: .05s; }
    :is(.grid2, .hero, .kpis, .overview, .home-grid) >
      :is(.card, .hero-tile, .tile):nth-child(3) { animation-delay: .1s; }
    :is(.grid2, .hero, .kpis, .overview, .home-grid) >
      :is(.card, .hero-tile, .tile):nth-child(n+4) { animation-delay: .14s; }

    /* charts draw themselves: lines trace, bars grow from the baseline */
    @keyframes drawln { to { stroke-dashoffset: 0; } }
    .plot path.ln { stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: drawln .8s cubic-bezier(.4, 0, .2, 1) .15s forwards; }
    #sec-scenario .plot path.ln, #sec-mc .plot path.ln {
      animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
    @keyframes grow { from { transform: scaleY(0); } }
    .plot rect.bar { transform-box: fill-box; transform-origin: 50% 100%;
      animation: grow .45s cubic-bezier(.2, .7, .3, 1) backwards; }
    .plot rect.bar:nth-of-type(odd) { animation-delay: .05s; }
    #sec-mc .plot rect.bar, #sec-scenario .plot rect.bar { animation: none; }

    /* cards acknowledge hover with the border, never a shadow */
    .chart-card, .scard, .wb, .trow.clicky, .bar-row.clicky {
      transition: border-color .18s ease; }
    .chart-card:hover, .scard:hover { border-color: var(--border-strong); }
    /* pair-card bars settle into place */
    .prow .pbar span { transition: width .45s cubic-bezier(.2, .7, .3, 1); }
  }

  /* analyzing skeleton: shimmer while the pipeline runs */
  .skel { display: grid; gap: 14px; }
  .skel .sk { border-radius: 14px; background:
    linear-gradient(100deg, var(--card) 40%, #f2eddf 50%, var(--card) 60%);
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .skel .sk-kicker { height: 14px; width: 220px; }
  .skel .sk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .skel .sk-tile { height: 108px; }
  .skel .sk-card { height: 300px; }
  @media (prefers-reduced-motion: reduce) { .skel .sk { animation: none; } }
  .wb-group { font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold-strong); margin: 12px 10px 4px; }
  /* storytelling: brief wizard + plan approval + built dashboard */
  .bq { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }
  .binput { width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card-2); color: var(--ink); resize: vertical; }
  .binput:focus { outline: none; border-color: var(--gold); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 5px 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2);
    background: var(--card); }
  .chip:hover { border-color: var(--gold); }
  .chip.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .mchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card-2); cursor: pointer; }
  .msheet { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--gold-strong); }
  .qrow { padding: 12px 0; border-bottom: 1px solid var(--hairline);
    font-size: 13.5px; line-height: 1.5; }
  .qrow:last-of-type { border-bottom: none; }
  .qstat { font-size: 11.5px; font-weight: 600; margin-left: 8px; }
  .qmiss { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mtable td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--hairline); }
  .mtable tr:last-child td { border-bottom: none; }
  .mtable .num { text-align: right; font-variant-numeric: tabular-nums;
    font-family: var(--mono); font-size: 12px; }
  /* indicator × period tables (Financials full table, scenario comparison) */
  .ftwrap { overflow-x: auto; }
  .ftable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ftable th { color: var(--ink-3); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px;
    text-align: right; border-bottom: 1px solid var(--border-strong);
    white-space: nowrap; }
  .ftable th:first-child, .ftable td:first-child { text-align: left;
    padding-left: 0; }
  .ftable td { padding: 7px 10px; border-bottom: 1px solid var(--hairline);
    text-align: right; font-family: var(--mono); font-size: 11.5px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ftable td:first-child { font-family: inherit; font-size: 12px;
    color: var(--ink-2); }
  .ftable .hi { font-weight: 700; }

  /* Phase 3: zoned layout, KPI-with-deltas, shared-axis pair rows */

  .kds { display: flex; flex-direction: column; gap: 4px; padding-left: 16px;

  .prow { display: grid; grid-template-columns: minmax(70px, 1fr) 2fr 62px 1.4fr 70px;
    gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; }

  section > .kicker { display: block; margin: 30px 0 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .chart-card svg { display: block; width: 100%; height: auto; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--ink-2); cursor: pointer; padding: 2px 0; user-select: none; }
  .lg .sw { width: 10px; height: 10px; border-radius: 3px; }
  .lg.off { opacity: .32; }
  .hint { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;

  .tooltip .tv .lab { display: inline-flex; align-items: center; gap: 5px; }

  /* progress-bar panels (audit highlights) */
  .bar-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px;
    padding: 10px 0; border-bottom: 1px solid var(--hairline); align-items: center; }
  .bar-row:last-child { border-bottom: none; }
  .bar-row .bl { font-weight: 600; font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bv { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    white-space: nowrap; }
  .track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--hairline); }
  .track .fill { height: 100%; border-radius: 999px; }
  .bar-row.clicky { cursor: pointer; }
  .bar-row.clicky:hover .bl { color: var(--gold); }

  /* leaderboard */
  .lead-row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--hairline); }
  .lead-row:last-child { border-bottom: none; }
  .lead-row .rank { font-family: var(--serif); font-size: 17px; color: var(--ink-3);

  .lead-row .nm { font-weight: 600; font-size: 13px; min-width: 0;

  .lead-row .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .lead-row .val { margin-left: auto; font-variant-numeric: tabular-nums;

  /* audit table + sheets */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-weight: 500; color: var(--ink-3);

  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr.frow { cursor: pointer; }
  tr.frow:hover td { background: #f6f1e4; }
  .st { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .st.ok { color: var(--good); } .st.mismatch { color: var(--critical); }
  .st.unverified { color: var(--warning); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.tidy { color: #48628f; border-color: #c4cfe0; }
  .badge.matrix { color: #6d5590; border-color: #d4c9e2; }
  .badge.multi { color: #3e7466; border-color: #bcd6cd; }
  .badge.form { color: var(--gold); border-color: #ddc98f; }
  .badge.unknown { color: var(--ink-3); }
  .sheet-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sheet-head .nm { font-weight: 650; font-size: 14px; }
  .sheet-head .dims { color: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  .reason { color: var(--ink-2); font-size: 12.5px; margin: 7px 0 0; }
  details { margin-top: 9px; }
  summary { cursor: pointer; color: var(--gold); font-size: 12.5px; }
  .preview-wrap { overflow-x: auto; margin-top: 10px; }
  .preview-wrap table { font-size: 12px; }
  .preview-wrap th, .preview-wrap td { padding: 4px 9px; white-space: nowrap;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .panel-blk { border-left: 2px solid var(--border); padding-left: 14px; margin-top: 12px; }
  .muted { color: var(--ink-3); }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: #f3e8cd; } 100% { background: var(--card); } }

  /* mode + language toggles: dark pill in exec, gold segments in analyst */
  .modes { display: inline-flex; border: 1px solid var(--border-strong);
    border-radius: 999px; overflow: hidden; background: var(--card); padding: 2px; }
  .modes button { border: none; background: transparent; color: var(--ink-3);
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; padding: 6px 13px; cursor: pointer;
    border-radius: 999px; }
  .modes button.on { background: var(--ink); color: #f6f3ec; }
  .modes button:hover:not(.on) { color: var(--ink); }
  body[data-mode="analyst"] .modes,
  body[data-mode="analyst"] .modes button { border-radius: 5px; }
  body[data-mode="analyst"] .modes button.on { background: var(--gold); color: #fff; }
  .verdict { display: flex; gap: 16px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 18px 22px; box-shadow: var(--shadow); margin-bottom: 16px;
    border-left: 4px solid var(--vcolor, var(--ink-3)); }
  .verdict .vic { font-size: 26px; line-height: 1; color: var(--vcolor); }
  .verdict .vlabel { font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--vcolor); font-weight: 600; }
  .verdict p { margin: 6px 0 0; font-size: 14px; line-height: 1.65; max-width: 75ch; }
  .action-card { background: var(--card); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 15px 19px; box-shadow: var(--shadow);
    margin-bottom: 12px; border-left: 4px solid var(--acolor, var(--border)); }
  .action-card .ahead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .action-card .asheet { font-weight: 650; }
  .action-card .aval { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 650; color: var(--critical); }
  .action-card .awhat { color: var(--ink-2); font-size: 13px; margin-top: 5px;
    line-height: 1.55; }
  .action-card .ado { margin-top: 8px; font-size: 13px; line-height: 1.5; }
  .action-card .ado b { color: var(--gold); }

  /* scenario & simulation */
  .scen-grid { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; }
  @media (max-width: 900px) { .scen-grid { grid-template-columns: 1fr; } }
  .sl { margin-bottom: 13px; }
  .sl .slh { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .sl .sln { color: var(--ink-2); font-size: 12px; }
  .sl .slv { font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: var(--gold); }
  .sl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%;
    height: 3px; border-radius: 2px; background: #e2d9c2; outline: none;
    cursor: pointer; }
  .sl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%; background: var(--gold);
    border: 2.5px solid var(--surface); box-shadow: 0 1px 3px rgba(70,58,25,.3); }
  .sl input[type=range]::-moz-range-thumb { width: 14px; height: 14px;
    border-radius: 50%; background: var(--gold); border: 2.5px solid var(--surface);
    box-shadow: 0 1px 3px rgba(70,58,25,.3); }
  .preset { border: none; border-radius: 7px; padding: 5px 12px; font-size: 11px;
    font-weight: 600; cursor: pointer; margin: 0 6px 6px 0; }
  .scard { background: var(--card); border: 1px solid var(--border);
    border-top: 2px solid var(--scolor, var(--border)); border-radius: 6px;
    padding: 13px 16px; }
  .scard .sn { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); }
  .scard .sv { font-family: var(--serif); font-size: 26px; font-weight: 600;
    color: var(--scolor); font-variant-numeric: tabular-nums; margin: 4px 0 1px; }
  .scard .ss { font-size: 10.5px; color: var(--ink-3); }
  .runbtn { width: 100%; margin-top: 12px; background: var(--gold); color: #fff;
    border: none; border-radius: 8px; padding: 10px 0; font-family: var(--mono);
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer; }
  .runbtn:hover { background: var(--gold-strong); }
  .prob-row { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .prob-row:last-child { border-bottom: none; }
  .prob-row .pv { font-family: var(--mono); font-weight: 700; }

  /* ============ redesign components ============ */
  /* executive KPI strip: not cards — hairline rows with vertical dividers */
  .kstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong);
    margin: 28px 0 36px; }
  .kcell { padding: 18px 24px 20px; border-left: 1px solid var(--hairline); min-width: 0; }
  .kcell:first-child { border-left: none; padding-left: 2px; }
  .kcell .kl { font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); }
  .kcell .kv { font-family: var(--serif); font-size: 44px; font-weight: 600;
    line-height: 1.05; margin-top: 10px; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; }
  .kcell .kv .den { font-size: 22px; color: var(--ink-3); font-weight: 400; }
  .kcell .ks { font-size: 12px; color: var(--ink-4); margin-top: 6px; }
  .kcell.crit .kl, .kcell.crit .kv { color: var(--critical); }
  @media (max-width: 900px) { .kcell .kv { font-size: 32px; } }

  /* executive verdict: a serif headline sentence, then a short lede */
  .vhead { font-family: var(--serif); font-size: 40px; font-weight: 600;
    line-height: 1.15; letter-spacing: -.005em; margin: 10px 0 16px; max-width: 30ch; }

    max-width: 66ch; margin: 0; }
  @media (max-width: 900px) { .vhead { font-size: 30px; } }

  /* numbered next-steps (serif numerals, hairline rows) */
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 14px 0;
    border-bottom: 1px solid var(--hairline); }
  .step:last-child { border-bottom: none; }
  .step .n { font-family: var(--serif); font-size: 22px; color: var(--ink-3);
    line-height: 1.15; }
  .step b { font-size: 13.5px; }
  .step p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

  /* analyst stat bar: terminal-grade one-liner under the header */
  .statbar { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
    color: var(--ink-3); padding: 9px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 16px; text-transform: uppercase; }
  .statbar b { color: var(--ink); font-weight: 600; font-size: 11.5px;
    font-variant-numeric: tabular-nums; }
  .statbar .sbgood, .statbar .sbgood b { color: var(--good); }
  .statbar .sbbad, .statbar .sbbad b { color: var(--critical); }
  .statbar .sbwarn, .statbar .sbwarn b { color: var(--warning); }
  .statbar .grow { flex: 1; }

  /* ranked bars: thin tracks, fill fades by rank, one shared scale per card */
  .rrow { display: grid; grid-template-columns: minmax(130px, 1fr) 2.2fr 66px;
    gap: 12px; align-items: center; padding: 7px 0; font-size: 13px; }
  .rrow .rl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow.top .rl, .rrow.top .rv { font-weight: 600; }
  .rrow .rtrack { height: 8px; border-radius: 2px; background: var(--bar-track); }
  .rrow .rtrack span { display: block; height: 100%; border-radius: 2px; }
  .rrow .rv { font-family: var(--mono); font-size: 11.5px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rfoot { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 10px; }

  /* diverging bars (movers): zero axis centered, gains right, losses left */
  .dvrow { display: grid; grid-template-columns: minmax(110px, 1fr) 88px 2fr 70px;
    gap: 12px; align-items: center; padding: 7px 0; font-size: 13px; }
  .dvrow .dl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dvrow.big .dl, .dvrow.big .dd { font-weight: 600; }
  .dvrow .dd { font-family: var(--mono); font-size: 11.5px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dvrow .dwrap { position: relative; height: 8px; }
  .dvrow .dwrap::before { content: ""; position: absolute; left: 50%; top: -3px;
    bottom: -3px; width: 1px; background: var(--border-strong); }
  .dvrow .dbar { position: absolute; top: 0; height: 8px; border-radius: 2px; }
  .dvrow .dv2 { font-family: var(--mono); font-size: 11.5px; text-align: right;
    color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* wizard stepper: 1 BRIEF — 2 PLAN — 3 DASHBOARD */
  .stepper { display: flex; align-items: center; gap: 12px; margin: 6px 0 26px; }
  .stepper .sp { display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .stepper .sp .c { width: 22px; height: 22px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 10.5px; flex: none;
    border: 1px solid var(--border-strong); color: var(--ink-3); background: var(--card); }
  .stepper .sp.on { color: var(--ink); font-weight: 600; }
  .stepper .sp.on .c { background: var(--gold); border-color: var(--gold); color: #fff; }
  .stepper .sp.done .c { background: var(--gold-tint); border-color: var(--chip-bd);
    color: var(--gold); }
  .stepper .ln { flex: 1; height: 1px; background: var(--border); min-width: 24px; }

  /* verdict / coverage badges: bordered mono chips */
  .vbadge { display: inline-block; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px;

    background: var(--card); vertical-align: 2px; }

  .vbadge.crit { color: var(--critical); border-color: #ddb3ac; }

  /* one-line insight caption under a chart */
  .chcap { font-size: 11.5px; color: var(--ink-4); margin-top: 8px; line-height: 1.5; }

  /* actions: triage rows with serif numerals and an at-stake column */
  .acrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 132px;
    gap: 14px; padding: 20px 0; border-bottom: 1px solid var(--hairline); }
  .acrow .n { font-family: var(--serif); font-size: 24px; color: var(--ink-3);
    line-height: 1.1; }
  .acrow > div:nth-child(2) > b { font-size: 14px; }
  .acrow .aw { color: var(--ink-2); font-size: 13px; margin-top: 6px;

  .acrow .ad { margin-top: 8px; font-size: 13px; line-height: 1.55; }
  .acrow .ad b { color: var(--gold); }
  .acrow .stake { text-align: right; }
  .acrow .stake .v { font-family: var(--serif); font-size: 26px; font-weight: 600;
    color: var(--critical); font-variant-numeric: tabular-nums; }
  .acrow .stake .l { font-family: var(--mono); font-size: 8.5px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
    margin-top: 2px; }
  .acpass { margin-top: 18px; font-size: 13px; color: var(--ink-2); }

  /* trends overflow: the honest "there is more" card */
  .overflow-card { border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-card); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 30px 20px; cursor: pointer; min-height: 200px; }
  .overflow-card:hover { border-color: var(--gold); }

  /* briefing wizard: a focused centered column */
  .wizard { max-width: 640px; margin: 12px auto 0; }
  .whead { font-family: var(--serif); font-size: 32px; font-weight: 600;
    line-height: 1.2; margin: 4px 0 10px; letter-spacing: -.005em; }
  .whr { height: 1px; background: var(--hairline); margin: 26px 0 20px; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong);
    border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg .chip { border: none; border-radius: 0; border-left: 1px solid var(--border-strong);
    padding: 7px 16px; background: transparent; }
  .seg .chip:first-child { border-left: none; }
  .seg .chip.on { background: var(--gold); color: #fff; }
  .qrow.dim > div:first-child b, .qrow.dim .qmiss { opacity: .55; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #f6f3ec; }
  .chip.idea { background: var(--chip-bg); border-color: var(--chip-bd);
    color: var(--gold); font-weight: 550; }
  .chip.idea:hover { border-color: var(--gold); }
  .chip.idea.on { background: var(--gold-tint); border-color: var(--chip-bd);
    color: var(--gold); }
  .mchip input[type=checkbox] { accent-color: var(--gold); width: 13px; height: 13px; }

  /* executive overview grid: story chart | numbered next steps */
  .execgrid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 44px;
    align-items: start; }
  @media (max-width: 1100px) { .execgrid { grid-template-columns: 1fr; gap: 20px; } }
  .storyblock .stt { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .storyblock .plot { margin-top: 10px; }
  .storyblock svg { display: block; width: 100%; height: auto; }
  .lg2 { font-size: 12px; margin-right: 14px; }

  /* analyst overview: dense working grid + sparkline small multiples */
  .an-grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 14px;
    align-items: start; }
  @media (max-width: 1100px) { .an-grid { grid-template-columns: 1fr; } }
  .sparkrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    margin-bottom: 14px; }
  @media (max-width: 700px) { .sparkrow { grid-template-columns: 1fr; } }
  .spark { padding: 12px 14px; border-bottom: 1px solid var(--border) !important; }
  .spark .sl2 { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spark .sc2 { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
  .arow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto;
    gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline);

  const a = Math.abs(v);
  if (a >= 1e6) return nf1.format(v / 1e6) + (LANG === "fr" ? " M" : "M");

/* ---------- brand sun ---------- */
function sunPaths() {
  let dots = `<circle cx="0" cy="0" r="7.5" fill="#c9992a"/>`;
  for (let ring = 1; ring <= 8; ring++) {
    const R = 9 + ring * 4.6, n = 10 + ring * 6;
    const r = Math.max(.5, 2.1 - ring * .18), o = Math.max(.28, 1 - ring * .09);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 2 * Math.PI + ring * .35;
      dots += `<circle cx="${(R*Math.cos(a)).toFixed(1)}" cy="${(R*Math.sin(a)).toFixed(1)}" r="${r}" fill="#c9992a" opacity="${o.toFixed(2)}"/>`;
    }
  }
  return dots;
}
$("#sun").innerHTML = sunPaths();

/* ---------- upload ---------- */
const fileInput = $("#file"), statusEl = $("#status");
if (!SHARE) {
  $("#newupload").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
  window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropring"); });
  window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropring"); });
  window.addEventListener("drop", e => {
    e.preventDefault(); document.body.classList.remove("dropring");
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
  });
} else {
  document.body.classList.add("share");
}

function showSkeleton() {
  $("#content").innerHTML = `<div class="skel">
    <div class="sk sk-kicker"></div>
    <div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div>
      <div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
    <div class="sk sk-card"></div>
    <div class="sk-row" style="grid-template-columns:1fr 1fr">
      <div class="sk sk-card"></div><div class="sk sk-card"></div></div>
  </div>`;
}

async function upload(file) {
  setStatus(T.analyzing(file.name));
  showSkeleton();
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/analyze", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    setStatus("");
    await loadWorkbooks();
    select(body.id);
  } catch (err) {
    setStatus(T.analysis_failed(err.message), true);
    if (REPORT) renderAll(); else renderHomePage();  // never strand the skeleton
  }
  fileInput.value = "";
}
function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = isErr ? "err" : ""; }

/* ---------- sidebar: workbooks + analysis nav ---------- */
let WORKBOOKS = [];          // /analyses rollup rows, newest first
let NEXT_PAGE = "analyst";   // which page a workbook opens on (analyst|exec)
let EXEC_TAB = "overview";   // which module the executive page shows
let PUB_CHART = null;        // the published page's one frozen story chart

async function loadWorkbooks() {
  const items = await (await fetch("/analyses")).json();
  WORKBOOKS = items;
  // group the library by client workspace; unassigned last
  const groups = new Map();
  for (const i of items) {
    const key = i.client || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  const ordered = [...groups.keys()].sort((a, b) =>
    (a === "") - (b === "") || a.localeCompare(b));
  const wbRow = i => `
    <div class="wb ${i.id === current ? "active" : ""}" data-id="${esc(i.id)}" data-client="${esc(i.client || "")}">
      <div class="name">${esc(i.filename)}</div>
      <div class="meta"><span>${T.wb_meta(i.n_sheets, (i.size_bytes/1024).toFixed(0))}</span>
        <span><button data-act="client">${T.client_btn}</button><button data-act="rerun">${T.rerun}</button><button data-act="del">${T.del}</button></span></div>
    </div>`;
  $("#wb-list").innerHTML = items.length ? ordered.map(key => `
      ${groups.size > 1 || key ? `<div class="wb-group">${esc(key || T.wb_general)}${key ? `<button class="pbtn" data-portal="${esc(key)}">⧉ ${T.portal_btn}</button>` : ""}</div>` : ""}
      ${groups.get(key).map(wbRow).join("")}`).join("")
    : `<div class="muted" style="font-size:12px;padding:0 10px">${T.nothing_yet}</div>`;
  $$("#wb-list [data-portal]").forEach(el => el.addEventListener("click", async e => {
    e.stopPropagation();
    const client = el.dataset.portal;
    setStatus(T.portal_enabling);
    const r = await fetch(`/clients/${encodeURIComponent(client)}/portal`,
      { method: "POST" });
    if (!r.ok) { setStatus((await r.json()).detail || "!", true); return; }
    const url = location.origin + (await r.json()).url + "/page";
    try { await navigator.clipboard.writeText(url); } catch (_) {}
    setStatus(T.portal_copied(url));
  }));
  $$("#wb-list .wb").forEach(el => el.addEventListener("click", async e => {
    const act = e.target.dataset && e.target.dataset.act, id = el.dataset.id;
    if (act === "del") { e.stopPropagation();
      await fetch(`/analyses/${id}`, { method: "DELETE" });
      if (current === id) { goHome(); return; }
      loadWorkbooks();
    } else if (act === "client") { e.stopPropagation();
      const cur = el.closest("#wb-list").querySelector(`.wb[data-id="${id}"]`);
      const name = window.prompt(T.client_prompt,
        (cur && cur.dataset.client) || "");
      if (name === null) return;
      await fetch(`/analyses/${id}/client`, { method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ client: name }) });
      loadWorkbooks();
    } else if (act === "rerun") { e.stopPropagation();
      const prev = (current === id && AUDIT) ? AUDIT.total_abs_delta : null;
      setStatus(T.reanalyzing);
      if (current === id) showSkeleton();
      await fetch(`/analyses/${id}/rerun`, { method: "POST" });
      await select(id);
      if (prev != null) {
        const d = prev - AUDIT.total_abs_delta;
        setStatus(d > 0.01
          ? T.resolved(compact(d), compact(prev), compact(AUDIT.total_abs_delta))
          : T.unchanged(compact(AUDIT.total_abs_delta)));
      } else setStatus("");
    } else select(id);
  }));
}

};

function availableTabs() {
  const t = [["workbench", T.tab_workbench], ["overview", T.tab_overview]];
  if (REPORT.story) t.push(["story", T.tab_story]);
  // year series without recognized roles still get the Financials tab: the
  // mapping card there is HOW the analyst lights it (a monthly-only model
  // has no projections — Production carries it instead)
  if ((REPORT.model && Object.keys(REPORT.model.metrics || {}).length)
      || mappableSeries().length)
    t.push(["financials", T.tab_financials]);
  if (REPORT.model && REPORT.model.monthly)
    t.push(["production", T.tab_production]);
  if (REPORT.model && REPORT.model.scenario_ready) t.push(["whatif", T.tab_whatif]);
  t.push(["data", T.tab_trends]);
  t.push(["audit", T.tab_audit]);
  return t;
}

/* the mapping's address space: every year-axis series in the workbook */
function mappableSeries() {
  const out = [];
  for (const s of REPORT.sheets || []) {
    const grab = t => {
      const c = t && t.summary && t.summary.chart;
      if (c && c.kind === "timeseries" && c.axis === "year" && c.series_all)
        for (const se of c.series_all) out.push({ sheet: s.name, label: se.label });
    };
    grab(s.tidy);
    for (const p of s.panels || []) grab(p.tidy);
  }
  return out;
}
function openFindingsCount() {
  return (AUDIT.findings || []).concat(AUDIT.unverified || [])
    .filter(f => (f.decision || "open") === "open").length;
}
function tabCounts() {
  return { workbench: openFindingsCount() || null,
           audit: AUDIT.n_mismatched_relations,
           data: CHARTS.filter(c => !c.pseudo).length || null };
}

/* Smooth state changes: crossfade via the View Transitions API where the
   browser supports it (and the user hasn't asked for reduced motion). */
function rerender(fn) {
  if (document.startViewTransition
      && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.startViewTransition(fn);
  } else fn();
}

function setTab(id) { TAB = id; rerender(renderAll); window.scrollTo(0, 0); }

function renderNav() {
  const counts = tabCounts();
  $("#nav-analysis").innerHTML =
    `<div class="nav-item" id="nav-home" style="color:var(--gold)">← ${T.cc_kicker}</div>
     <span class="kicker">Analysis</span>` +
    availableTabs().map(([id, label]) => `
      <div class="nav-item ${TAB === id ? "active" : ""}" data-tab="${id}">
        ${TAB_ICONS[id]}${label}${counts[id] != null ? `<span class="cnt">${counts[id]}</span>` : ""}
      </div>`).join("");
  $$("#nav-analysis .nav-item[data-tab]").forEach(el =>
    el.addEventListener("click", () => setTab(el.dataset.tab)));
  $("#nav-home").addEventListener("click", goHome);
}

function renderTabBar() {
  const counts = tabCounts();
  return `<div class="tabs">${availableTabs().map(([id, label]) => `
    <button class="tabbtn ${TAB === id ? "on" : ""}" data-tab="${id}">${label}${
      counts[id] != null ? `<span class="tcnt">${counts[id]}</span>` : ""}</button>`).join("")}</div>`;
}
function attachTabBar() {
  $$(".tabs .tabbtn").forEach(b =>
    b.addEventListener("click", () => setTab(b.dataset.tab)));
  $$(".seeall").forEach(a =>
    a.addEventListener("click", () => setTab(a.dataset.tab)));
}

/* ---------- select + render ---------- */
async function select(id) {
  current = id;
  document.body.classList.remove("home");
  loadWorkbooks();
  [REPORT, AUDIT, PUBINFO] = await Promise.all(
    [fetch(`/analyses/${id}`).then(r => r.json()),
     fetch(`/analyses/${id}/findings`).then(r => r.json()),
     fetch(`/analyses/${id}/publish`).then(r => r.json()).catch(() => ({ published: false }))]);
  FILTER.sheets = null; FILTER.status = null; FILTER.periods = "all";
  MC_RESULTS = null; SCEN = { price: 1.0, vol: 1.0, cost: 1.0, ext: 1.0 };

}

/* ---------- the public published page: frozen exec snapshot only -------- */
function renderPublishedPage(snap) {
  // The public link renders the SAME business-voice dashboard as the in-app
  // exec preview: hydrate the globals the exec renderers read from the frozen
  // snapshot, then delegate to renderExecDashboard / renderExecOverview.
  // Everything is aggregate (model series, derived indicators, audit counts) —
  // the snapshot carries no sheets, findings, or line-item breakdowns.
  MODE = "exec"; PAGE = "exec";   // exec-page suppressions apply (no sheet names)
  document.body.dataset.mode = "exec";
  document.body.classList.add("home");
  REPORT = { filename: snap.filename, n_sheets: snap.n_sheets,
             model: snap.model || null, sheets: [], plan: null, brief: null };
  const ad = snap.audit || {};
  AUDIT = { n_mismatched_relations: ad.n_mismatched_relations || 0,
            n_unverified_relations: ad.n_unverified_relations || 0,
            n_verified_relations: ad.n_verified_relations || 0,
            total_abs_delta: ad.total_abs_delta || 0,
            findings: [], unverified: [] };
  SHEET_IDX = {};
  // the model dashboard draws its own pseudo charts; a model-less file needs
  // the frozen story chart — renderExecBody re-seeds it into CHARTS each render
  PUB_CHART = (snap.chart && (snap.chart.periods || []).length)
    ? { pseudo: true, sheet: "",
        chart: { kind: "timeseries", periods: snap.chart.periods, series: [] },
        lines: (snap.chart.series || []).map((s, i) => ({
          label: s.label || "", values: s.values || [],
          color: i < 2 ? SERIES_COLORS[i] : OTHER_COLOR, on: true })),
        i: 0, range: null }
    : null;

  const date = (snap.published_at || "").slice(0, 10);
  $("#topbar").innerHTML = `<div class="topbar exec">
    <span class="tkick">${T.pub_shared} · ${T.pub_line(snap.version, date)}</span>
    <span class="grow"></span>${langToggle()}
    <span class="ropill">${T.ex_readonly}</span></div>`;
  attachLang();
  renderExecBody(`${T.pub_frozen} · ${T.ex_provenance}`);
}

/* ---------- Public client portal: /portal/{token}/page.
   Lists this client's CURRENTLY-published dashboards, each linking to the
   existing exec page. Built only from the portal listing (frozen snapshots) —
   no report ever loads here. */
function renderPortalPage(view) {
  MODE = "exec";
  document.body.dataset.mode = "exec";
  const client = view.client || "";
  $("#topbar").innerHTML = `<div class="topbar exec">
    <span class="tkick">${T.portal_kicker} · ${esc(client)}</span>
    <span class="grow"></span>${langToggle()}
    <span class="ropill">${T.ex_readonly}</span></div>`;
  attachLang();

  const cards = (view.dashboards || []).map(d => {
    // honest chip from the frozen verdict alone: only claim "reconciled"
    // when relations actually verified (the snapshot no longer ships kpis)
    const v = d.verdict || {};
    const date = (d.published_at || "").slice(0, 10);
    const nChecks = (v.verified || 0) + (v.mismatched || 0);
    const chip = v.mismatched
      ? `<span class="schip crit">${T.portal_v_flag(v.mismatched)}</span>`
      : v.unverified
        ? `<span class="schip warn">${T.portal_v_review(v.unverified)}</span>`
        : v.verified
          ? `<span class="schip good">✓ ${T.portal_v_clean}</span>`
          : "";
    const checks = nChecks
      ? ` · ${T.portal_checks(v.verified || 0, nChecks)}` : "";
    return `<a class="wbrow" href="${esc(d.url)}/page">
      <div style="min-width:0;flex:1"><b>${esc(d.filename || "")}</b>
        <div class="wmeta">${T.portal_pub(d.version, date)}${checks}</div></div>
      ${chip}
      <span class="popen">${T.portal_open} →</span>
    </a>`;
  }).join("");

  const body = view.count
    ? `<div style="border-top:1px solid var(--border-strong);margin-top:18px">${cards}</div>`
    : `<div class="home-empty" style="padding-top:24px">
        <svg class="sunmark" width="28" height="28" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
        <h2 style="font-family:var(--serif);font-weight:600;font-size:20px">${T.portal_empty}</h2>
        <p class="lede">${T.portal_empty_sub}</p></div>`;

  $("#content").innerHTML = `<section class="portal">
    <span class="kicker">${T.portal_kicker}</span>
    <h1 class="vhead" style="margin-top:6px">${esc(client)}</h1>
    <p class="vlede">${T.portal_sub} · ${T.portal_count(view.count)}</p>
    ${body}
  </section>`;
}

/* ---------- Authed client hub: /portal/hub. Boots from /portal/me; lists
   the client's deliverables and renders a dashboard's frozen snapshot
   inline through the existing published-page renderer. */
async function bootHub() {
  document.body.classList.add("home");
  const me = await fetch("/portal/me");
  if (!me.ok) {
    $("#content").innerHTML = `<div class="home-empty">
      <svg class="sunmark" width="30" height="30" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
      <h1 style="font-size:22px">${T.portal_dead}</h1>
      <p class="lede">${T.portal_dead_sub}</p></div>`;
    return;
  }
  const items = await (await fetch("/portal/deliverables")).json();
  renderHubPage(await me.json(), items);
}

function hubStatusChip(status) {
  if (status === "flagged")
    return `<span class="schip crit">${T.hub_flagged}</span>`;
  if (status === "reconciled")
    return `<span class="schip good">✓ ${T.portal_v_clean}</span>`;
  if (status === "open")
    return `<span class="schip warn">${T.hub_flagged}</span>`;
  return "";                       // no checks ran — claim nothing
}

function renderHubPage(me, items) {
  MODE = "exec";
  document.body.dataset.mode = "exec";
  const client = me.client.name || "";
  $("#topbar").innerHTML = `<div class="topbar exec">
    <span class="tkick">${T.portal_kicker} · ${esc(client)}</span>
    <span class="grow"></span>
    <span class="cs" style="font-family:var(--mono);font-size:9.5px;color:var(--ink-3)">${esc(me.email)}</span>
    ${langToggle()}<span class="ropill">${T.ex_readonly}</span></div>`;
  attachLang();

  const row = d => `<div class="wbrow" data-did="${esc(d.id)}" role="link" tabindex="0">
      <div style="min-width:0;flex:1"><b>${esc(d.title)}</b>
        <div class="wmeta">${T.portal_pub(d.version, (d.published_at || "").slice(0, 10))}</div></div>
      ${d.kind === "file" ? `<span class="schip">${T.hub_file}</span>`
                          : hubStatusChip(d.status)}
      <span class="popen">${T.portal_open} →</span>
    </div>`;
  // group headers only when a group label actually exists (spec: nullable)
  const groups = new Map();
  for (const d of items) {
    const key = d.group || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  const list = [...groups.keys()].map(key => `
      ${key ? `<div class="wb-group">${esc(key)}</div>` : ""}
      ${groups.get(key).map(row).join("")}`).join("");

  const body = items.length
    ? `<div style="border-top:1px solid var(--border-strong);margin-top:18px">${list}</div>`
    : `<div class="home-empty" style="padding-top:24px">
        <svg class="sunmark" width="28" height="28" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
        <h2 style="font-family:var(--serif);font-weight:600;font-size:20px">${T.portal_empty}</h2>
        <p class="lede">${T.portal_empty_sub}</p></div>`;

  $("#content").innerHTML = `<section class="portal">
    <span class="kicker">${T.portal_kicker}</span>
    <h1 class="vhead" style="margin-top:6px">${esc(client)}</h1>
    <p class="vlede">${T.hub_sub} · ${T.hub_count(items.length)}</p>
    ${body}
  </section>`;
  $$("#content [data-did]").forEach(el => {
    const open = () => openDeliverable(el.dataset.did);
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });
}

async function openDeliverable(id) {
  const r = await fetch(`/portal/deliverables/${id}`);
  if (!r.ok) return;
  const d = await r.json();
  if (d.kind === "file") {
    // pdf and generated html briefs preview inline; anything else downloads
    // honestly (no in-browser xlsx rendering pretense)
    const fn = (d.filename || "").toLowerCase();
    if (fn.endsWith(".pdf") || fn.endsWith(".html")) renderFileViewer(d);
    else location.href = d.signed_url;
    return;
  }
  if (!d.snapshot) return;
  renderPublishedPage(d.snapshot);
  $("#topbar .topbar").insertAdjacentHTML("afterbegin",
    `<a class="seeall" id="hub-back" style="margin-right:14px;cursor:pointer">← ${T.hub_back}</a>`);
  $("#hub-back").addEventListener("click", bootHub);
}

function renderFileViewer(d) {
  MODE = "exec";
  document.body.dataset.mode = "exec";
  $("#topbar").innerHTML = `<div class="topbar exec">
    <a class="seeall" id="hub-back" style="cursor:pointer">← ${T.hub_back}</a>
    <span class="tkick" style="margin-left:14px">${esc(d.title)} · v${d.version}</span>
    <span class="grow"></span>${langToggle()}
    <span class="ropill">${T.ex_readonly}</span></div>`;
  attachLang();
  const isHtml = (d.filename || "").toLowerCase().endsWith(".html");
  const frame = isHtml
    ? `<iframe src="${esc(d.signed_url)}" sandbox=""
        style="width:100%;height:80vh;border:1px solid var(--border);background:#fbf9f3"></iframe>`
    : `<embed src="${esc(d.signed_url)}" type="application/pdf"
        style="width:100%;height:80vh;border:1px solid var(--border);background:var(--panel)">`;
  $("#content").innerHTML = `<section class="portal">
    ${frame}
    <p class="chcap" style="margin-top:10px">
      <a href="${esc(d.signed_url)}" download style="color:var(--gold)">↓ ${T.hub_download} — ${esc(d.filename || d.title)}</a></p>
  </section>`;
  $("#hub-back").addEventListener("click", bootHub);
}

function wbChip(w) {
  if (w.open_findings > 0)
    return `<span class="schip crit">${T.wb_audit(w.open_findings)}</span>`;
  if (w.published_version != null)
    return w.stale
      ? `<span class="schip warn">${T.wb_pub_stale(w.published_version)}</span>`
      : `<span class="schip good">✓ ${T.wb_pub_ok(w.published_version)}</span>`;
  if (w.checks_total > 0)
    return `<span class="schip good">✓ ${T.wb_clean(w.checks_ok, w.checks_total)}</span>`;
  return "";
}

function renderCommandCenter() {
  const ws = WORKBOOKS;
  const openTotal = ws.reduce((t, w) => t + (w.open_findings || 0), 0);
  const stakeTotal = ws.filter(w => w.open_findings > 0)
    .reduce((t, w) => t + (w.at_stake || 0), 0);
  const published = ws.filter(w => w.published_version != null);
  const nStale = published.filter(w => w.stale).length;
  const head = openTotal ? T.cc_head_dec(openTotal)
    : nStale ? T.cc_head_stale : T.cc_head_ok;
  const date = new Date().toLocaleDateString(LOCALE,
    { day: "numeric", month: "long", year: "numeric" });

  const strip = `<div class="kstrip sm">
    <div class="kcell"><div class="kl">${T.cc_workbooks}</div>
      <div class="kv">${ws.length}</div></div>
    <div class="kcell ${openTotal ? "crit" : ""}"><div class="kl">${T.cc_open}</div>
      <div class="kv">${openTotal}</div></div>
    <div class="kcell"><div class="kl">${T.cc_pub}</div>
      <div class="kv">${published.length}${published.length ? ` <span class="ksfx ${nStale ? "warn" : "good"}">· ${nStale ? T.cc_stale_sfx : T.cc_current_sfx}</span>` : ""}</div></div>
    <div class="kcell ${stakeTotal ? "crit" : ""}"><div class="kl">${T.k_stake}</div>
      <div class="kv">${compact(stakeTotal)}</div></div>
  </div>`;

  // the attention queue: gated publishes first, then stale published views
  const rows = [];
  for (const w of ws.filter(x => x.open_findings > 0))
    rows.push(`<div class="qrow2" data-open="${esc(w.id)}">
      <span class="qst" style="color:var(--critical)">✕ ${T.sb_fail}</span>
      <div><b>${T.cc_gate_row(w.open_findings)}</b>
        <div class="qsub">${esc(w.filename.slice(0, 44))}${w.at_stake ? ` · <b style="color:var(--critical)">${compact(w.at_stake)}</b> ${T.ac_stake}` : ""}</div></div>
      <button class="pillbtn gold" data-open="${esc(w.id)}">${T.cc_open_wb}</button>
    </div>`);
  for (const w of ws.filter(x => x.published_version != null && x.stale))
    rows.push(`<div class="qrow2" data-stale="${esc(w.id)}">
      <span class="qst" style="color:var(--warning)">⚠ ${T.cc_stale_chip}</span>
      <div><b>${T.cc_stale_row}</b>
        <div class="qsub">${esc(w.filename.slice(0, 44))} · ${T.cc_stale_sub(w.published_version)}</div></div>
      ${w.open_findings ? `<button class="pillbtn" data-open="${esc(w.id)}">${T.cc_open_wb}</button>`
        : `<button class="pillbtn" data-repub="${esc(w.id)}">${T.cc_republish(w.published_version + 1)}</button>`}
    </div>`);
  const queue = rows.length ? `<span class="kicker">${T.cc_attention}</span>
    <div style="border-top:1px solid var(--border-strong)">${rows.join("")}</div>` : "";

  const list = ws.map(w => `<div class="wbrow" data-open="${esc(w.id)}">
      <div style="min-width:0;flex:1"><b>${esc(w.filename)}</b>
        <div class="wmeta">${T.meta_line(w.n_sheets, "")}· ${esc((w.uploaded_at || "").slice(0, 10))}</div></div>
      ${wbChip(w)}
      <span class="minitabs"><span class="on" data-open="${esc(w.id)}">${T.mt_analyst}</span><span data-exec="${esc(w.id)}">${T.mt_exec}</span></span>
    </div>`).join("");

  $("#topbar").innerHTML = `<div class="topbar exec">
    <span class="tkick">${T.cc_kicker} · ${date}</span>
    <span class="grow"></span>${langToggle()}</div>`;
  attachLang();
  $("#content").innerHTML = `<div class="cc">
    <h1 class="cchead">${head}</h1>
    ${strip}
    <div class="ccgrid">
      <div>${queue}
        <span class="kicker" style="display:block;margin-top:${rows.length ? 30 : 0}px">${T.cc_workbooks}</span>
        <div style="border-top:1px solid var(--border-strong)">${list}</div>
      </div>
      <div><span class="kicker">${T.cc_new}</span>
        <div class="upcard" id="drop" style="margin-top:10px">
          <svg width="26" height="26" viewBox="-50 -50 100 100" aria-hidden="true">${sunPaths()}</svg>
          <div style="font-family:var(--serif);font-size:17px;font-weight:600;margin-top:8px">${T.cc_drop_small}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">${T.cc_drop_sub}</div>
          <div class="hint2" style="margin-top:10px">${T.drop_fmt}</div>
        </div>
        <p class="chcap" style="margin-top:14px">${T.home_lede}</p>
      </div>
    </div>
  </div>`;
  $("#drop").addEventListener("click", () => fileInput.click());
  $$("#content [data-open]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation(); NEXT_PAGE = "analyst"; select(el.dataset.open);
  }));
  $$("#content [data-exec]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation(); NEXT_PAGE = "exec"; select(el.dataset.exec);
  }));
  $$("#content [data-repub]").forEach(el => el.addEventListener("click", async e => {
    e.stopPropagation();
    el.disabled = true;
    const r = await fetch(`/analyses/${el.dataset.repub}/publish`, { method: "POST" });
    if (r.ok) {
      const b = await r.json();
      const row = el.closest(".qrow2");
      row.querySelector(".qst").outerHTML = `<span class="qst" style="color:var(--good)">✓ ${T.cc_done}</span>`;
      el.outerHTML = `<span class="schip good">✓ ${T.wb_pub_ok(b.version)}</span>`;
      loadWorkbooks();
    } else { el.disabled = false; setStatus((await r.json()).detail || "!", true); }
  }));
}
