}

/* the ANALYST | EXECUTIVE page tabs: gold segments on the analyst page,
   dark pill on the executive page (per turn 7) */
function pageTabs(dark) {
  return `<span class="ptabs ${dark ? "dark" : ""}">
    <span class="${PAGE === "analyst" ? "on" : ""}" data-page="analyst">${T.pt_analyst}</span>
    <span class="${PAGE === "exec" ? "on" : ""}" data-page="exec">${T.pt_exec}</span></span>`;
}
function attachPageTabs() {
  $$(".ptabs [data-page]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.page !== PAGE) { PAGE = b.dataset.page; rerender(renderAll); }
  }));
}

function renderAll() {
  const r = REPORT, a = AUDIT;
  SHEET_IDX = {}; r.sheets.forEach((s, i) => { SHEET_IDX[s.name] = i; });
  CHARTS = collectCharts(r);
  if (PAGE === "exec") { renderExecutivePage(); return; }
  MODE = "analyst";
  document.body.dataset.mode = "analyst";
  document.body.classList.remove("home");
  if (!availableTabs().some(([id]) => id === TAB)) TAB = "workbench";

  renderNav();
  $("#wb-kicker").textContent = T.wb_kicker;
  $("#newupload-txt").textContent = T.new_upload;
  $("#topbar").innerHTML = `<div class="topbar">
      <h2>${esc(r.filename)}</h2>
      <span class="sub">${T.meta_line(r.n_sheets, compact(kpiData().recs))}</span>
      <span class="grow"></span>
      ${langToggle()}${pageTabs(false)}
      <a class="seeall" id="preview-exec" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap">◉ ${T.pv_as_exec}</a>
      <button class="btn" id="print-report">⎙&nbsp; ${T.btn_report}</button>
      <button class="btn" id="dl-corrections">⤓&nbsp; ${T.btn_corrections}</button>
      <button class="btn" id="dl-findings">⤓&nbsp; ${T.btn_findings}</button>
    </div>`;
  attachLang(); attachPageTabs();
  $("#preview-exec").addEventListener("click", () => {
    PAGE = "exec"; rerender(renderAll);
  });
  $("#print-report").addEventListener("click", printReport);
  $("#dl-corrections").addEventListener("click", downloadCorrections);
  $("#dl-findings").addEventListener("click", downloadFindings);

  let body = "";
  if (TAB === "workbench") {
    body = renderWorkbench();
  } else if (TAB === "overview") {
    body = `<section id="sec-overview">${renderStatbar()}${renderAnalystOverview()}</section>`;
  } else if (TAB === "story") {
    body = renderStory();
  } else if (TAB === "financials") {
    body = renderFinancials();
  } else if (TAB === "production") {
    body = renderProduction();
  } else if (TAB === "whatif") {
    body = renderScenario() + renderMC();
  } else if (TAB === "data") {
    body = renderFilters() +
      `<section id="sec-charts"><span class="kicker">${T.ch_trends}</span>${renderChartGrid()}</section>` +
      `<section id="sec-profile"><span class="kicker">${T.pf_kicker}</span>${renderProfile()}</section>` +
      `<section id="sec-sheets"><span class="kicker">${T.sh_kicker(r.n_sheets)}</span>${renderSheets()}</section>`;
  } else if (TAB === "audit") {
    body = renderFilters() +
      `<section id="sec-audit"><span class="kicker">${T.tab_audit}</span>${renderHighlights()}${renderLeaderboards()}${renderFindingsTable()}</section>`;
  }
  $("#content").innerHTML = renderTabBar() + body;

  attachTabBar(); attachFilters(); attachCharts(); attachFindingRows();
  attachBarRows(); attachScenario(); attachMC(); attachNarrative();
  attachStory(); attachWorkbench(); attachMapping();
}

/* ---------- the Executive page (7d/7e): read-only over the audited data —
   no edit/map/decision controls; What-if levers stay interactive (they only
   explore, they never mutate the stored figures) ---------------------------- */
function renderExecutivePage() {
  MODE = "exec";
  document.body.dataset.mode = "exec";
  document.body.classList.add("home");     // the downstream view: no sidebar
  const pubDate = PUBINFO.published
    ? new Date(PUBINFO.published_at).toLocaleDateString(LOCALE,
        { day: "numeric", month: "long", year: "numeric" }) : null;
  $("#topbar").innerHTML = `<div class="topbar exec">
    <span class="tkick">${esc(REPORT.filename)} · ${pubDate
      ? T.ex_pub_kicker(esc(pubDate)) : T.ex_preview_note}</span>
    <span class="grow"></span>
    ${langToggle()}${pageTabs(true)}
    <span class="ropill">${T.ex_readonly}</span>
  </div>`;
  attachLang(); attachPageTabs();
  renderExecBody(T.ex_provenance);
}

/* The exec dashboard body + tab suite — shared by the in-app preview and the
   public /published page so the two can never drift. Reads REPORT.model /
   AUDIT (the published page hydrates these from the frozen snapshot); a tab
   click re-renders ONLY this body, never the whole app. */
function renderExecBody(footer) {
  // rebuild CHARTS from a clean base each render (pseudo charts are pushed
  // during render and must not accumulate across tab switches); the published
  // page seeds its one frozen story chart via PUB_CHART
  CHARTS = collectCharts(REPORT);
  if (PUB_CHART) { PUB_CHART.i = CHARTS.length; CHARTS.push(PUB_CHART); }
  const tabs = execAvailableTabs();
  if (!tabs.some(([id]) => id === EXEC_TAB)) EXEC_TAB = "overview";
  // the contradiction fig-chip rides the tab row so the trust signal is on
  // EVERY exec tab, not just the overview body (right-aligned via margin,
  // not the .grow spacer which is only styled inside .topbar/.card-head)
  const chip = execFigChip();
  const tabBar = (tabs.length > 1 || chip)
    ? `<div class="tabs">${tabs.map(([id, label]) => `
        <button class="tabbtn ${EXEC_TAB === id ? "on" : ""}" data-xtab="${id}">${label}</button>`).join("")}
        ${chip ? `<span style="margin-left:auto;align-self:center">${chip}</span>` : ""}</div>`
    : "";
  const plan = REPORT.plan;
  // Overview: a workbook with a business model gets the full financial
  // dashboard; everything else keeps the editorial brief view / audit
  // overview. The other tabs reuse the analyst modules, read-only.
  let inner;
  if (EXEC_TAB === "financials") {
    inner = renderFinancials(true);
  } else if (EXEC_TAB === "production") {
    inner = renderProduction();
  } else if (EXEC_TAB === "whatif") {
    inner = renderScenario() + renderMC();
  } else if (REPORT.model && Object.keys(REPORT.model.metrics || {}).length) {
    inner = renderExecDashboard();
  } else if (plan && plan.approved) {
    const smap = storyMetricMap();
    inner = renderStoryDashExec(smap, plan.approved.filter(id => smap[id]));
  } else {
    inner = `<section>${renderExecOverview()}</section>`;
  }
  $("#content").innerHTML = `${tabBar}${inner}
    <p class="chcap" style="margin-top:34px;border-top:1px solid var(--hairline);padding-top:12px;max-width:64ch">${footer}</p>`;
  $$("#content [data-xtab]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.xtab !== EXEC_TAB) {
      EXEC_TAB = b.dataset.xtab; rerender(() => renderExecBody(footer));
      window.scrollTo(0, 0);
    }
  }));
  attachFigChip(); attachCharts(); attachScenario(); attachMC();
}

/* capability-gated exec modules — same gates as the analyst tabs */
function execAvailableTabs() {
  const m = REPORT.model;
  const t = [["overview", T.tab_overview]];
  if (m && Object.keys(m.metrics || {}).length) t.push(["financials", T.xt_costs]);
  if (m && m.monthly) t.push(["production", T.tab_production]);
  if (m && m.scenario_ready) t.push(["whatif", T.tab_whatif]);
  return t;
}

/* ---------- the Analyst workbench (7a): four jobs, one rail -------------- */
function decisionCell(f) {
  const d = f.decision || "open";
  if (d === "approved")
    return `<span class="schip good">${T.wb_approved}</span>
      <button class="iconbtn" data-dec="open" data-fid="${esc(f.id)}" title="${T.wb_undo_t}">↺</button>`;
  if (d === "flagged")
    return `<span class="schip warn">${T.wb_flagged}</span>
      <button class="iconbtn" data-dec="open" data-fid="${esc(f.id)}" title="${T.wb_undo_t}">↺</button>`;
  if (f.status === "unverified")
    return `<button class="pillbtn" data-dec="flagged" data-fid="${esc(f.id)}">${T.wb_review}</button>`;
  return `<button class="pillbtn gold" data-dec="approved" data-fid="${esc(f.id)}">${T.wb_approve}</button>
    <button class="pillbtn" data-dec="flagged" data-fid="${esc(f.id)}">${T.wb_keep}</button>`;
}

function renderWorkbench() {
  const nOpen = openFindingsCount();
  const pub = PUBINFO.published;

  // 01 — audit & fix
  const rows = AUDIT.findings.map(f => {
    const worst = (f.mismatches || [])[0] || {};
    return `<div class="wfrow">
      <span class="ast bad">✕ ${T.sb_fail}</span>
      <div class="wfd"><b>${esc(f.sheet)}</b> — ${esc(plainFormula(f))}
        <div class="qsub">${T.a_off(f.n_mismatched, f.n_checked)}${worst.row != null ? ` · ${T.row_w} ${worst.row}` : ""}</div></div>
      <span class="adelta bad">${compact(f.total_abs_delta)}</span>
      <span class="wfdec">${decisionCell(f)}</span>
    </div>`;
  }).concat(AUDIT.unverified.length ? [(() => {
    // ONE row for the unverified group — "quick manual glance" is one act,
    // so reviewing it decides every unverified entry in a single batch
    const allIds = AUDIT.unverified.map(f => f.id).join(",");
    const nOpenUnv = AUDIT.unverified
      .filter(f => (f.decision || "open") === "open").length;
    const cell = nOpenUnv
      ? `<button class="pillbtn" data-dec="flagged" data-fid="${esc(allIds)}">${T.wb_review}</button>`
      : `<span class="schip warn">${T.wb_flagged}</span>
         <button class="iconbtn" data-dec="open" data-fid="${esc(allIds)}" title="${T.wb_undo_t}">↺</button>`;
    return `<div class="wfrow">
      <span class="ast warn">? ${T.sb_unv}</span>
      <div class="wfd"><b>${T.a_eyeball}</b>
        <div class="qsub">${T.a_unv(AUDIT.n_unverified_relations)}</div></div>
      <span class="adelta">—</span>
      <span class="wfdec">${cell}</span>
    </div>`;
  })()] : []).join("");
  const card01 = `<div class="card wjcard" id="wj-1">
    <div class="card-head"><span class="cs">01 · ${T.wj_audit}</span>
      <span class="ct">${T.wb01_t}</span><span class="grow"></span>
      <button class="btn" id="wb-export">⤓ ${T.wb_export}</button></div>
    <div class="rfoot" style="margin:2px 0 10px">${T.wb01_note}</div>
    ${rows || `<div class="muted" style="padding:14px 0">${T.a_none_txt}</div>`}
    ${AUDIT.n_verified_relations ? `<div class="rfoot" style="color:var(--good);margin-top:12px">✓ ${T.wb_pass(AUDIT.n_verified_relations, AUDIT.n_verified_relations + AUDIT.n_mismatched_relations)}</div>` : ""}
  </div>`;

  // 02 — data profile (never ships)
  const es = collectEda();
  const bySheet = es.map(({ sheet, eda }) => {
    const cells = (eda.row_count || 0) * (eda.column_count || 0);
    let nulls = 0;
    for (const i of Object.values(eda.missingness || {})) nulls += i.count || 0;
    return { sheet, pct: cells ? nulls / cells * 100 : 0 };
  }).sort((a, b) => b.pct - a.pct).slice(0, 4);
  const missRows = bySheet.map((s, k) => `<div class="prow2">
      <span class="pl2" style="font-family:var(--mono);font-size:10px;text-transform:uppercase">${esc(s.sheet.trim().slice(0, 20))}</span>
      <span class="pp2">${s.pct.toFixed(0)}%</span>
      <span class="ptrack"><span style="width:${Math.min(100, s.pct).toFixed(0)}%;background:${["#a8821f", "#c2a960", "#d5c391", "#d5c391"][k]}"></span></span>
    </div>`).join("");
  const wf = workbookFill();
  const nTables = es.length;
  const structure = [
    [T.wb02_dupes, `${wf.dupes}`],
    [T.wb02_tables, T.wb02_of(nTables, REPORT.n_sheets)],
  ].map(([l, v]) => `<div class="prow2" style="grid-template-columns:1fr auto">
      <span class="pl2">${l}</span><b style="font-variant-numeric:tabular-nums">${v}</b></div>`).join("");
  const card02 = `<div class="card wjcard" id="wj-2">
    <div class="card-head"><span class="cs">02 · ${T.wj_profile}</span>
      <span class="ct">${T.wb02_t}</span><span class="grow"></span>
      <span class="vbadge" style="border-style:dashed">${T.wb02_chip}</span></div>
    <div class="grid2" style="margin-top:10px">
      <div><div class="psub">${T.wb02_missing}</div>${missRows}</div>
      <div><div class="psub">${T.wb02_structure}</div>${structure}</div>
    </div>
  </div>`;

  // 03 — what the executive sees (true shipping state, no fake toggles)
  const vis = visCharts().filter(c => !c.pseudo);
  const primary = vis.filter(c => c.chart.kind === "timeseries")
    .sort((x, y) => y.chart.periods.length - x.chart.periods.length)[0];
  const nSteps = Math.min(4, AUDIT.findings.length
    + (AUDIT.n_unverified_relations ? 1 : 0));
  const mods = [
    [T.mod_verdict, true, ""],
    [T.mod_kpi, true, "4 " + T.mod_tiles],
    [T.mod_chart, !!primary, primary ? esc(primary.sheet.trim().slice(0, 18)) : ""],
    [T.mod_steps, nSteps > 0, String(nSteps)],
    [T.mod_narr, false, T.wb03_noship],
    [T.mod_recon, false, T.wj_analyst_only],
  ];
  const modChips = mods.map(([label, ships, note]) => `
    <span class="modchip ${ships ? "on" : "off"}">
      <span class="mck">${ships ? "✓" : ""}</span> ${label}${note ? ` <span class="cs">· ${note}</span>` : ""}</span>`).join("");
  const card03 = `<div class="card wjcard" id="wj-3">
    <div class="card-head"><span class="cs">03 · ${T.wj_build}</span>
      <span class="ct">${T.wb03_t}</span><span class="grow"></span>
      <a class="seeall" id="wb-edit-brief" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase">✎ ${T.st_edit_link}</a></div>
    <div class="chiprow" style="margin-top:12px">${modChips}</div>
  </div>`;

  // 04 — publish band (the gate made visible) + stale banner + popover
  const pubDate = pub ? new Date(PUBINFO.published_at)
    .toLocaleDateString(LOCALE, { day: "numeric", month: "long", year: "numeric" }) : null;
  const staleBanner = (pub && PUBINFO.stale) ? `<div class="stalebar">
      <b>⚠ ${T.wb_stale_t}</b> ${T.wb_stale_b(PUBINFO.version)}
      <span class="grow"></span>
      <button class="pillbtn gold" id="wb-republish" ${nOpen ? "disabled" : ""}>${T.cc_republish(PUBINFO.version + 1)}</button>
    </div>` : "";
  const bandMsg = pub
    ? `<span style="color:#7fb069;font-weight:600">✓ ${T.wb04_published(esc(pubDate), PUBINFO.version)}</span>`
    : nOpen
      ? T.wb04_gated(nOpen)
      : `<span style="color:#e8c15a">${T.wb04_ready}</span>`;
  const band = `<div class="pubband" id="wj-4">
    <div><div class="cs" style="color:#8a8271">04 · ${T.wb04_t}</div>
      <div style="margin-top:4px;font-size:13.5px">${bandMsg}</div></div>
    <span class="grow"></span>
    <button class="pillbtn dark" id="wb-preview">◉ ${T.pv_as_exec}</button>
    ${pub ? `<button class="pillbtn amber" id="wb-share">⧉ ${T.wb04_share}</button>` : ""}
    ${NARR_READY ? `<button class="pillbtn dark" id="wb-brief">✎ ${T.wb_brief}</button>` : ""}
    ${pub ? "" : `<button class="pillbtn ${nOpen ? "dark" : "gold"}" id="wb-publish" ${nOpen ? "disabled" : ""}>${T.wb04_publish}</button>`}
    <div class="popover" id="share-pop">
      <div class="kicker">${T.po_t}</div>
      <div style="display:flex;gap:8px;margin:10px 0">
        <input class="binput" id="share-url" readonly style="font-family:var(--mono);font-size:11px" value="${pub ? esc(location.origin + PUBINFO.url + "/page") : ""}">
        <button class="pillbtn gold" id="share-copy">${T.po_copy}</button></div>
      <div class="chcap">${T.po_expl}</div>
      <div style="display:flex;margin-top:12px;align-items:baseline;gap:12px">
        <a class="seeall" id="share-revoke" style="color:var(--critical);font-size:11.5px">${T.po_revoke}</a>
        <span style="flex:1"></span>
        <span class="cs" style="font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">${T.po_opened(PUBINFO.opened_count || 0)}</span></div>
    </div>
  </div>`;

  // the workflow rail
  const rail = [
    ["#wj-1", "1", T.wj_audit, nOpen
      ? `<span style="color:var(--critical)">${T.wj_open(nOpen)}</span>`
      : `<span style="color:var(--good)">✓ ${T.wj_done}</span>`, !nOpen],
    ["#wj-2", "2", T.wj_profile, T.wj_analyst_only, false],
    ["#wj-3", "3", T.wj_build, T.wj_ready, false],
    ["#wj-4", "4", T.wb04_t, pub
      ? `<span style="color:var(--good)">✓ v${PUBINFO.version}${PUBINFO.stale ? ` · <span style="color:var(--warning)">${T.cc_stale_sfx}</span>` : ""}</span>`
      : nOpen ? `<span style="color:var(--warning)">${T.wj_gated}</span>`
              : `<span style="color:var(--good)">${T.wj_ready}</span>`, false],
  ].map(([href, n, label, status, done]) => `
    <a class="rail-item ${done ? "done" : ""}" href="${href}">
      <span class="c">${done ? "✓" : n}</span>
      <span><span class="rl">${label}</span><span class="rs">${status}</span></span>
    </a>`).join("");

  return `<section id="sec-workbench"><div class="wbgrid">
    <div class="rail">${rail}</div>
    <div>${staleBanner}${card01}${card02}${card03}${band}</div>
  </div></section>
  ${renderReviewModal(mods, nSteps)}`;
}

/* the 8a review sheet: see what ships before it ships */
function renderReviewModal(mods, nSteps) {
  const m = AUDIT.n_mismatched_relations, u = AUDIT.n_unverified_relations;
  const head = m ? T.vh_bad(m) : (u ? T.vh_review(u) : T.vh_ok);
  const shipRows = mods.filter(x => x[1]).map(([label, _, note]) => `
    <div class="rmrow"><span style="color:var(--good);font-family:var(--mono)">✓</span>
      <b>${label}</b><span class="cs">${label === T.mod_verdict ? `“${esc(head)}”` : note}</span></div>`).join("");
  const nFlagged = (AUDIT.findings || []).concat(AUDIT.unverified || [])
    .filter(f => f.decision === "flagged").length;
  return `<div class="scrim" id="review-scrim">
    <div class="rmodal">
      <div class="kicker">${T.wb04_t}</div>
      <h2 style="font-family:var(--serif);font-size:26px;font-weight:600;margin:8px 0 14px">${T.rm_t}</h2>
      <div style="border-top:1px solid var(--hairline)">${shipRows}</div>
      <div class="rmrow" style="align-items:start"><span style="color:var(--warning)">⚑</span>
        <span style="grid-column:2/4;font-size:12.5px;line-height:1.6;color:var(--ink-2)">${T.rm_flag(nFlagged)}</span></div>
      <div style="display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap">
        <button class="runbtn" id="rm-publish" style="max-width:170px;margin:0">${T.wb04_publish}</button>
        <button class="pillbtn" id="rm-preview">◉ ${T.rm_preview}</button>
        <span class="grow"></span>
        <a class="seeall" id="rm-back">${T.rm_back}</a>
      </div>
    </div>
  </div>`;
}

async function refreshWorkbookState() {
  [AUDIT, PUBINFO] = await Promise.all([
    fetch(`/analyses/${current}/findings`).then(r => r.json()),
    fetch(`/analyses/${current}/publish`).then(r => r.json())]);
  loadWorkbooks();
}

function attachWorkbench() {
  if (TAB !== "workbench" || !$("#sec-workbench")) return;
  $$("#sec-workbench [data-dec]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    // data-fid may carry several ids (the grouped unverified row)
    const decisions = {};
    b.dataset.fid.split(",").forEach(fid => { decisions[fid] = b.dataset.dec; });
    const r = await fetch(`/analyses/${current}/decisions`, { method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ decisions }) });
    if (!r.ok) { b.disabled = false;
      setStatus((await r.json()).detail || "!", true); return; }
    await refreshWorkbookState();
    rerender(renderAll);
  }));
  const exp = $("#wb-export");
  if (exp) exp.addEventListener("click", downloadCorrections);
  const eb = $("#wb-edit-brief");
  if (eb) eb.addEventListener("click", () => setTab("story"));
  const pv = $("#wb-preview");
  if (pv) pv.addEventListener("click", () => { PAGE = "exec"; rerender(renderAll); });
  const doPublish = async btn => {
    btn.disabled = true;
    const r = await fetch(`/analyses/${current}/publish`, { method: "POST" });
    if (!r.ok) { btn.disabled = false;
      setStatus((await r.json()).detail || "!", true); return; }
    await refreshWorkbookState();
    rerender(renderAll);
  };
  const pubBtn = $("#wb-publish");
  if (pubBtn) pubBtn.addEventListener("click", () =>
    $("#review-scrim").classList.add("open"));
  const briefBtn = $("#wb-brief");
  if (briefBtn) briefBtn.addEventListener("click", async () => {
    briefBtn.disabled = true;
    setStatus(T.brief_generating);
    const r = await fetch(`/analyses/${current}/brief-report?lang=${LANG}`,
                          { method: "POST" });
    briefBtn.disabled = false;
    if (r.ok) setStatus(T.brief_done((await r.json()).version));
    else setStatus((await r.json()).detail || "!", true);
  });
  const rp = $("#wb-republish");
  if (rp) rp.addEventListener("click", () => doPublish(rp));
  const rmPub = $("#rm-publish");
  if (rmPub) rmPub.addEventListener("click", () => doPublish(rmPub));
  const rmPrev = $("#rm-preview");
  if (rmPrev) rmPrev.addEventListener("click", () => {
    $("#review-scrim").classList.remove("open");
    PAGE = "exec"; rerender(renderAll);
  });
  const rmBack = $("#rm-back");
  if (rmBack) rmBack.addEventListener("click", () =>
    $("#review-scrim").classList.remove("open"));
  const scrim = $("#review-scrim");
  if (scrim) scrim.addEventListener("click", e => {
    if (e.target === scrim) scrim.classList.remove("open");
  });
  const share = $("#wb-share");
  if (share) share.addEventListener("click", e => {
    e.stopPropagation();
    $("#share-pop").classList.toggle("open");
  });
  const pop = $("#share-pop");
  if (pop) pop.addEventListener("click", e => e.stopPropagation());
  const cp = $("#share-copy");
  if (cp) cp.addEventListener("click", async () => {
    const url = $("#share-url").value;
    try { await navigator.clipboard.writeText(url); setStatus(T.share_copied(url)); }
    catch { setStatus(T.share_manual(url)); }
  });
  const rv = $("#share-revoke");
  if (rv) rv.addEventListener("click", async () => {
    await fetch(`/analyses/${current}/publish`, { method: "DELETE" });
    await refreshWorkbookState();
    rerender(renderAll);
  });
}

        <div class="search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#99917e" stroke-width="1.4"/><path d="M8 8l2.6 2.6" stroke="#99917e" stroke-width="1.4" stroke-linecap="round"/></svg>

document.addEventListener("click", e => {   // close popovers on outside click
  if (!e.target.closest(".pill")) $$(".pill").forEach(p => p.classList.remove("open"));
});

function attachFilters() {
  $$(".pill > button").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const pill = btn.parentElement, was = pill.classList.contains("open");
    $$(".pill").forEach(p => p.classList.remove("open"));
    if (!was) pill.classList.add("open");
  }));
  $$(".pop").forEach(p => p.addEventListener("click", e => e.stopPropagation()));

  $$("#pf-periods .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.periods = o.dataset.v; renderAll();
  }));
  $$("#pf-status .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.status = o.dataset.v || null; renderAll();
  }));
  $$("#pf-sheets #sheet-opts .opt").forEach(o => o.addEventListener("click", () => {
    const v = o.dataset.v;
    if (!FILTER.sheets) FILTER.sheets = new Set();
    FILTER.sheets.has(v) ? FILTER.sheets.delete(v) : FILTER.sheets.add(v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  $$("#pf-sheets .fchip").forEach(ch => ch.addEventListener("click", () => {
    FILTER.sheets.delete(ch.dataset.v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  const clr = $("#sheets-clear");
  if (clr) clr.addEventListener("click", () => { FILTER.sheets = null; renderAll(); openPill("pf-sheets"); });
  const search = $("#sheet-search");
  if (search) search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    $$("#sheet-opts .opt").forEach(o =>
      o.style.display = o.dataset.v.toLowerCase().includes(q) ? "" : "none");
  });
}
function openPill(id) {
  const p = document.getElementById(id);
  if (p) { p.classList.add("open"); const s = $("#sheet-search"); if (s) s.focus(); }
}

/* ---------- overview hero: the 3-4 numbers that lead this workbook -------- */
function renderHero() {
  const m = REPORT.model, tiles = [];
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
  if (m) {
    const rev = m.metrics.revenue;
    if (rev) {
      const v = rev.values, fi = v.findIndex(x => x != null);
      let li = -1; for (let i = v.length - 1; i >= 0; i--) if (v[i] != null) { li = i; break; }
      const growth = fi >= 0 && li > fi && v[fi] ? ((v[li] / v[fi] - 1) * 100) : null;
      tiles.push(`<div class="hero-tile"><div class="hl">${T.h_revenue(esc(m.periods[fi]), esc(m.periods[li]))}</div>
        <div class="hv">${compact(sum(v))}</div>
        ${growth != null ? `<div class="hs" style="color:var(--good)">${growth >= 0 ? "▲" : "▼"} ${T.h_horizon(Math.abs(growth).toFixed(0))}</div>` : ""}</div>`);
    }
    const mp = m.derived.margin_pct && last(m.derived.margin_pct);
    if (mp != null) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_margin}</div>
      <div class="hv">${pctFmt(mp)}</div><div class="hs">${T.h_latest}</div></div>`);
    const vr = m.derived.volume_ratio && last(m.derived.volume_ratio);
    if (vr != null) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_conversion}</div>
      <div class="hv">${pctFmt(vr * 100, 1)}</div>
      <div class="hs">${esc(m.metrics.volume_secondary.label.slice(0, 16))} / ${esc(m.metrics.volume.label.slice(0, 16))}</div></div>`);
    if (m.metrics.capex) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_capex}</div>
      <div class="hv">${compact(sum(m.metrics.capex.values))}</div></div>`);
  } else {
    // no business model role-tagged -> lead with the data-profile numbers
    const es = collectEda();
    const rows = es.reduce((t, e) => t + (e.eda.row_count || 0), 0);
    if (!rows) return "";
    let cells = 0, nulls = 0, dupes = 0;
    for (const e of es) {
      cells += (e.eda.row_count || 0) * (e.eda.column_count || 0);
      dupes += e.eda.duplicates || 0;
      for (const info of Object.values(e.eda.missingness || {})) nulls += info.count || 0;
    }
    tiles.push(`<div class="hero-tile"><div class="hl">${T.h_rows}</div>
      <div class="hv">${compact(rows)}</div><div class="hs">${T.h_tables(es.length)}</div></div>`);
    if (cells) tiles.push(`<div class="hero-tile"><div class="hl">${T.h_complete}</div>
      <div class="hv">${(100 - nulls / cells * 100).toFixed(0)}%</div><div class="hs">${T.h_filled}</div></div>`);
    tiles.push(`<div class="hero-tile"><div class="hl">${T.h_dupes}</div>
      <div class="hv">${dupes}</div></div>`);
  }
  return tiles.length ? `<div class="hero">${tiles.slice(0, 4).join("")}</div>` : "";
}

/* ---------- data profile: EDA facts as a dashboard (any file type) ------- */
function collectEda() {
  const out = [];
  for (const s of REPORT.sheets) {
    if (s.tidy && s.tidy.eda && s.tidy.eda.row_count) out.push({ sheet: s.name, eda: s.tidy.eda });
    for (const p of s.panels || [])
      if (p.tidy && p.tidy.eda && p.tidy.eda.row_count) out.push({ sheet: s.name, eda: p.tidy.eda });
  }
  return out;
}

function renderProfile() {
  const es = collectEda().filter(e => sheetVisible(e.sheet));
  if (!es.length) return `<div class="card muted">${T.pf_none}</div>`;
  const cards = es.slice(0, 6).map(({ sheet, eda }) => {
    const cells = eda.row_count * eda.column_count;
    let nulls = 0;
    for (const info of Object.values(eda.missingness || {})) nulls += info.count || 0;
    const badges = [
      T.pf_dims(compact(eda.row_count), eda.column_count),
      cells ? T.pf_complete((100 - nulls / cells * 100).toFixed(0)) : null,
      eda.duplicates ? T.pf_dupes(eda.duplicates) : null,
      (eda.constant_columns || []).length ? T.pf_const(eda.constant_columns.length) : null,
    ].filter(Boolean).map(b => `<span class="pbadge">${esc(b)}</span>`).join("");

    // top categories by average of the detected target column
    let breakdown = "";
    const bd = (eda.categorical_breakdowns || [])[0];
    if (bd && eda.target_column) {
      const mx = Math.max(1, ...bd.categories.map(c => Math.abs(c.mean)));
      breakdown = `<div class="psub">${T.pf_avg(esc(String(eda.target_column).slice(0, 24)), esc(bd.column.slice(0, 24)))}</div>` +
        bd.categories.slice(0, 5).map(c => `<div class="bar-row">
          <span class="bl">${esc(c.category.slice(0, 40))} <span class="muted">(${c.count})</span></span>
          <span class="bv">${compact(c.mean)}</span>
          <div class="track"><div class="fill" style="width:${Math.max(3, Math.abs(c.mean) / mx * 100)}%;background:var(--gold)"></div></div>
        </div>`).join("");
    }

    // the detected target column's shape
    let stats = "";
    const t = eda.target_column && (eda.numeric_columns || {})[eda.target_column];
    if (t) {
      stats = `<div class="psub">${esc(String(eda.target_column).slice(0, 28))}</div>
        <div class="pstats">
          <span>${T.pf_min} <b>${compact(t.min)}</b></span><span>${T.pf_med} <b>${compact(t.median)}</b></span>
          <span>${T.pf_max} <b>${compact(t.max)}</b></span>
          ${t.outlier_count ? `<span style="color:var(--warning)">${T.pf_out} <b>${t.outlier_count}</b></span>` : ""}
        </div>`;
    }
    return `<div class="card"><div class="card-head"><span class="ct">${esc(sheet)}</span></div>
      <div style="margin-top:8px">${badges}</div>${stats}${breakdown}</div>`;
  });
  return `<div class="grid2">${cards.join("")}</div>`;
}

/* ---------- redesigned overview: executive (editorial) ---------- */
const titleCase = s => String(s).toLowerCase()
  .replace(/(^|[\s('"«-])\S/g, m => m.toUpperCase());

function workbookFill() {
  const es = collectEda();
  let cells = 0, nulls = 0, dupes = 0;
  for (const e of es) {
    cells += (e.eda.row_count || 0) * (e.eda.column_count || 0);
    dupes += e.eda.duplicates || 0;
    for (const info of Object.values(e.eda.missingness || {})) nulls += info.count || 0;
  }
  return { cells, nulls, dupes, tables: es.length,
    fill: cells ? Math.round(100 - nulls / cells * 100) : null };
}

function renderExecOverview() {
  const a = AUDIT, m = a.n_mismatched_relations;
  const head = execHead(null, null);
  const vis = visCharts().filter(c => !c.pseudo);
  const primary = vis.filter(c => c.chart.kind === "timeseries")
    .sort((x, y) => y.chart.periods.length - x.chart.periods.length)[0];
  // KPI strip in business terms: the primary series' peak and latest reading,
  // plus the figures' own reliability — never rows, fill or sheet counts
  const cells = [];
  if (primary && primary.lines.length) {
    const l = primary.lines[0], vals = l.values;
    let pk = -1, last = -1;
    vals.forEach((v, i) => { if (v != null) {
      if (pk < 0 || v > vals[pk]) pk = i; last = i; } });
    if (pk >= 0) cells.push(`<div class="kcell"><div class="kl">${T.ch_peak} — ${esc(titleCase(String(l.label).slice(0, 18)))}</div>
      <div class="kv">${compact(vals[pk])}</div>
      <div class="ks">${esc(String(primary.chart.periods[pk]))}</div></div>`);
    if (last >= 0 && last !== pk) cells.push(`<div class="kcell"><div class="kl">${T.ch_latest}</div>
      <div class="kv">${compact(vals[last])}</div>
      <div class="ks">${esc(String(primary.chart.periods[last]))}</div></div>`);
  }
  const checksTot = a.n_verified_relations + m;
  if (checksTot) cells.push(`<div class="kcell"><div class="kl">${T.t_verified}</div>
    <div class="kv">${a.n_verified_relations}<span class="den">/${checksTot}</span></div>
    <div class="ks">${T.k_recon}</div></div>`);
  if (m) cells.push(`<div class="kcell crit"><div class="kl">${T.k_stake}</div>
    <div class="kv">${compact(a.total_abs_delta)}</div>
    <div class="ks">${T.k_stake_sub(m)}</div></div>`);
  const strip = cells.length ? `<div class="kstrip">${cells.join("")}</div>` : "";
  const steps = execStepsBiz();
  const stepRows = steps.length
    ? steps.map((s, i) => `<div class="step"><span class="n">${i + 1}</span>
        <div><b>${s.t}</b><p>${s.s}</p></div></div>`).join("")
    : `<div class="step"><span class="n" style="color:var(--good)">✓</span>
        <div><p>${T.nx_none}</p></div></div>`;
  return `<h1 class="vhead">${head}</h1>
    <p class="vlede">${execLede()}</p>
    ${strip}
    <div class="execgrid">
      <div>${primary ? storyChartExec(primary)
        : `<div class="muted" style="padding:40px 0">${T.no_ts}</div>`}</div>
      <div><span class="kicker">${T.nx_kicker}</span>${stepRows}</div>
    </div>`;
}

/* exec voice: business actions, never cell coordinates — the analyst
   workbench keeps the per-sheet confirm steps */
function execStepsBiz() {
  const out = [];
  if (AUDIT.n_mismatched_relations)
    out.push({ t: T.xs_resolve(AUDIT.n_mismatched_relations),
      s: T.xs_resolve_sub(compact(AUDIT.total_abs_delta)) });
  if (AUDIT.n_unverified_relations)
    out.push({ t: T.xs_verify(AUDIT.n_unverified_relations), s: T.xs_verify_sub });
  return out;
}

/* exec voice: open reviews ride a chip beside the kicker — trust stays
   visible without the file mechanics ever reaching this page */
function execFigChip() {
  const mN = AUDIT.n_mismatched_relations, uN = AUDIT.n_unverified_relations;
  if (!mN && !uN) return "";
  const txt = mN ? T.xh_chip(mN, compact(AUDIT.total_abs_delta)) : T.xh_chip_unv(uN);
  return SHARE || PAGE !== "exec"
    ? `<span class="figchip ${mN ? "crit" : ""}">${txt}</span>`
    : `<a class="figchip ${mN ? "crit" : ""}" id="figchip">${txt}</a>`;
}
function attachFigChip() {
  const el = $("#figchip");
  if (el) el.addEventListener("click", () => {
    PAGE = "analyst"; TAB = "workbench";
    rerender(renderAll); window.scrollTo(0, 0);
  });
}

/* exec voice: the lede speaks in projected revenue, margin and investment —
   computed from the model; never sheets, rows or cells */
function execLede() {
  const lastOf = a => { for (let i = a.length - 1; i >= 0; i--)
    if (a[i] != null) return [a[i], i]; return [null, -1]; };
  const parts = [];
  const m = REPORT.model;
  if (m && Object.keys(m.metrics || {}).length) {
    const rev = m.metrics.revenue;
    if (rev) {
      const fi = rev.values.findIndex(v => v != null);
      const [lv, li] = lastOf(rev.values);
      // direction is read from the data — never assert growth on a decline
      if (fi >= 0 && li > fi)
        parts.push(T.xl_rev(esc(titleCase(String(rev.label).slice(0, 34))),
          lv >= rev.values[fi],
          compact(rev.values[fi]), esc(String(m.periods[fi])),
          compact(lv), esc(String(m.periods[li]))));
    }
    const mp = m.derived.margin_pct && lastOf(m.derived.margin_pct);
    if (mp && mp[0] != null)
      parts.push(T.xl_margin(pctFmt(mp[0]), esc(String(m.periods[mp[1]]))));
    if (m.metrics.capex) {
      const v = m.metrics.capex.values;
      const pk = v.indexOf(Math.max(...v.filter(x => x != null)));
      if (pk >= 0) parts.push(T.xl_capex(
        compact(v.reduce((t, x) => t + (x ?? 0), 0)),
        esc(String(m.periods[pk]))));
    }
  }
  if (!parts.length) {
    // no model: the longest real timeseries carries the story
    const ts = visCharts().filter(c => !c.pseudo && c.chart.kind === "timeseries")
      .sort((a, b) => b.chart.periods.length - a.chart.periods.length)[0];
    if (ts && ts.lines.length) {
      const l = ts.lines[0];
      const pts = l.values.map((v, i) => [v, i]).filter(([v]) => v != null);
      if (pts.length >= 2) {
        const [vL, iL] = pts[pts.length - 1], [vP] = pts[pts.length - 2];
        const p = pct(vL, vP);
        if (p != null) parts.push(T.xl_trend(
          esc(titleCase(String(l.label).slice(0, 34))), p >= 0,
          pctFmt(Math.abs(p)), esc(String(ts.chart.periods[iL]))));
      }
    }
  }
  if (!parts.length) {
    // nothing to narrate but the figures' own reliability — and unverified
    // totals are unconfirmed, NOT contradicted; keep them distinct
    const mN = AUDIT.n_mismatched_relations;
    if (mN) parts.push(T.xl_review(mN, compact(AUDIT.total_abs_delta)));
    else if (AUDIT.n_unverified_relations)
      parts.push(T.xl_unv(AUDIT.n_unverified_relations));
    else if (AUDIT.n_verified_relations)
      parts.push(T.xl_ok(AUDIT.n_verified_relations));
  }
  return parts.join(" ");
}

/* exec voice: one headline policy, shared by all three exec bodies — growth
   verdict leads; contradictions and unverified totals are distinct and ride
   the fig-chip, never conflated. growthPct is a signed % or null. */
function execHead(growthPct, label) {
  if (growthPct != null)
    return T.bh_trend(titleCase(String(label).slice(0, 44)),
      growthPct >= 0, pctFmt(Math.abs(growthPct)));
  if (AUDIT.n_mismatched_relations)
    return T.xh_head_review(AUDIT.n_mismatched_relations);
  if (AUDIT.n_unverified_relations)
    return T.xh_head_verify(AUDIT.n_unverified_relations);
  return T.xh_head_ok;
}

function storyChartExec(c) {
  const [lo, hi] = chartRange(c);
  const legend = c.lines.length > 1
    ? `<div class="legend">${c.lines.map((s, k) =>
        `<span class="lg2" style="color:${k === 0 ? "var(--ink-2)" : "var(--ink-3)"}">— ${esc(s.label.slice(0, 28))}</span>`).join("")}</div>` : "";
  const cap = execCapline(c);
  return `<div class="storyblock" data-sheet="${esc(c.sheet)}">
    <div class="card-head"><span class="stt">${esc(titleCase(c.sheet))}</span>
      <span class="cs">${esc(String(c.chart.periods[lo]))} — ${esc(String(c.chart.periods[hi]))}</span></div>
    <div class="plot">${svgTimeseries(c)}</div>${legend}
    ${cap ? `<p class="chcap" style="max-width:54ch">${cap}</p>` : ""}
  </div>`;
}

function execCapline(c) {
  const s = c.lines.filter(l => l.on)[0];
  if (!s) return "";
  const vals = s.values;
  let pk = -1, last = -1;
  vals.forEach((v, i) => { if (v != null) { if (pk < 0 || v > vals[pk]) pk = i; last = i; } });
  if (pk < 0 || pk === last) return "";
  return T.cap_line(esc(s.label.slice(0, 30)), compact(vals[pk]),
    esc(String(c.chart.periods[pk])), compact(vals[last]),
    esc(String(c.chart.periods[last])));
}

function renderAnalystOverview() {
  const vis = visCharts().filter(c => !c.pseudo);
  const tss = vis.filter(c => c.chart.kind === "timeseries")
    .sort((x, y) => y.chart.periods.length - x.chart.periods.length);
  const primary = tss[0];
  const sparks = tss.slice(1, 4).map(sparkCard).filter(Boolean).join("");
  const left = (primary ? chartCard(primary, true)
      : `<div class="card"><div class="muted" style="padding:40px 0;text-align:center">${T.no_ts}</div></div>`) +
    (sparks ? `<div class="sparkrow">${sparks}</div>` : "") +
    renderInsights();
  return `<div class="an-grid"><div>${left}</div><div>${auditMini()}${profileMini()}</div></div>`;
}

function sparkCard(c) {
  const s = c.lines && c.lines[0];
  if (!s) return "";
  const vals = [], per = [];
  s.values.forEach((v, i) => { if (v != null) { vals.push(v); per.push(c.chart.periods[i]); } });
  if (vals.length < 2) return "";
  const mx = Math.max(...vals), iMax = vals.indexOf(mx);
  const med = [...vals].sort((a, b) => a - b)[Math.floor(vals.length / 2)] || 1;
  let cap;
  if (med > 0 && mx > 5 * med)
    cap = `${T.sp_spike} ${compact(mx)} · ${esc(String(per[iMax]).slice(0, 10))}`;
  else if (vals[vals.length - 1] > vals[0] * 1.15)
    cap = `${compact(vals[vals.length - 1])} · ${T.sp_rising}`;
  else if (vals[vals.length - 1] < vals[0] * .85)
    cap = `${compact(vals[vals.length - 1])} · ${T.sp_falling}`;
  else cap = `${T.sp_peak} ${compact(mx)} · ${esc(String(per[iMax]).slice(0, 10))}`;
  return `<div class="card spark clicky bar-row" data-sheet="${esc(c.sheet)}" style="display:block">
    <div class="sl2">${esc(c.sheet.trim().slice(0, 26))}</div>
    ${svgSpark(s.values)}
    <div class="sc2">${cap}</div></div>`;
}

function svgSpark(values) {
  let mn = Infinity, mx = -Infinity;
  values.forEach(v => { if (v != null) { mn = Math.min(mn, v); mx = Math.max(mx, v); } });
  if (mx === mn) mx = mn + 1;
  const W2 = 220, H2 = 56, n = values.length;
  let d = "", pen = false;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    const x = 3 + (W2 - 6) * (n === 1 ? .5 : i / (n - 1));
    const y = 5 + (H2 - 10) * (1 - (v - mn) / (mx - mn));
    d += `${pen ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`; pen = true;
  });
  return `<svg viewBox="0 0 ${W2} ${H2}" style="width:100%;height:auto;display:block">
    <path d="${d}" fill="none" stroke="#a8821f" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function auditMini() {
  const a = AUDIT;
  const rows = [];
  for (const f of a.findings.slice(0, 3))
    rows.push(`<div class="arow clicky bar-row" data-sheet="${esc(f.sheet)}" style="display:grid">
      <span class="ast bad">✕ ${T.sb_fail}</span>
      <span class="areln"><b>${esc(f.sheet)}</b> — ${esc(plainFormula(f))}</span>
      <span class="adelta bad">${num(f.total_abs_delta)}</span></div>`);
  if (a.n_unverified_relations)
    rows.push(`<div class="arow"><span class="ast warn">? ${T.sb_unv}</span>
      <span class="areln">${T.ex_unv(a.n_unverified_relations)}</span>
      <span class="adelta">—</span></div>`);
  if (a.n_verified_relations)
    rows.push(`<div class="arow"><span class="ast good">✓ ${T.sb_ok}</span>
      <span class="areln">${T.ov_ok_sub(a.n_verified_relations)}</span>
      <span class="adelta good">0</span></div>`);
  if (!rows.length) return "";
  const nRel = a.n_verified_relations + a.n_mismatched_relations + a.n_unverified_relations;
  return `<div class="card"><div class="card-head"><span class="ct">${T.ov_audit_t}</span>
      <span class="grow"></span><span class="cs">${T.ov_relations(nRel)}</span></div>
    ${rows.join("")}</div>`;
}

function profileMini() {
  const worst = [];
  for (const { sheet, eda } of collectEda()) {
    for (const [col, info] of Object.entries(eda.missingness || {})) {
      const pct = info.pct ?? 0;
      // unnamed col_N columns are extraction artifacts, not data quality news
      if (pct >= 25 && !/^col_\d+$/.test(col)) worst.push({ sheet, col, pct });
    }
  }
  if (!worst.length) return "";
  worst.sort((a, b) => b.pct - a.pct);
  const top = worst.slice(0, 4);
  const rows = top.map(w => `<div class="prow2">
      <span class="pl2">${esc(String(w.col).slice(0, 18))}</span>
      <span class="pp2" style="color:${w.pct >= 60 ? "var(--critical)" : "var(--warning)"}">${w.pct.toFixed(1)}%</span>
      <span class="ptrack"><span style="width:${Math.min(100, w.pct)}%;background:${w.pct >= 60 ? "var(--critical)" : "#c2a960"}"></span></span>
    </div>`).join("");
  return `<div class="card"><div class="card-head"><span class="ct">${T.ov_profile_t}</span></div>
    ${rows}<div class="rfoot">${T.ov_missing} · ${esc(top[0].sheet.trim().slice(0, 24))}</div></div>`;
}

/* ---------- executive mode: verdict, plain language, actions, report ----- */
function safeFixes(f) {
  return f.fix_confidence === "high"
    ? f.mismatches.filter(m => m.suggest !== false) : [];
}

function kpiData() {
  const r = REPORT;
  const extracted = r.sheets.filter(s => s.orientation !== "unknown" && s.orientation !== "error").length;
  const recs = r.sheets.reduce((t, s) => {
    let n = s.tidy ? s.tidy.n_records : 0;
    for (const p of s.panels || []) n += p.tidy ? p.tidy.n_records : 0;
    return t + n;
  }, 0);
  return { extracted, recs };
}

function verdictInfo() {
  const m = AUDIT.n_mismatched_relations, u = AUDIT.n_unverified_relations;
  if (m === 0 && u === 0)
    return { label: T.v_ok, color: "var(--good)", icon: "✓" };
  if (m === 0)
    return { label: T.v_review, color: "var(--warning)", icon: "?" };
  return { label: T.v_bad, color: "var(--critical)", icon: "✕" };
}

function execSummary() {
  const { extracted, recs } = kpiData();
  const s = [T.s_read(REPORT.n_sheets, extracted, compact(recs))];

  const m = AUDIT.n_mismatched_relations;
  if (m === 0) {
    if (AUDIT.n_verified_relations > 0) s.push(T.s_allok(AUDIT.n_verified_relations));
  } else {
    s.push(T.s_disagree(m, compact(AUDIT.total_abs_delta)));
    const cells = AUDIT.findings.reduce((t, f) => t + safeFixes(f).length, 0);
    const worth = AUDIT.findings.reduce((t, f) =>
      t + safeFixes(f).reduce((u2, x) => u2 + Math.abs(x.delta), 0), 0);
    s.push(cells ? T.s_fixable(cells, compact(worth)) : T.s_owner);
  }

  const ts = visCharts().filter(c => c.chart.kind === "timeseries")
    .sort((a, b) => b.chart.periods.length - a.chart.periods.length)[0];
  if (ts && ts.lines.length) {
    const l = ts.lines[0];
    const pts = l.values.map((v, i) => [v, i]).filter(([v]) => v != null);
    if (pts.length >= 2) {
      const [vL, iL] = pts[pts.length - 1], [vP] = pts[pts.length - 2];
      const p = pct(vL, vP);
      if (p != null) s.push(T.s_move(esc(l.label), esc(ts.sheet), p >= 0,
        Math.abs(p).toFixed(0), esc(String(ts.chart.periods[iL]))));
    }
  }
  return s.join(" ");
}

function renderVerdict() {
  const v = verdictInfo();
  return `<div class="verdict" style="--vcolor:${v.color}">
    <span class="vic">${v.icon}</span>
    <div><span class="vlabel">${v.label}</span><p>${execSummary()}</p></div>
  </div>`;
}

function attachNarrative() {
  const b = $("#gen-narr");
  if (!b) return;
  b.addEventListener("click", async () => {
    b.disabled = true; b.textContent = T.narr_writing;
    const resp = await fetch(`/analyses/${current}/narrative?lang=${LANG}`, { method: "POST" });
    if (resp.ok) {
      REPORT.narrative = await resp.json();
      renderAll();
    } else {
      const detail = (await resp.json().catch(() => ({}))).detail || T.narr_failed;
      b.disabled = false; b.textContent = T.narr_write;
      const e = $("#narr-err");
      if (e) e.textContent = detail;

function plainFormula(f) {
  if (f.status === "unverified" && f.kind === "column_sum")
    return T.f_unv(esc(f.target || ""));
  if (f.kind === "product")
    return T.f_product(esc(f.target), esc(f.inputs[0]), esc(f.inputs[1]));
  if (f.kind === "row_sum")
    return T.f_rowsum(esc(f.target), esc(f.inputs[0]), esc(f.inputs[f.inputs.length - 1]));
  if (f.kind === "column_sum") {
    const row = f.mismatches[0] ? f.mismatches[0].row : "";
    return T.f_colsum(row);
  }
  return esc(f.formula);
}

function renderActionList() {
  const rows = [];
  let i = 0;
  for (const f of AUDIT.findings) {
    i++;
    const safe = safeFixes(f);
    let action;
    if (safe.length) {
      action = `<b>${T.a_fixnow}</b> ` + safe.slice(0, 3).map(m =>
        T.a_change(esc(m.cell || T.row_w + " " + m.row), num(m.actual), num(m.expected))).join("; ")
        + (safe.length > 3 ? T.a_more(safe.length - 3) : "") + ".";
    } else {
      const rws = [...new Set(f.mismatches.map(m => m.row))].slice(0, 4);
      action = `<b>${T.a_owner}</b> ${T.a_rows(rws.join(", "), rws.length > 1)}`;
    }
    rows.push(`<div class="acrow">
      <span class="n">${i}</span>
      <div><b>${esc(f.sheet)}</b> <span class="vbadge crit">${T.st_mismatch}</span>
        <div class="aw">${T.a_in(plainFormula(f))} ${T.a_off(f.n_mismatched, f.n_checked)}</div>
        <div class="ad">→ ${action}</div></div>
      <div class="stake"><div class="v">${compact(f.total_abs_delta)}</div>
        <div class="l">${T.ac_stake}</div></div>
    </div>`);
  }
  if (AUDIT.n_unverified_relations) {
    i++;
    rows.push(`<div class="acrow">
      <span class="n">${i}</span>
      <div><b>${T.a_eyeball}</b> <span class="vbadge warn">${T.st_unverified}</span>
        <div class="aw">${T.a_unv(AUDIT.n_unverified_relations)}</div>
        <div class="ad">${T.a_manual}</div></div>
      <div class="stake"><div class="v" style="color:var(--ink-3)">—</div></div>
    </div>`);
  }
  const pass = AUDIT.n_verified_relations
    ? `<p class="acpass">✓ <b>${T.ac_pass_n(AUDIT.n_verified_relations)}</b> — ${T.ac_pass_txt}</p>` : "";
  return `<h1 class="vhead" style="margin-top:2px">${T.ac_head(AUDIT.findings.length)}</h1>
    <p class="vlede" style="margin-bottom:6px">${AUDIT.findings.length ? T.ac_sub : T.a_none_txt}</p>
    ${rows.length ? `<div style="border-top:1px solid var(--border-strong);margin-top:20px">${rows.join("")}</div>` : ""}
    ${pass}`;
}

function printReport() {
  const v = verdictInfo();
  const { extracted, recs } = kpiData();
  // charts are built from data, not the DOM — only the active tab is mounted
  const charts = [];
  const m = REPORT.model;
  if (m) {
    const lines = Object.entries(m.metrics).map(([role, s], k) => ({
      label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 26)}`,
      values: s.values, color: SERIES_COLORS[k % SERIES_COLORS.length], on: true,
    }));
    charts.push({ title: `Financial trajectory (${m.source_sheet.trim()})`,
      svg: svgTimeseries({ chart: { kind: "timeseries", periods: m.periods }, lines, range: null }) });
  }
  const real = CHARTS.filter(c => !c.pseudo);
  const ranked = real.filter(c => c.chart.kind === "timeseries")
    .sort((a, b) => b.chart.periods.length - a.chart.periods.length)
    .concat(real.filter(c => c.chart.kind === "profile"));
  for (const c of ranked) {
    if (charts.length >= 2) break;
    if (charts.some(x => x.title === c.sheet)) continue;
    charts.push({ title: c.sheet,
      svg: c.chart.kind === "timeseries" ? svgTimeseries(c) : svgProfile(c) });
  }

  let finKpis = "";
  if (m) {
    const sum = a => a.reduce((t, x) => t + (x ?? 0), 0);
    const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
    const bits = [];
    if (m.metrics.revenue) bits.push(`<div class="pkpi"><div class="l">${T.p_rev}</div><div class="v">${compact(sum(m.metrics.revenue.values))}</div></div>`);
    const mp = m.derived.margin_pct && last(m.derived.margin_pct);
    if (mp != null) bits.push(`<div class="pkpi"><div class="l">${T.p_margin}</div><div class="v">${mp.toFixed(0)}%</div></div>`);
    if (m.metrics.capex) bits.push(`<div class="pkpi"><div class="l">${T.p_capex}</div><div class="v">${compact(sum(m.metrics.capex.values))}</div></div>`);
    const vr = m.derived.volume_ratio && last(m.derived.volume_ratio);
    if (vr != null) bits.push(`<div class="pkpi"><div class="l">${T.p_conv}</div><div class="v">${(vr * 100).toFixed(1)}%</div></div>`);
    if (bits.length) finKpis = `<h2>${T.p_fin}</h2><div class="pkpis">${bits.join("")}</div>`;
  }
  const date = new Date().toISOString().slice(0, 10);

  $("#printdoc").innerHTML = `
    <div class="ph">
      <h1>LUMNIA</h1>
      <div class="pmeta">${esc(REPORT.filename)}<br>${date}</div>
    </div>
    <div class="pverdict" style="color:${v.color}">${v.icon} ${v.label}</div>
    <p style="max-width:80ch">${execSummary()}</p>
    ${REPORT.narrative ? `<h2>${esc(REPORT.narrative.headline)}</h2>
      <p style="max-width:80ch">${REPORT.narrative.narrative.split(/\n+/).filter(p => p.trim()).map(esc).join("<br><br>")}</p>` : ""}
    <h2>${T.p_key}</h2>
    <div class="pkpis">
      <div class="pkpi"><div class="l">${T.t_discrepancy}</div><div class="v">${compact(AUDIT.total_abs_delta)}</div></div>
      <div class="pkpi"><div class="l">${T.p_issues}</div><div class="v">${AUDIT.n_mismatched_relations}</div></div>
      <div class="pkpi"><div class="l">${T.p_checks}</div><div class="v">${AUDIT.n_verified_relations}</div></div>
      <div class="pkpi"><div class="l">${T.p_sheets}</div><div class="v">${extracted}/${REPORT.n_sheets}</div></div>
      <div class="pkpi"><div class="l">${T.p_records}</div><div class="v">${compact(recs)}</div></div>
    </div>

      `<div><div style="font-weight:650;font-size:12px;margin-bottom:4px">${esc(c.title)}</div>${c.svg}</div>`).join("")}</div>` : ""}
    <h2>${T.p_todo}</h2>
    ${AUDIT.findings.map(f => {
      const safe = safeFixes(f);
      const act = safe.length
        ? T.p_fix + safe.slice(0, 3).map(m => `${m.cell || T.row_w + " " + m.row}: ${num(m.actual)} → ${num(m.expected)}`).join("; ")
        : T.p_owner([...new Set(f.mismatches.map(m => m.row))].slice(0, 4).join(", "));
      return `<div class="pact"><b>${esc(f.sheet)}</b> — ${plainFormula(f)}
        ${T.p_rowsoff(f.n_mismatched, f.n_checked, compact(f.total_abs_delta))}.
        <i>${esc(act)}</i></div>`;
    }).join("") || `<div class="pact">${T.p_allok}</div>`}
    <div class="pfoot">${T.p_foot(date)}</div>`;
  window.print();
}

/* ---------- storytelling: brief intake -> plan approval -> dashboard ----- */
let CADENCE = "monthly";

function mlabel(m) {
  const fr = LANG === "fr", id = m.id;
  if (id === "headline") return `Total ${m.measure}`;
  if (id === "trend") return m.grain === "year"
    ? (fr ? "Évolution annuelle" : "Yearly trend")
    : (fr ? "Évolution mensuelle" : "Monthly trend");
  if (id === "mom") return fr ? "vs mois précédent" : "vs previous month";
  if (id === "yoy") return fr ? "vs année précédente" : "vs a year earlier";
  if (id === "movers") return (fr ? "Meilleurs & pires — " : "Best & worst — ") + m.grain;
  if (id === "low_stock") return (fr ? "Stock le plus bas — " : "Lowest stock — ") + m.grain;
  if (id.startsWith("by_")) return `${m.measure} ${fr ? "par" : "by"} ${m.grain}`;
  if (id.startsWith("avg_")) return `${fr ? "Moyenne" : "Average"} ${m.measure} ${fr ? "par" : "by"} ${m.grain}`;
  return id;
}

function renderStory() {
  const plan = REPORT.plan;
  if (!plan) return renderBriefWizard();
  if (!plan.approved) return renderPlanApproval();
  return renderStoryDash();
}

/* Metric ids are qualified s{story}:{id} — a question may be answered by
   any sheet's story, not just the workbook's spine. */
function storyMetricMap() {
  const map = {};
  (REPORT.stories || (REPORT.story ? [REPORT.story] : [])).forEach((st, si) => {
    (st.metrics || []).forEach(m => {
      map[`s${si}:${m.id}`] = { ...m, _sid: si, _sheet: (st.sheet || "").trim() };
    });
  });
  return map;
}

/* Step 6: titles become the story — each card's title is a sentence that
   walks the reader through the page. */
function storySentence(m) {
  const id = m.id;
  if (id === "headline") return T.sn_headline(m.measure);
  if (id === "trend") return m.grain === "year" ? T.sn_trend_y : T.sn_trend;
  if (id === "movers") return T.sn_movers(m.grain);
  if (id === "low_stock") return T.sn_stock(m.measure);
  if (id.startsWith("by_")) return T.sn_by(m.measure, m.grain);
  if (id.startsWith("avg_")) return T.sn_avg(m.measure, m.grain);
  return mlabel(m);
}

/* Step 6: key takeaways — one-liners computed from the page's own figures. */
function storyTakeaways(metricById, approved) {
  const sel = approved.map(k => metricById[k]).filter(Boolean);
  const first = id => sel.find(m => m.id === id);
  const out = [];
  const t = first("trend");
  if (t && t.rows.length >= 2) {
    const a = t.rows.find(r => r.value != null), b = [...t.rows].reverse().find(r => r.value != null);
    if (a && b && a !== b && a.value) {
      const p = (b.value / a.value - 1) * 100;
      out.push(T.tk_trend(t.measure, p >= 0, pctFmt(Math.abs(p)), a.period, b.period));
    }
  }
  const by = sel.find(m => m.id && m.id.startsWith("by_")
    && m.rows && m.rows.length >= 2);
  if (by) {
    const total = by.rows.reduce((s, r) => s + Math.abs(r.value ?? 0), 0);
    const top = by.rows[0];
    const share = total > 0 ? Math.abs(top.value ?? 0) / total : 0;
    // concentration is only a takeaway when it exists (declutter rule)
    if (share >= 0.15) {
      out.push(T.tk_conc(top.member, pctFmt(share * 100),
        by.measure, by.grain));
    }
  }
  const mv = first("movers");
  if (mv && mv.top.length && mv.bottom.length && mv.bottom[0].value < 0) {
    out.push(T.tk_movers(mv.top[0].entity, "+" + num(mv.top[0].value),
      mv.bottom[0].entity, num(mv.bottom[0].value)));
  }
  const ls = first("low_stock");
  if (ls && ls.rows.length) {
    out.push(T.tk_stock(ls.rows[0].entity, ls.measure, num(ls.rows[0].value)));
  }
  return out;
}

/* Step 6: recommendations — every one carries its because-clause, tracing
   back to a figure that is on this page. Rules, not imagination. */
function storyRecs(metricById, approved) {
  const sel = approved.map(k => metricById[k]).filter(Boolean);
  const first = id => sel.find(m => m.id === id);
  const recs = [];
  const mv = first("movers");
  if (mv && mv.top.length && mv.top[0].value > 0) {
    const r = mv.top[0];
    recs.push({ text: T.rc_top(r.entity, "+" + num(r.value)),
                because: T.rc_top_b(r.entity, "+" + num(r.value), mv.measure) });
  }
  if (mv && mv.bottom.length && mv.bottom[0].value < 0) {
    const r = mv.bottom[0];
    recs.push({ text: T.rc_bottom(r.entity),
                because: T.rc_bottom_b(r.entity, num(r.value), mv.measure) });
  }
  const ls = first("low_stock");
  if (ls && ls.rows.length) {
    const r = ls.rows[0];
    recs.push({ text: T.rc_stock(r.entity),
                because: T.rc_stock_b(r.entity, ls.measure, num(r.value)) });
  }
  const mom = first("mom");
  if (mom && mom.pct != null && mom.pct <= -10) {
    recs.push({ text: T.rc_mom(), because: T.rc_mom_b(pctFmt(Math.abs(mom.pct), 1)) });
  }
  if (AUDIT && AUDIT.n_mismatched_relations > 0) {
    recs.push({ text: T.rc_audit(AUDIT.n_mismatched_relations),
                because: T.rc_audit_b(compact(AUDIT.total_abs_delta)) });
  }
  return recs.slice(0, 4);
}

/* stepper: 1 BRIEF — 2 PLAN — 3 DASHBOARD */
function stepper(active) {
  const steps = [T.sp_brief, T.sp_plan, T.sp_dash];
  return `<div class="stepper">${steps.map((s, i) => {
    const st = i < active ? "done" : i === active ? "on" : "";
    return `${i ? `<span class="ln"></span>` : ""}<span class="sp ${st}">
      <span class="c">${i < active ? "✓" : i + 1}</span>${s}</span>`;
  }).join("")}</div>`;
}

function renderPlanApproval() {

/* Step 4: color is language — signed values get red/green ONLY when the
   move is significant relative to the biggest one; the rest stay gray. */
const GRAY_BAR = "#b9b19f";
function semanticColors(vals) {
  const mx = Math.max(...vals.map(v => Math.abs(v ?? 0)), 1e-9);
  return vals.map(v => v == null ? GRAY_BAR
    : Math.abs(v) < 0.35 * mx ? GRAY_BAR
    : v >= 0 ? "var(--good)" : "var(--critical)");
}
const fillFor = (v, mx) => v == null || mx === 0 ? "transparent"
  : `color-mix(in srgb, ${v >= 0 ? "#1baf7a" : "#d24a35"} ${Math.min(85, Math.abs(v) / mx * 55 + 8).toFixed(0)}%, transparent)`;

function storyChartCard(m, opts = {}) {
  const c = { pseudo: true, sheet: storySentence(m),
    loc: opts.loc || (m._sid ? m._sheet : null),
    chart: opts.kindTime
      ? { kind: "timeseries", periods: m.rows.map(r => r.period),
          series: [], other: null, truncated: !!m.truncated }
      : { kind: "profile", x: m.rows.map(r => r.member),
          y: m.rows.map(r => r.value ?? 0), colors: opts.colors },
    i: CHARTS.length, range: null };
  if (opts.kindTime) c.lines = [{ label: m.measure,
    values: m.rows.map(r => r.value), color: SERIES_COLORS[0], on: true }];
  CHARTS.push(c);
  return chartCard(c, false);
}

/* Step 3: the decision table — what each metric renders as. */
function storyVisual(m) {
  const id = m.id;
  if (id === "trend")
    return storyChartCard(m, { kindTime: true, loc: esc(m.measure) });
  if (id === "movers") return moversDiverging(m);
  if (id === "low_stock")
    return `<div class="card"><div class="card-head"><span class="ct">${esc(storySentence(m))}</span>
        <span class="cs">${esc(m.measure)}${m._sid ? " · " + esc(m._sheet) : ""}</span></div>
      <table class="mtable" style="margin-top:8px">${m.rows.map(r =>
        `<tr><td>${esc(String(r.entity).slice(0, 34))}</td>
         <td class="num" style="color:var(--warning)">${num(r.value)}</td></tr>`).join("")}</table></div>`;
  if (id.startsWith("by_") || id.startsWith("avg_")) {
    const vals = m.rows.map(r => r.value);
    const signed = vals.some(v => v != null && v < 0);
    if (m.rows.length > 12 || (signed && m.rows.length > 8)) {
      // many members read better as a ranked table with conditional fill
      const mx = Math.max(...vals.map(v => Math.abs(v ?? 0)), 1e-9);
      return `<div class="card"><div class="card-head"><span class="ct">${esc(storySentence(m))}</span></div>
        <table class="mtable" style="margin-top:8px">${m.rows.map(r =>
          `<tr><td>${esc(String(r.member).slice(0, 34))}</td>
           <td class="num" style="background:${signed ? fillFor(r.value, mx) : "transparent"}">${num(r.value)}</td></tr>`).join("")}</table></div>`;
    }
    // signed change bars speak in semantic color; magnitude bars stay neutral
    return storyChartCard(m, { colors: signed ? semanticColors(vals) : undefined });
  }
  return "";
}

/* movers as diverging bars: zero axis centered, gains right in muted green,
   losses left in reds — intensity follows magnitude (spec §10) */
function moversDiverging(m) {
  const seen = new Set(), all = [];
  for (const r of (m.top || []).concat(m.bottom || [])) {
    if (r.value == null || seen.has(r.entity)) continue;
    seen.add(r.entity); all.push(r);
  }
  all.sort((a, b) => (b.value ?? 0) - (a.value ?? 0));
  if (!all.length) return "";
  const mx = Math.max(...all.map(r => Math.abs(r.value ?? 0)), 1e-9);
  const GAIN = ["#5e7d54", "#7d9673", "#a3b199"], LOSS = ["#b03a2e", "#c07f72", "#c99a90"];
  const shade = a => a >= .66 ? 0 : a >= .33 ? 1 : 2;
  const rows = all.slice(0, 8).map((r, i) => {
    const v = r.value, w = Math.abs(v) / mx * 49;
    const col = (v >= 0 ? GAIN : LOSS)[shade(Math.abs(v) / mx)];
    const bar = v >= 0
      ? `<span class="dbar" style="left:50%;width:${w.toFixed(1)}%;background:${col}"></span>`
      : `<span class="dbar" style="right:50%;width:${w.toFixed(1)}%;background:${col}"></span>`;
    const big = i === 0 || i === all.length - 1;
    return `<div class="dvrow ${big ? "big" : ""}">
      <span class="dl">${esc(String(r.entity).slice(0, 24))}</span>
      <span class="dd" style="color:${v >= 0 ? "var(--good-series)" : "var(--critical)"}">${v >= 0 ? "+" : "−"}${num(Math.abs(v))}</span>
      <span class="dwrap">${bar}</span>
      <span class="dv2">${r.headline != null ? compact(r.headline) : ""}</span>
    </div>`;
  }).join("");
  return `<div class="card"><div class="card-head"><span class="ct">${esc(storySentence(m))}</span>
      <span class="cs">${m._sid ? esc(m._sheet) : ""}</span></div>
    <div style="margin-top:8px">${rows}</div>
    <div class="rfoot">${T.dv_foot(esc(m.measure.replace(/^Δ\s*/, "").slice(0, 30)))}</div></div>`;
}

/* Step 5: a shared-axis pair — amount and its change on one member axis. */
function pairCard(mAmt, mChg) {
  const chg = {}; mChg.rows.forEach(r => { chg[r.member] = r.value; });
  const mxA = Math.max(...mAmt.rows.map(r => Math.abs(r.value ?? 0)), 1e-9);
  const mxC = Math.max(...mChg.rows.map(r => Math.abs(chg[r.member] ?? 0)), 1e-9);
  const cols = semanticColors(mAmt.rows.map(r => chg[r.member]));
  const rows = mAmt.rows.map((r, i) => {
    const cv = chg[r.member];
    return `<div class="prow">
      <span class="pl">${esc(String(r.member).slice(0, 22))}</span>
      <span class="pbar"><span style="width:${Math.max(3, Math.abs(r.value ?? 0) / mxA * 100)}%;background:var(--gold)"></span></span>
      <span class="pv">${compact(r.value)}</span>
      <span class="pbar pc"><span style="width:${cv == null ? 0 : Math.max(3, Math.abs(cv) / mxC * 100)}%;background:${cols[i]}"></span></span>
      <span class="pv" style="color:${cols[i] === GRAY_BAR ? "var(--ink-3)" : cols[i]}">${cv == null ? "—" : (cv >= 0 ? "+" : "") + num(cv)}</span>
    </div>`;
  }).join("");
  return `<div class="card"><div class="card-head">
      <span class="ct">${esc(T.sn_pair(mAmt.measure, mAmt.grain))}</span>
      <span class="cs">${esc(mChg.measure)}</span></div>
    <div style="margin-top:10px">${rows}</div></div>`;
}

/* the trend metric as a bare executive chart (annotated, gradient) */
function trendExecChart(m) {
  const c = { pseudo: true, sheet: m.measure,
    chart: { kind: "timeseries", periods: m.rows.map(r => r.period), series: [] },
    lines: [{ label: m.measure, values: m.rows.map(r => r.value),
      color: SERIES_COLORS[0], on: true }],
    i: CHARTS.length, range: null };
  CHARTS.push(c);
  return storyChartExec(c);
}

/* ---------- the rebuilt Executive page: the model IS the dashboard ------ */
function execBlock(title, sub, inner, cap) {
  return `<div class="storyblock">
    <div class="card-head"><span class="stt">${title}</span>
      ${sub ? `<span class="cs">${sub}</span>` : ""}</div>
    <div class="plot">${inner}</div>
    ${cap ? `<p class="chcap" style="max-width:54ch">${cap}</p>` : ""}
  </div>`;
}
function execBars(title, sub, x, y, cap) {
  const c = { pseudo: true, i: CHARTS.length, range: null,
    chart: { kind: "profile", x, y: y.map(v => v ?? 0) } };
  CHARTS.push(c);
  return execBlock(title, sub, svgProfile(c), cap);
}
function execLines(title, sub, periods, lines, cap) {
  const c = { pseudo: true, i: CHARTS.length, range: null, lines,
    chart: { kind: "timeseries", periods, series: [], other: null, truncated: false } };
  CHARTS.push(c);
  const legend = lines.length > 1 ? `<div class="legend">${lines.map(l =>
    `<span class="lg"><span class="sw" style="background:${l.color}"></span>${esc(l.label.slice(0, 28))}</span>`).join("")}</div>` : "";
  return execBlock(title, sub, svgTimeseries(c) + legend, cap);
}

function renderExecDashboard() {
  const m = REPORT.model, met = m.metrics, D = m.derived;
  const plan = REPORT.plan, brief = REPORT.brief || {};
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const lastOf = a => { for (let i = a.length - 1; i >= 0; i--)
    if (a[i] != null) return [a[i], i]; return [null, -1]; };

  // ---- headline: the business verdict leads; open reviews ride the chip --
  const rev = met.revenue;
  let growth = null, ga = null, gb = null;
  if (rev) {
    const fi = rev.values.findIndex(v => v != null);
    const [lv, li] = lastOf(rev.values);
    if (fi >= 0 && li > fi && rev.values[fi]) {
      growth = (lv / rev.values[fi] - 1) * 100;
      ga = m.periods[fi]; gb = m.periods[li];
    }
  }
  const head = execHead(growth, rev && rev.label);

  // ---- KPI strip: the four strongest facts the model holds --------------
  const cells = [];
  if (rev) cells.push(`<div class="kcell"><div class="kl">${T.xd_rev}</div>
    <div class="kv">${compact(sum(rev.values))}</div>
    <div class="ks">${growth != null
      ? `${T.xd_growth(pctFmt(Math.abs(growth)))} · ${T.xd_over(esc(String(ga)), esc(String(gb)))}`
      : esc(rev.label.slice(0, 30))}</div></div>`);
  const mp = D.margin_pct && lastOf(D.margin_pct);
  if (mp && mp[0] != null)
    cells.push(`<div class="kcell"><div class="kl">${T.der_margin_pct}</div>
      <div class="kv">${mp[0].toFixed(0)}%</div>
      <div class="ks">${esc(String(m.periods[mp[1]]))}</div></div>`);
  if (met.capex) {
    const v = met.capex.values;
    const pk = v.indexOf(Math.max(...v.filter(x => x != null)));
    cells.push(`<div class="kcell"><div class="kl">${T.xd_capex}</div>
      <div class="kv">${compact(sum(v))}</div>
      <div class="ks">${pk >= 0 ? T.xd_capex_peak(esc(String(m.periods[pk]))) : ""}</div></div>`);
  }
  const cuOut = D.opex_per_volume_out;
  const cu = (cuOut || D.opex_per_volume) && lastOf(cuOut || D.opex_per_volume);
  if (cu && cu[0] != null) {
    const cuVol = cuOut ? met.volume_secondary : met.volume;
    cells.push(`<div class="kcell"><div class="kl">${cuOut ? T.der_opex_per_volume_out : T.der_opex_per_volume}</div>
      <div class="kv">${compact(cu[0])}</div>
      <div class="ks">${esc(String(m.periods[cu[1]]))} · ${esc(cuVol.label.slice(0, 22))}</div></div>`);
  } else if (met.opex) {
    const [ov, oi] = lastOf(met.opex.values);
    if (ov != null) cells.push(`<div class="kcell"><div class="kl">${T.xd_opex(esc(String(m.periods[oi])))}</div>
      <div class="kv">${compact(ov)}</div>
      <div class="ks">${esc(met.opex.label.slice(0, 30))}</div></div>`);
  }
  const bv = D.opex_budget_variance_pct && lastOf(D.opex_budget_variance_pct);
  if (bv && bv[0] != null)
    cells.push(`<div class="kcell ${bv[0] > 0 ? "crit" : ""}"><div class="kl">${T.der_opex_budget_variance_pct}</div>
      <div class="kv">${bv[0] >= 0 ? "+" : "−"}${Math.abs(bv[0]).toFixed(1)}%</div>
      <div class="ks">${esc(String(m.periods[bv[1]]))} · ${bv[0] > 0 ? T.fin_over : T.fin_under}</div></div>`);
  if (met.area && cells.length < 4) {
    const v = met.area.values;
    const pk = v.indexOf(Math.max(...v.filter(x => x != null)));
    if (pk >= 0) cells.push(`<div class="kcell"><div class="kl">${T.xd_peak(esc(met.area.label.slice(0, 20)))}</div>
      <div class="kv">${esc(String(m.periods[pk]))}</div>
      <div class="ks">${compact(v[pk])}</div></div>`);
  }
  cells.length = Math.min(cells.length, 4);

  // ---- charts: everything the model can draw, nothing it can't ----------
  const blocks = [];
  if (rev) blocks.push(trendExecChart({ measure: rev.label,
    rows: m.periods.map((p, i) => ({ period: p, value: rev.values[i] })) }));
  const ramp = met.area || (rev ? met.volume : null);
  if (ramp) blocks.push(execBars(esc(titleCase(T.xd_ramp(ramp.label.slice(0, 26)))),
    T.xd_ramp_sub, m.periods, ramp.values));
  if (met.capex && rev) blocks.push(execLines(T.xd_cvr, T.xd_cvr_sub, m.periods, [
    { label: `${ROLE_LABELS.revenue} — ${rev.label.slice(0, 22)}`,
      values: rev.values, color: SERIES_COLORS[0], on: true },
    { label: `${ROLE_LABELS.capex} — ${met.capex.label.slice(0, 22)}`,
      values: met.capex.values, color: SERIES_COLORS[2], on: true },
  ]));
  if (D.margin_pct && D.margin_pct.some(v => v != null))
    blocks.push(execBars(T.xd_margin_t, T.xd_margin_sub, m.periods,
      D.margin_pct.map(v => v != null ? +v.toFixed(1) : null)));
  if (!rev && met.volume)          // volume-only books still get their story
    blocks.push(execLines(esc(titleCase(met.volume.label.slice(0, 30))), null,
      m.periods, [{ label: met.volume.label, values: met.volume.values,
                    color: SERIES_COLORS[0], on: true }]));
  if (m.monthly) {
    const mo = m.monthly;
    const lines = Object.entries(mo.metrics).map(([role, s], k) => ({
      label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 22)}`,
      values: s.values, color: SERIES_COLORS[k % SERIES_COLORS.length], on: true }));
    if (lines.length) blocks.push(execLines(T.xd_monthly,
      null, mo.periods, lines));   // no source-sheet name on the exec page
  }
  const rows = [];
  for (let i = 0; i < blocks.length; i += 2)   // a lone block keeps its lane
    rows.push(`<div class="grid2" style="margin-top:${i ? 26 : 0}px">${blocks[i]}${blocks[i + 1] || "<div></div>"}</div>`);

  // ---- next steps + honest gaps, from the audit and the brief ------------
  let recs = [];
  if (plan && plan.approved) {
    const metricById = storyMetricMap();
    recs = storyRecs(metricById, plan.approved.filter(id => metricById[id]))
      .map(r => ({ t: r.text, s: r.because }));
  }
  if (!recs.length) recs = execStepsBiz().map(s => ({ t: s.t, s: s.s }));
  const stepRows = recs.length
    ? recs.map((r, i) => `<div class="step"><span class="n">${i + 1}</span>
        <div><b>${esc(r.t)}</b><p>${esc(r.s)}</p></div></div>`).join("")
    : `<div class="step"><span class="n" style="color:var(--good)">✓</span>
        <div><p>${T.nx_none}</p></div></div>`;
  const misses = plan && plan.approved
    ? plan.questions.filter(q => q.status === "unanswerable"
        || q.status === "unmatched" || (q.status === "partial" && q.missing.length))
    : [];
  const gaps = misses.length ? `<div style="margin-top:24px"><span class="kicker">${T.xh_gaps_t}</span>
      ${misses.map(q => `<p class="chcap" style="max-width:46ch"><b>${esc(q.question)}</b> —
        ${T.xh_status[q.status]}${q.missing[0] ? ` · ${T.st_needs(esc(q.missing[0].requires))}` : ""}</p>`).join("")}</div>` : "";

  const cad = T.st_cadences[brief.cadence]
    ? T.st_cadences[brief.cadence].toLowerCase() : brief.cadence;
  // period coverage as the kicker suffix — never the source sheet
  const range = `${esc(String(m.periods[0]))} — ${esc(String(m.periods[m.periods.length - 1]))}`;
  const kick = brief.role
    ? `${esc(T.st_brief_line(brief.role, cad))} · ${range}` : range;
  return `<section id="sec-story">
    <span class="kicker">${kick}</span>
    <h1 class="vhead">${esc(head)}</h1>
    <p class="vlede">${execLede()}</p>
    ${cells.length ? `<div class="kstrip">${cells.join("")}</div>` : ""}
    ${rows.join("")}
    <div class="execgrid" style="margin-top:30px">
      <div>${gaps}</div>
      <div><span class="kicker">${T.nx_kicker}</span>${stepRows}</div>
    </div>
  </section>`;
}

function renderStoryDashExec(metricById, approved) {
  const plan = REPORT.plan, brief = REPORT.brief || {};
  const sel = approved.map(k => metricById[k]).filter(Boolean);
  const first = id => sel.find(m => m.id === id);
  const mv = first("movers");
  const by = sel.find(m => m.id && m.id.startsWith("by_") && m.rows && m.rows.length >= 2);

  // no trend in the approved plan? the model's financial trajectory (when
  // the workbook has one) carries the page — the brief may anchor on a
  // line-item sheet while the RECAP projections hold the real story
  let trend = first("trend");
  if (!trend && REPORT.model && (REPORT.model.periods || []).length >= 3) {
    const met = REPORT.model.metrics;
    const src = met.revenue || met.volume;
    if (src) trend = { id: "trend", measure: src.label, grain: "year",
      rows: REPORT.model.periods.map((p, i) =>
        ({ period: p, value: src.values[i] })) };
  }

  let changePct = null, pa = null, pb = null;
  if (trend && trend.rows.length >= 2) {
    const a = trend.rows.find(r => r.value != null);
    const b = [...trend.rows].reverse().find(r => r.value != null);
    if (a && b && a !== b && a.value) {
      changePct = (b.value / a.value - 1) * 100;
      pa = a.period; pb = b.period;
    }
  }
  // exec voice: the business verdict leads; open reviews ride the fig-chip
  const head = execHead(changePct, trend && trend.measure);

  const cells = [];
  if (changePct != null)
    cells.push(`<div class="kcell ${changePct < 0 ? "crit" : ""}"><div class="kl">${T.bk_change}</div>
      <div class="kv">${changePct >= 0 ? "+" : "−"}${pctFmt(Math.abs(changePct))}</div>
      <div class="ks">${esc(String(pa))} → ${esc(String(pb))}</div></div>`);
  // derived business KPIs — only what the model actually computed
  const mdl = REPORT.model;
  if (mdl) {
    const lastOf = a => { for (let i = a.length - 1; i >= 0; i--)
      if (a[i] != null) return [a[i], i]; return [null, -1]; };
    const mp2 = mdl.derived.margin_pct && lastOf(mdl.derived.margin_pct);
    if (mp2 && mp2[0] != null)
      cells.push(`<div class="kcell"><div class="kl">${T.der_margin_pct}</div>
        <div class="kv">${mp2[0].toFixed(0)}%</div>
        <div class="ks">${esc(String(mdl.periods[mp2[1]]))}</div></div>`);
    // the output-side unit cost (OPEX/T of product) is the industry lens
    const cuOut = mdl.derived.opex_per_volume_out;
    const cu = (cuOut || mdl.derived.opex_per_volume)
      && lastOf(cuOut || mdl.derived.opex_per_volume);
    const cuVol = cuOut ? mdl.metrics.volume_secondary : mdl.metrics.volume;
    if (cu && cu[0] != null)
      cells.push(`<div class="kcell"><div class="kl">${cuOut ? T.der_opex_per_volume_out : T.der_opex_per_volume}</div>
        <div class="kv">${compact(cu[0])}</div>
        <div class="ks">${esc(String(mdl.periods[cu[1]]))} · ${esc(cuVol.label.slice(0, 22))}</div></div>`);
    const bv2 = mdl.derived.opex_budget_variance_pct && lastOf(mdl.derived.opex_budget_variance_pct);
    if (bv2 && bv2[0] != null)
      cells.push(`<div class="kcell ${bv2[0] > 0 ? "crit" : ""}"><div class="kl">${T.der_opex_budget_variance_pct}</div>
        <div class="kv">${bv2[0] >= 0 ? "+" : "−"}${Math.abs(bv2[0]).toFixed(1)}%</div>
        <div class="ks">${esc(String(mdl.periods[bv2[1]]))} · ${bv2[0] > 0 ? T.fin_over : T.fin_under}</div></div>`);
  }
  if (by) {
    const total = by.rows.reduce((s, r) => s + Math.abs(r.value ?? 0), 0);
    const share = total > 0 ? Math.abs(by.rows[0].value ?? 0) / total : 0;
    // significance gate: a 6% "largest share" across 30 members says
    // nothing — the cell earns its place only when concentration is real
    if (share >= 0.15) cells.push(`<div class="kcell"><div class="kl">${T.bk_share}</div>
      <div class="kv">${pctFmt(share * 100)}</div>
      <div class="ks">${esc(String(by.rows[0].member).slice(0, 26))}, ${T.bk_of_total(esc(by.grain))}</div></div>`);
  }
  if (mv && mv.top.length && mv.top[0].value > 0)
    cells.push(`<div class="kcell"><div class="kl">${T.bk_gain}</div>
      <div class="kv">+${compact(mv.top[0].value)}</div>
      <div class="ks">${esc(String(mv.top[0].entity).slice(0, 26))}</div></div>`);
  if (mv && mv.bottom.length && mv.bottom[0].value < 0)
    cells.push(`<div class="kcell crit"><div class="kl">${T.bk_drop}</div>
      <div class="kv">−${compact(Math.abs(mv.bottom[0].value))}</div>
      <div class="ks">${esc(String(mv.bottom[0].entity).slice(0, 26))}</div></div>`);
  cells.length = Math.min(cells.length, 4);   // four tiles, like the strip was designed for
  const strip = cells.length ? `<div class="kstrip">${cells.join("")}</div>` : "";

  const recs = storyRecs(metricById, approved);
  const steps = recs.length ? recs.map((r, i) => `<div class="step"><span class="n">${i + 1}</span>
      <div><b>${esc(r.text)}</b><p>${esc(r.because)}</p></div></div>`).join("") : "";
  const misses = plan.questions.filter(q => q.status === "unanswerable"
    || q.status === "unmatched" || (q.status === "partial" && q.missing.length));
  const gaps = misses.length ? `<div style="margin-top:30px"><span class="kicker">${T.xh_gaps_t}</span>
      ${misses.map(q => `<p class="chcap" style="max-width:46ch"><b>${esc(q.question)}</b> —
        ${T.xh_status[q.status]}${q.missing[0] ? ` · ${T.st_needs(esc(q.missing[0].requires))}` : ""}</p>`).join("")}</div>` : "";

  const cad = T.st_cadences[brief.cadence]
    ? T.st_cadences[brief.cadence].toLowerCase() : brief.cadence;
  // no trend -> the top breakdown carries the visual as true-baseline columns
  const chartHtml = trend ? trendExecChart(trend)
    : by ? storyVisual(by) : "";
  const stepsHtml = steps
    ? `<span class="kicker">${T.rc_title}</span>${steps}`
    : `<span class="kicker">${T.rc_title}</span>
       <div class="step"><span class="n" style="color:var(--good)">✓</span>
         <div><p>${T.nx_none}</p></div></div>`;
  return `<section id="sec-story">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <span class="kicker">${esc(T.st_brief_line(brief.role, cad))}</span>
      ${(SHARE || PAGE === "exec") ? "" : `<span style="flex:1"></span><button class="iconbtn" id="bf-edit">${T.st_edit}</button>
        <button class="iconbtn" id="plan-reopen">${T.st_replan}</button>`}
    </div>
    <h1 class="vhead">${esc(head)}</h1>
    ${strip}
    <div class="execgrid">
      <div>${chartHtml}
        ${mv ? `<div style="margin-top:26px">${moversDiverging(mv)}</div>` : ""}</div>
      <div>${stepsHtml}${gaps}</div>
    </div>
  </section>`;
}

function renderStoryDash() {
  const story = REPORT.story, plan = REPORT.plan, brief = REPORT.brief || {};
  const metricById = storyMetricMap();
  const approved = plan.approved.filter(id => metricById[id]);
  if (MODE === "exec") return renderStoryDashExec(metricById, approved);
  const done = new Set();

  // Step 5a: the headline absorbs its own deltas (MoM/YoY beside the number)
  let hero = "";
  const headKey = approved.find(k => metricById[k].id === "headline");
  if (headKey) {
    const h = metricById[headKey];
    const kds = approved.filter(k => {
