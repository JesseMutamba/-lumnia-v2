<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumnia — light where there was none</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9992a'/%3E%3C/svg%3E">
<style>
  :root {
    --surface: #f4f0e8;
    --card: #fbf9f3;
    --panel: #faf7ef;
    --border: #e4dcc9;
    --hairline: #ece5d5;
    --ink: #201d17;
    --ink-2: #5c564a;
    --ink-3: #99917e;
    --gold: #a8821f;
    --gold-strong: #c9992a;
    --gold-tint: #f3ead2;
    --good: #0ca30c;
    --good-track: #ddeedd;
    --warning: #8a6100;
    --critical: #d03b3b;
    --crit-track: #f3dcd6;
    --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(70,58,25,.05), 0 6px 22px rgba(70,58,25,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.5 var(--sans); }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-3); }

  /* ============ layout: sidebar + main ============ */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside.side { display: none; } }

  aside.side { border-right: 1px solid var(--hairline); background: var(--panel);
    padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
  .brand h1 { font-family: var(--serif); font-size: 19px; font-weight: 500;
    letter-spacing: .12em; margin: 0; }
  .side .kicker { display: block; margin: 18px 8px 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 550;
    font-size: 13px; margin-bottom: 2px; border: 1px solid transparent; }
  .nav-item:hover { background: var(--card); }
  .nav-item.active { background: var(--gold-tint); color: var(--gold);
    border-color: #e8d9ad; }
  .nav-item svg { flex: none; }
  .nav-item .cnt { margin-left: auto; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); }
  .nav-item.active .cnt { color: var(--gold); }
  .wb { padding: 7px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .wb:hover { background: var(--card); }
  .wb .name { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
  .wb.active .name { color: var(--gold); }
  .wb .meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    display: flex; justify-content: space-between; align-items: center; }
  .wb button { border: none; background: none; color: var(--ink-3); cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 3px; visibility: hidden; }
  .wb:hover button { visibility: visible; }
  .wb button:hover { color: var(--critical); }
  #newupload { color: var(--gold); }

  main { padding: 26px 32px 80px; min-width: 0; }

  /* ============ topbar ============ */
  .topbar { display: flex; align-items: baseline; gap: 16px; padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 18px; flex-wrap: wrap; }
  .topbar h2 { font-family: var(--serif); font-size: 26px; font-weight: 500; margin: 0;
    letter-spacing: .02em; overflow-wrap: anywhere; }
  .topbar .sub { color: var(--ink-3); font-family: var(--mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; }
  .topbar .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-2); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  #status { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    letter-spacing: .04em; min-height: 18px; margin: 0 0 10px; }
  #status.err { color: var(--critical); }

  /* ============ filter pills ============ */
  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; position: relative; }
  .pill { position: relative; }
  .pill > button { display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 16px; font: 13px var(--sans); color: var(--ink-2); box-shadow: var(--shadow); }
  .pill > button b { color: var(--ink); font-weight: 650; }
  .pill > button .car { color: var(--ink-3); font-size: 10px; }
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 230px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 34px rgba(70,58,25,.14); padding: 8px; display: none; }
  .pill.open .pop { display: block; }
  .pop .search { display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 6px; }
  .pop .search input { border: none; outline: none; background: transparent;
    font: 13px var(--sans); color: var(--ink); width: 100%; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; cursor: pointer;
    border-radius: 7px; font-size: 13px; }
  .opt:hover { background: var(--gold-tint); }
  .opt .radio { width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .radio { border-color: var(--gold); background: radial-gradient(circle at center, var(--gold) 0 4.5px, transparent 5px); }
  .opt .box { width: 13px; height: 13px; border-radius: 4px; flex: none;
    border: 1.5px solid var(--ink-3); }
  .opt.sel .box { border-color: var(--gold); background: var(--gold); }
  .pop .clear { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); cursor: pointer; padding: 7px 9px 3px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold-tint);
    color: var(--gold); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }

  /* ============ overview ============ */
  .overview { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(380px, 7fr);
    gap: 16px; align-items: stretch; }
  @media (max-width: 1100px) { .overview { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow); }
  .tile .label { font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3); }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 6px; line-height: 1.1; }
  .tile .value .den { font-size: 15px; color: var(--ink-3); font-weight: 500; }
  .tile .value .ico { font-size: 15px; vertical-align: 3px; margin-right: 6px; }

  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 16px 20px; box-shadow: var(--shadow); margin-bottom: 14px; position: relative; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head .ct { font-weight: 650; font-size: 14px; }
  .card-head .cs { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; text-transform: uppercase; }
  .card-head .grow { flex: 1; }
  .iconbtn { border: none; background: none; cursor: pointer; color: var(--ink-3);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 4px; }
  .iconbtn:hover { color: var(--gold); }

  section > .kicker { display: block; margin: 30px 0 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .chart-card svg { display: block; width: 100%; height: auto; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--ink-2); cursor: pointer; padding: 2px 0; user-select: none; }
  .lg .sw { width: 10px; height: 10px; border-radius: 3px; }
  .lg.off { opacity: .32; }
  .hint { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
  .tooltip { position: absolute; pointer-events: none; background: #fffdf8;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    font-size: 12px; display: none; z-index: 40; min-width: 150px;
    box-shadow: 0 4px 16px rgba(70,58,25,.13); }
  .tooltip .tp { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .06em; margin-bottom: 4px; }
  .tooltip .tv { display: flex; justify-content: space-between; gap: 16px;
    font-variant-numeric: tabular-nums; }
  .tooltip .tv .lab { display: inline-flex; align-items: center; gap: 5px; }

  /* progress-bar panels (audit highlights) */
  .bar-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px;
    padding: 10px 0; border-bottom: 1px solid var(--hairline); align-items: center; }
  .bar-row:last-child { border-bottom: none; }
  .bar-row .bl { font-weight: 600; font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bv { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    white-space: nowrap; }
  .track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--hairline); }
  .track .fill { height: 100%; border-radius: 999px; }
  .bar-row.clicky { cursor: pointer; }
  .bar-row.clicky:hover .bl { color: var(--gold); }

  /* leaderboard */
  .lead-row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--hairline); }
  .lead-row:last-child { border-bottom: none; }
  .lead-row .rank { font-family: var(--serif); font-size: 17px; color: var(--ink-3);
    width: 22px; text-align: center; flex: none; }
  .lead-row .nm { font-weight: 600; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead-row .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .lead-row .val { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 650; white-space: nowrap; }

  /* audit table + sheets */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-weight: 500; color: var(--ink-3);
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr.frow { cursor: pointer; }
  tr.frow:hover td { background: #f6f1e4; }
  .st { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .st.ok { color: var(--good); } .st.mismatch { color: var(--critical); }
  .st.unverified { color: var(--warning); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.tidy { color: #48628f; border-color: #c4cfe0; }
  .badge.matrix { color: #6d5590; border-color: #d4c9e2; }
  .badge.multi { color: #3e7466; border-color: #bcd6cd; }
  .badge.form { color: var(--gold); border-color: #ddc98f; }
  .badge.unknown { color: var(--ink-3); }
  .sheet-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sheet-head .nm { font-weight: 650; font-size: 14px; }
  .sheet-head .dims { color: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  .reason { color: var(--ink-2); font-size: 12.5px; margin: 7px 0 0; }
  details { margin-top: 9px; }
  summary { cursor: pointer; color: var(--gold); font-size: 12.5px; }
  .preview-wrap { overflow-x: auto; margin-top: 10px; }
  .preview-wrap table { font-size: 12px; }
  .preview-wrap th, .preview-wrap td { padding: 4px 9px; white-space: nowrap;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .panel-blk { border-left: 2px solid var(--border); padding-left: 14px; margin-top: 12px; }
  .muted { color: var(--ink-3); }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: #f3e8cd; } 100% { background: var(--card); } }

  /* executive mode */
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; }
  .modes button { border: none; background: var(--card); color: var(--ink-3);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .modes button.on { background: var(--gold-tint); color: var(--gold); }
  .verdict { display: flex; gap: 16px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 18px 22px; box-shadow: var(--shadow); margin-bottom: 16px;
    border-left: 4px solid var(--vcolor, var(--ink-3)); }
  .verdict .vic { font-size: 26px; line-height: 1; color: var(--vcolor); }
  .verdict .vlabel { font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--vcolor); font-weight: 600; }
  .verdict p { margin: 6px 0 0; font-size: 14px; line-height: 1.65; max-width: 75ch; }
  .action-card { background: var(--card); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 15px 19px; box-shadow: var(--shadow);
    margin-bottom: 12px; border-left: 4px solid var(--acolor, var(--border)); }
  .action-card .ahead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .action-card .asheet { font-weight: 650; }
  .action-card .aval { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 650; color: var(--critical); }
  .action-card .awhat { color: var(--ink-2); font-size: 13px; margin-top: 5px;
    line-height: 1.55; }
  .action-card .ado { margin-top: 8px; font-size: 13px; line-height: 1.5; }
  .action-card .ado b { color: var(--gold); }

  /* scenario & simulation */
  .scen-grid { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; }
  @media (max-width: 900px) { .scen-grid { grid-template-columns: 1fr; } }
  .sl { margin-bottom: 13px; }
  .sl .slh { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .sl .sln { color: var(--ink-2); font-size: 12px; }
  .sl .slv { font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: var(--gold); }
  .sl input[type=range] { width: 100%; accent-color: var(--gold-strong);
    height: 4px; cursor: pointer; }
  .preset { border: none; border-radius: 7px; padding: 5px 12px; font-size: 11px;
    font-weight: 600; cursor: pointer; margin: 0 6px 6px 0; }
  .scard { background: var(--card); border: 1px solid var(--hairline);
    border-top: 3px solid var(--scolor, var(--border)); border-radius: 12px;
    padding: 13px 16px; box-shadow: var(--shadow); }
  .scard .sn { font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); }
  .scard .sv { font-size: 19px; font-weight: 700; color: var(--scolor);
    font-variant-numeric: tabular-nums; margin: 4px 0 1px; }
  .scard .ss { font-size: 10.5px; color: var(--ink-3); }
  .runbtn { width: 100%; margin-top: 12px; background: var(--gold); color: #fff;
    border: none; border-radius: 8px; padding: 10px 0; font-family: var(--mono);
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer; }
  .runbtn:hover { background: var(--gold-strong); }
  .prob-row { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .prob-row:last-child { border-bottom: none; }
  .prob-row .pv { font-family: var(--mono); font-weight: 700; }

  /* print report */
  #printdoc { display: none; }
  @media print {
    .app { display: none !important; }
    #printdoc { display: block; }
    body { background: #fff; }
  }
  #printdoc { font: 13px/1.55 var(--sans); color: #1a1a19; }
  #printdoc .ph { display: flex; align-items: center; gap: 14px;
    border-bottom: 1.5px solid #1a1a19; padding-bottom: 14px; margin-bottom: 18px; }
  #printdoc h1 { font-family: var(--serif); font-size: 24px; font-weight: 500;
    letter-spacing: .12em; margin: 0; }
  #printdoc .pmeta { margin-left: auto; text-align: right; font-family: var(--mono);
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #777; }
  #printdoc h2 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: #999; font-weight: 600; margin: 22px 0 8px; }
  #printdoc .pverdict { font-family: var(--mono); font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 700; }
  #printdoc .pkpis { display: flex; gap: 26px; flex-wrap: wrap; margin: 10px 0; }
  #printdoc .pkpi .l { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; color: #999; }
  #printdoc .pkpi .v { font-size: 21px; font-weight: 650; }
  #printdoc .pcharts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #printdoc .pcharts svg { width: 100%; height: auto; }
  #printdoc .pact { padding: 8px 0; border-bottom: 1px solid #e8e8e8; }
  #printdoc .pfoot { margin-top: 26px; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: #999;
    border-top: 1px solid #e8e8e8; padding-top: 10px; }

  /* empty / drop */
  #drop { border: 1px dashed var(--border); border-radius: 14px; padding: 60px 30px;
    text-align: center; color: var(--ink-2); cursor: pointer; background: var(--card);
    transition: border-color .2s; }
  #drop:hover, #drop.hover { border-color: var(--gold-strong); }
  #drop .big { font-family: var(--serif); font-size: 19px; color: var(--ink); }
  #drop .hint2 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 10px; }
  .dropring { outline: 2px dashed var(--gold-strong); outline-offset: -6px; }
</style>
</head>
<body>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.xlsb,.ods,.csv,.tsv,.txt" style="display:none">
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg id="sun" width="34" height="34" viewBox="-50 -50 100 100" aria-hidden="true"></svg>
      <h1>LUMNIA</h1>
    </div>
    <div id="nav-analysis"></div>
    <span class="kicker">Workbooks</span>
    <div id="wb-list"></div>
    <div class="nav-item" id="newupload">
      <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New upload
    </div>
  </aside>
  <main>
    <div id="topbar"></div>
    <div id="status"></div>
    <div id="content"></div>
  </main>
</div>
<div id="printdoc"></div>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const num = v => typeof v === "number" ? nf.format(v) : (v ?? "");
const compact = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return (v / 1e3).toFixed(1) + "K";
  return nf.format(v);
};

/* ---------- state ---------- */
let current = null, REPORT = null, AUDIT = null, CHARTS = [];
let SHEET_IDX = {};
const FILTER = { sheets: null, status: null, periods: "all" };  // sheets: Set|null
// Executive mode: decisions in sentences. Analyst mode: the full machinery.
let MODE = localStorage.getItem("lumnia_mode") || "exec";

/* ---------- brand sun ---------- */
(function drawSun() {
  let dots = `<circle cx="0" cy="0" r="7.5" fill="#c9992a"/>`;
  for (let ring = 1; ring <= 8; ring++) {
    const R = 9 + ring * 4.6, n = 10 + ring * 6;
    const r = Math.max(.5, 2.1 - ring * .18), o = Math.max(.28, 1 - ring * .09);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 2 * Math.PI + ring * .35;
      dots += `<circle cx="${(R*Math.cos(a)).toFixed(1)}" cy="${(R*Math.sin(a)).toFixed(1)}" r="${r}" fill="#c9992a" opacity="${o.toFixed(2)}"/>`;
    }
  }
  $("#sun").innerHTML = dots;
})();

/* ---------- upload ---------- */
const fileInput = $("#file"), statusEl = $("#status");
$("#newupload").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropring"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropring"); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dropring");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});

async function upload(file) {
  setStatus(`Analyzing ${file.name}…`);
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/analyze", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    setStatus("");
    await loadWorkbooks();
    select(body.id);
  } catch (err) { setStatus("Analysis failed: " + err.message, true); }
  fileInput.value = "";
}
function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = isErr ? "err" : ""; }

/* ---------- sidebar: workbooks + analysis nav ---------- */
async function loadWorkbooks() {
  const items = await (await fetch("/analyses")).json();
  $("#wb-list").innerHTML = items.length ? items.map(i => `
    <div class="wb ${i.id === current ? "active" : ""}" data-id="${esc(i.id)}">
      <div class="name">${esc(i.filename)}</div>
      <div class="meta"><span>${i.n_sheets} sheets · ${(i.size_bytes/1024).toFixed(0)} KB</span>
        <span><button data-act="rerun">rerun</button><button data-act="del">del</button></span></div>
    </div>`).join("") : `<div class="muted" style="font-size:12px;padding:0 10px">Nothing yet.</div>`;
  $$("#wb-list .wb").forEach(el => el.addEventListener("click", async e => {
    const act = e.target.dataset && e.target.dataset.act, id = el.dataset.id;
    if (act === "del") { e.stopPropagation();
      await fetch(`/analyses/${id}`, { method: "DELETE" });
      if (current === id) { current = null; REPORT = null; renderEmpty(); }
      loadWorkbooks();
    } else if (act === "rerun") { e.stopPropagation();
      const prev = (current === id && AUDIT) ? AUDIT.total_abs_delta : null;
      setStatus("Re-analyzing…");
      await fetch(`/analyses/${id}/rerun`, { method: "POST" });
      await select(id);
      if (prev != null) {
        const d = prev - AUDIT.total_abs_delta;
        setStatus(d > 0.01
          ? `✓ Resolved ${compact(d)} of discrepancy (${compact(prev)} → ${compact(AUDIT.total_abs_delta)})`
          : `Discrepancy unchanged (${compact(AUDIT.total_abs_delta)}) — fix the suggested cells in the file, save, and re-upload`);
      } else setStatus("");
    } else select(id);
  }));
}

  ["sheets", "Sheets", `<svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.6" y="1.6" width="10.8" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.6 5.2h10.8M5.4 5.2V12.4" stroke="currentColor" stroke-width="1.2"/></svg>`],

function renderNav(counts, exec) {
  const items = NAV.filter(([id]) => !(exec && id === "sheets"))
    .map(([id, label, icon]) =>

/* ---------- select + render ---------- */
async function select(id) {
  current = id;
  loadWorkbooks();
  [REPORT, AUDIT] = await Promise.all([
    fetch(`/analyses/${id}`).then(r => r.json()),
    fetch(`/analyses/${id}/findings`).then(r => r.json()),
  ]);
  FILTER.sheets = null; FILTER.status = null; FILTER.periods = "all";
  MC_RESULTS = null; SCEN = { price: 1.0, vol: 1.0, cost: 1.0 };
  renderAll();
}

function renderEmpty() {
  $("#nav-analysis").innerHTML = "";
  $("#topbar").innerHTML = `<div class="topbar"><h2>Lumnia</h2>
    <span class="sub">Light where there was none</span></div>`;
  $("#content").innerHTML = `<div id="drop">
    <div class="big">Drop a CSV / Excel file anywhere, or click to browse</div>
    <div class="hint2">Every sheet classified &amp; extracted · totals &amp; formulas verified</div></div>`;
  $("#drop").addEventListener("click", () => fileInput.click());
}

function renderAll() {
  const r = REPORT, a = AUDIT;
  SHEET_IDX = {}; r.sheets.forEach((s, i) => { SHEET_IDX[s.name] = i; });
  CHARTS = collectCharts(r);
  const exec = MODE === "exec";

  renderNav({
    overview: null,
    charts: visCharts().length,
    audit: a.n_mismatched_relations,
    sheets: exec ? undefined : r.n_sheets,
  }, exec);
  $("#topbar").innerHTML = `<div class="topbar">
    <h2>${esc(r.filename)}</h2>
    <span class="sub">${r.n_sheets} sheets analyzed</span>
    <span class="grow"></span>
    <span class="modes">
      <button data-mode="exec" class="${exec ? "on" : ""}">Executive</button>
      <button data-mode="analyst" class="${exec ? "" : "on"}">Analyst</button>
    </span>
    <button class="btn" id="print-report">⎙&nbsp; Report</button>
    <button class="btn" id="dl-corrections">⤓&nbsp; Corrections CSV</button>
    ${exec ? "" : `<button class="btn" id="dl-findings">⤓&nbsp; Findings CSV</button>`}
  </div>`;
  $$(".modes button").forEach(b => b.addEventListener("click", () => {
    MODE = b.dataset.mode; localStorage.setItem("lumnia_mode", MODE); renderAll();
  }));
  $("#print-report").addEventListener("click", printReport);
  $("#dl-corrections").addEventListener("click", downloadCorrections);
  const dlf = $("#dl-findings");
  if (dlf) dlf.addEventListener("click", downloadFindings);

  if (exec) {
    $("#content").innerHTML =
      `<section id="sec-overview">${renderVerdict()}${renderOverview()}${renderInsights()}</section>` +
      renderFinancials() + renderScenario() + renderMC() +
      `<section id="sec-charts"><span class="kicker">Trends</span>${renderChartGrid()}</section>` +
      `<section id="sec-audit"><span class="kicker">What to do</span>${renderActionList()}</section>`;
  } else {
    $("#content").innerHTML =
      renderFilters() +
      `<section id="sec-overview">${renderVerdict()}${renderOverview()}${renderInsights()}</section>` +
      renderFinancials() + renderScenario() + renderMC() +
      `<section id="sec-charts"><span class="kicker">Charts</span>${renderChartGrid()}</section>` +
      `<section id="sec-audit"><span class="kicker">Audit</span>${renderHighlights()}${renderLeaderboards()}${renderFindingsTable()}</section>` +
      `<section id="sec-sheets"><span class="kicker">Sheets (${r.n_sheets})</span>${renderSheets()}</section>`;
  }

  attachFilters(); attachCharts(); attachFindingRows(); attachBarRows();
  attachScenario(); attachMC();
}

/* ---------- filters ---------- */
function sheetVisible(name) { return !FILTER.sheets || FILTER.sheets.has(name); }
function visCharts() { return CHARTS.filter(c => sheetVisible(c.sheet)); }

function renderFilters() {
  const sheets = [...new Set(CHARTS.map(c => c.sheet).concat(REPORT.sheets.map(s => s.name)))];
  const selN = FILTER.sheets ? FILTER.sheets.size : 0;
  const periodLabels = { all: "All", p30: "Last 30", p90: "Last 90" };
  const statusLabels = { mismatch: "Mismatched", ok: "Verified", unverified: "Unverified" };
  return `<div class="filters">
    <div class="pill" id="pf-periods"><button>Periods: <b>${periodLabels[FILTER.periods]}</b> <span class="car">▾</span></button>
      <div class="pop">${Object.entries(periodLabels).map(([k, l]) =>
        `<div class="opt ${FILTER.periods === k ? "sel" : ""}" data-v="${k}"><span class="radio"></span>${l} periods</div>`).join("")}
      </div></div>
    <div class="pill" id="pf-sheets"><button>Sheets: <b>${selN ? selN + " selected" : "All"}</b> <span class="car">▾</span></button>
      <div class="pop" style="min-width:280px">
        ${selN ? `<div class="fchips">${[...FILTER.sheets].map(s =>
          `<span class="fchip" data-v="${esc(s)}">${esc(s)} ✕</span>`).join("")}</div>` : ""}
        <div class="search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#99917e" stroke-width="1.4"/><path d="M8 8l2.6 2.6" stroke="#99917e" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input placeholder="Search sheets" id="sheet-search"></div>
        <div id="sheet-opts">${sheets.map(s =>
          `<div class="opt ${FILTER.sheets && FILTER.sheets.has(s) ? "sel" : ""}" data-v="${esc(s)}"><span class="box"></span>${esc(s)}</div>`).join("")}</div>
        ${selN ? `<div class="clear" id="sheets-clear">Clear</div>` : ""}
      </div></div>
    <div class="pill" id="pf-status"><button>Status: <b>${FILTER.status ? statusLabels[FILTER.status] : "All"}</b> <span class="car">▾</span></button>
      <div class="pop">
        <div class="opt ${!FILTER.status ? "sel" : ""}" data-v=""><span class="radio"></span>All</div>
        ${Object.entries(statusLabels).map(([k, l]) =>
          `<div class="opt ${FILTER.status === k ? "sel" : ""}" data-v="${k}"><span class="radio"></span>${l}</div>`).join("")}
      </div></div>
  </div>`;
}

document.addEventListener("click", e => {   // close popovers on outside click
  if (!e.target.closest(".pill")) $$(".pill").forEach(p => p.classList.remove("open"));
});

function attachFilters() {
  $$(".pill > button").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const pill = btn.parentElement, was = pill.classList.contains("open");
    $$(".pill").forEach(p => p.classList.remove("open"));
    if (!was) pill.classList.add("open");
  }));
  $$(".pop").forEach(p => p.addEventListener("click", e => e.stopPropagation()));

  $$("#pf-periods .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.periods = o.dataset.v; renderAll();
  }));
  $$("#pf-status .opt").forEach(o => o.addEventListener("click", () => {
    FILTER.status = o.dataset.v || null; renderAll();
  }));
  $$("#pf-sheets #sheet-opts .opt").forEach(o => o.addEventListener("click", () => {
    const v = o.dataset.v;
    if (!FILTER.sheets) FILTER.sheets = new Set();
    FILTER.sheets.has(v) ? FILTER.sheets.delete(v) : FILTER.sheets.add(v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  $$("#pf-sheets .fchip").forEach(ch => ch.addEventListener("click", () => {
    FILTER.sheets.delete(ch.dataset.v);
    if (!FILTER.sheets.size) FILTER.sheets = null;
    renderAll(); openPill("pf-sheets");
  }));
  const clr = $("#sheets-clear");
  if (clr) clr.addEventListener("click", () => { FILTER.sheets = null; renderAll(); openPill("pf-sheets"); });
  const search = $("#sheet-search");
  if (search) search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    $$("#sheet-opts .opt").forEach(o =>
      o.style.display = o.dataset.v.toLowerCase().includes(q) ? "" : "none");
  });
}
function openPill(id) {
  const p = document.getElementById(id);
  if (p) { p.classList.add("open"); const s = $("#sheet-search"); if (s) s.focus(); }
}

/* ---------- overview: KPIs + primary chart ---------- */
function renderOverview() {
  const r = REPORT, a = AUDIT;
  const extracted = r.sheets.filter(s => s.orientation !== "unknown").length;
  const recs = r.sheets.reduce((t, s) => {
    let n = s.tidy ? s.tidy.n_records : 0;
    for (const p of s.panels || []) n += p.tidy ? p.tidy.n_records : 0;
    return t + n;
  }, 0);
  const tiles = `
    <div class="tile"><div class="label">Total discrepancy</div>
      <div class="value">${compact(a.total_abs_delta)}</div></div>
    <div class="tile"><div class="label">Sheets extracted</div>
      <div class="value">${extracted}<span class="den">/${r.n_sheets}</span></div></div>
    <div class="tile"><div class="label">Mismatched</div>
      <div class="value"><span class="ico" style="color:var(--critical)">✕</span>${a.n_mismatched_relations}</div></div>
    <div class="tile"><div class="label">Verified</div>
      <div class="value"><span class="ico" style="color:var(--good)">✓</span>${a.n_verified_relations}</div></div>
    <div class="tile"><div class="label">Unverified totals</div>
      <div class="value"><span class="ico" style="color:var(--warning)">?</span>${a.n_unverified_relations}</div></div>
    <div class="tile"><div class="label">Records extracted</div>
      <div class="value">${compact(recs)}</div></div>`;

  const vis = visCharts().filter(c => !c.pseudo);
  const primary = vis.filter(c => c.chart.kind === "timeseries")
    .sort((x, y) => y.chart.periods.length - x.chart.periods.length)[0];
  const right = primary ? chartCard(primary, true)
    : `<div class="card"><div class="muted" style="padding:40px 0;text-align:center">No time series to plot${CHARTS.length ? "" : " — press rerun on this workbook to compute charts"}.</div></div>`;
  return `<div class="overview"><div class="kpis">${tiles}</div><div>${right}</div></div>`;
}

/* ---------- executive mode: verdict, plain language, actions, report ----- */
function safeFixes(f) {
  return f.fix_confidence === "high"
    ? f.mismatches.filter(m => m.suggest !== false) : [];
}

function kpiData() {
  const r = REPORT;
  const extracted = r.sheets.filter(s => s.orientation !== "unknown" && s.orientation !== "error").length;
  const recs = r.sheets.reduce((t, s) => {
    let n = s.tidy ? s.tidy.n_records : 0;
    for (const p of s.panels || []) n += p.tidy ? p.tidy.n_records : 0;
    return t + n;
  }, 0);
  return { extracted, recs };
}

function verdictInfo() {
  const m = AUDIT.n_mismatched_relations, u = AUDIT.n_unverified_relations;
  if (m === 0 && u === 0)
    return { label: "Consistent", color: "var(--good)", icon: "✓" };
  if (m === 0)
    return { label: "Review recommended", color: "var(--warning)", icon: "?" };
  return { label: "Needs corrections", color: "var(--critical)", icon: "✕" };
}

function execSummary() {
  const { extracted, recs } = kpiData();
  const s = [];
  s.push(`This workbook has ${REPORT.n_sheets} sheets; ${extracted} were read
    successfully (${compact(recs)} records).`);

  const m = AUDIT.n_mismatched_relations;
  if (m === 0) {
    s.push(`All ${AUDIT.n_verified_relations} automated checks passed — the
      numbers agree with each other.`);
  } else {
    s.push(`The numbers disagree with each other in <b>${m}</b> place${m === 1 ? "" : "s"},
      worth <b>${compact(AUDIT.total_abs_delta)}</b> in total.`);
    const cells = AUDIT.findings.reduce((t, f) => t + safeFixes(f).length, 0);
    const worth = AUDIT.findings.reduce((t, f) =>
      t + safeFixes(f).reduce((u2, x) => u2 + Math.abs(x.delta), 0), 0);
    if (cells) s.push(`<b>${cells}</b> of those cells can be corrected right away
      (worth ${compact(worth)}); the rest need the file's owner to check.`);
    else s.push(`They need the file's owner to check the underlying figures —
      the correct values can't be determined automatically.`);
  }

  const ts = visCharts().filter(c => c.chart.kind === "timeseries")
    .sort((a, b) => b.chart.periods.length - a.chart.periods.length)[0];
  if (ts && ts.lines.length) {
    const l = ts.lines[0];
    const pts = l.values.map((v, i) => [v, i]).filter(([v]) => v != null);
    if (pts.length >= 2) {
      const [vL, iL] = pts[pts.length - 1], [vP] = pts[pts.length - 2];
      const p = pct(vL, vP);
      if (p != null) s.push(`“${esc(l.label)}” on ${esc(ts.sheet)} is
        ${p >= 0 ? "up" : "down"} <b>${Math.abs(p).toFixed(0)}%</b> in the latest
        period (${esc(String(ts.chart.periods[iL]))}).`);
    }
  }
  return s.join(" ");
}

function renderVerdict() {
  const v = verdictInfo();
  return `<div class="verdict" style="--vcolor:${v.color}">
    <span class="vic">${v.icon}</span>
    <div><span class="vlabel">${v.label}</span><p>${execSummary()}</p></div>
  </div>`;
}

function plainFormula(f) {
  if (f.kind === "product")
    return `'${esc(f.target)}' should equal '${esc(f.inputs[0])}' × '${esc(f.inputs[1])}'`;
  if (f.kind === "row_sum")
    return `'${esc(f.target)}' should equal the sum of ${esc(f.inputs[0])} through ${esc(f.inputs[f.inputs.length - 1])}`;
  if (f.kind === "column_sum") {
    const row = f.mismatches[0] ? f.mismatches[0].row : "";
    return `the totals row${row ? " " + row : ""} should match the sum of the rows above it`;
  }
  return esc(f.formula);
}

function renderActionList() {
  const cards = [];
  for (const f of AUDIT.findings) {
    const safe = safeFixes(f);
    let action;
    if (safe.length) {
      action = `<b>Fix now:</b> ` + safe.slice(0, 3).map(m =>
        `change <b>${esc(m.cell || "row " + m.row)}</b> from ${num(m.actual)} to <b>${num(m.expected)}</b>`).join("; ")
        + (safe.length > 3 ? ` — plus ${safe.length - 3} more in the Corrections CSV` : "") + ".";
    } else {
      const rows = [...new Set(f.mismatches.map(m => m.row))].slice(0, 4);
      action = `<b>Check with the file's owner:</b> row${rows.length > 1 ? "s" : ""}
        ${rows.join(", ")} — the correct value can't be determined automatically
        (other rules contest these cells).`;
    }
    cards.push(`<div class="action-card" style="--acolor:var(--critical)">
      <div class="ahead"><span class="asheet">${esc(f.sheet)}</span>
        <span class="aval">${compact(f.total_abs_delta)}</span></div>
      <div class="awhat">In this sheet, ${plainFormula(f)} — but
        ${f.n_mismatched} of ${f.n_checked} rows don't match.</div>
      <div class="ado">→ ${action}</div>
    </div>`);
  }
  if (AUDIT.n_unverified_relations) {
    cards.push(`<div class="action-card" style="--acolor:var(--warning)">
      <div class="ahead"><span class="asheet">Totals to eyeball</span></div>
      <div class="awhat">${AUDIT.n_unverified_relations} totals row(s) couldn't be
        verified automatically — their sections have an unusual structure.</div>
      <div class="ado">→ <b>Quick manual check</b> next time the file is open.</div>
    </div>`);
  }
  if (!cards.length) {
    cards.push(`<div class="action-card" style="--acolor:var(--good)">
      <div class="ahead"><span class="asheet">Nothing to fix</span></div>
      <div class="awhat">Every automated check passed. The workbook's internal
        math is consistent.</div></div>`);
  }
  return cards.join("");
}

    title: c.querySelector(".ct") ? c.querySelector(".ct").textContent : "",

  })).filter(c => c.svg && !seen.has(c.title) && seen.add(c.title)).slice(0, 2);
  const date = new Date().toISOString().slice(0, 10);

  $("#printdoc").innerHTML = `
    <div class="ph">
      <h1>LUMNIA</h1>
      <div class="pmeta">${esc(REPORT.filename)}<br>${date}</div>
    </div>
    <div class="pverdict" style="color:${v.color}">${v.icon} ${v.label}</div>
    <p style="max-width:80ch">${execSummary()}</p>
    <h2>Key figures</h2>
    <div class="pkpis">
      <div class="pkpi"><div class="l">Total discrepancy</div><div class="v">${compact(AUDIT.total_abs_delta)}</div></div>
      <div class="pkpi"><div class="l">Issues found</div><div class="v">${AUDIT.n_mismatched_relations}</div></div>
      <div class="pkpi"><div class="l">Checks passed</div><div class="v">${AUDIT.n_verified_relations}</div></div>
      <div class="pkpi"><div class="l">Sheets read</div><div class="v">${extracted}/${REPORT.n_sheets}</div></div>
      <div class="pkpi"><div class="l">Records</div><div class="v">${compact(recs)}</div></div>
    </div>
    ${charts.length ? `<h2>Trends</h2><div class="pcharts">${charts.map(c =>
      `<div><div style="font-weight:650;font-size:12px;margin-bottom:4px">${esc(c.title)}</div>${c.svg}</div>`).join("")}</div>` : ""}
    <h2>What to do</h2>
    ${AUDIT.findings.map(f => {
      const safe = safeFixes(f);
      const act = safe.length
        ? "Fix: " + safe.slice(0, 3).map(m => `${m.cell || "row " + m.row}: ${num(m.actual)} → ${num(m.expected)}`).join("; ")
        : "Owner to verify rows " + [...new Set(f.mismatches.map(m => m.row))].slice(0, 4).join(", ");
      return `<div class="pact"><b>${esc(f.sheet)}</b> — ${plainFormula(f)}
        (${f.n_mismatched} of ${f.n_checked} rows off, ${compact(f.total_abs_delta)}).
        <i>${esc(act)}</i></div>`;
    }).join("") || `<div class="pact">✓ Every automated check passed.</div>`}
    <div class="pfoot">Generated by Lumnia · light where there was none · ${date}</div>`;
  window.print();
}

/* ---------- financials: generated from the semantic business model ------- */
const ROLE_LABELS = { revenue: "Revenue", opex: "OPEX", capex: "CAPEX",
  volume: "Volume", area: "Area" };

function renderFinancials() {
  const m = REPORT.model;
  if (!m) return "";
  const sum = a => a.reduce((t, v) => t + (v ?? 0), 0);
  const lastIdx = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };
  const met = m.metrics;

  // KPI cards — only for the roles actually found
  const tiles = [];
  if (met.revenue) {
    const v = met.revenue.values, li = lastIdx(v);
    const fi = v.findIndex(x => x != null);
    const growth = fi >= 0 && li > fi && v[fi] ? ((v[li] / v[fi] - 1) * 100) : null;
    tiles.push(`<div class="tile"><div class="label">Revenue · ${esc(m.periods[fi])}–${esc(m.periods[li])}</div>
      <div class="value">${compact(sum(v))}</div>
      ${growth != null ? `<div class="label" style="margin-top:4px;color:var(--good)">+${growth.toFixed(0)}% over the horizon</div>` : ""}</div>`);
  }
  if (met.capex) tiles.push(`<div class="tile"><div class="label">Total CAPEX</div>
      <div class="value">${compact(sum(met.capex.values))}</div></div>`);
  if (met.opex) {
    const v = met.opex.values, li = lastIdx(v);
    tiles.push(`<div class="tile"><div class="label">OPEX · ${esc(m.periods[li])}</div>
      <div class="value">${compact(v[li])}</div></div>`);
  }
  if (met.area) {
    const v = met.area.values;
    const peak = v.indexOf(Math.max(...v.filter(x => x != null)));
    tiles.push(`<div class="tile"><div class="label">Peak ${esc(met.area.label.slice(0, 18))}</div>
      <div class="value">${esc(m.periods[peak])}</div>
      <div class="label" style="margin-top:4px">${compact(v[peak])} that period</div></div>`);
  }
  const mp = m.derived.margin_pct;
  if (mp) {
    const li = lastIdx(mp);
    if (li >= 0) tiles.push(`<div class="tile"><div class="label">Margin · ${esc(m.periods[li])}</div>
      <div class="value">${mp[li].toFixed(0)}%</div></div>`);
  }

  // trajectory chart: the role series as a pseudo-timeseries (reuses hover/legend)
  const lines = Object.entries(met).map(([role, s], k) => ({
    label: `${ROLE_LABELS[role] || role} — ${s.label.slice(0, 26)}`,
    values: s.values, color: SERIES_COLORS[k % SERIES_COLORS.length], on: true,
  }));
  const traj = { pseudo: true, sheet: `Financial trajectory (${m.source_sheet.trim()})`, loc: null,
    chart: { kind: "timeseries", periods: m.periods, series: [], other: null,
             truncated: false }, lines, i: CHARTS.length, range: null };
  CHARTS.push(traj);

  let marginCard = "";
  if (mp && mp.some(v => v != null)) {
    const bars = { pseudo: true, sheet: "Operating margin %", loc: null,
      chart: { kind: "profile", x: m.periods,
               y: mp.map(v => v ?? 0) }, i: CHARTS.length, range: null };
    CHARTS.push(bars);
    marginCard = chartCard(bars, false);
  }

  // breakdown panels: top line items per sheet (tracks, like the audit bars)
  const bds = (m.breakdowns || []).slice(0, 4).map(b => {
    const mx = Math.max(1, ...b.items.map(i => Math.abs(i.value)));
    return `<div class="card"><div class="card-head">
        <span class="ct">${esc(b.sheet)}</span>
        <span class="cs">top items by ${esc(b.value_col.slice(0, 26))}</span></div>
      ${b.items.slice(0, 6).map(i => `<div class="bar-row">
        <span class="bl">${esc(i.label.slice(0, 44))}</span>
        <span class="bv">${compact(i.value)}</span>
        <div class="track"><div class="fill" style="width:${Math.max(3, Math.abs(i.value) / mx * 100)}%;background:var(--gold)"></div></div>
      </div>`).join("")}</div>`;
  }).join("");

  return `<section id="sec-financials"><span class="kicker">Financials — detected from this workbook</span>
    ${tiles.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px">${tiles.join("")}</div>` : ""}
    <div class="grid2">${chartCard(traj, false)}${marginCard}</div>
    ${bds ? `<div class="grid2" style="margin-top:14px">${bds}</div>` : ""}
  </section>`;
}

/* ---------- scenario analysis + monte carlo (generic over the model) ----- */
const SCEN_DEFS = {
  bear:   { label: "Downside", color: "#b03a2a", price: 0.7, vol: 0.85, cost: 1.2 },
  base:   { label: "Base",     color: "#a8821f", price: 1.0, vol: 1.0,  cost: 1.0 },
  bull:   { label: "Upside",   color: "#2c5f1a", price: 1.3, vol: 1.1,  cost: 0.9 },
  custom: { label: "Custom",   color: "#c8a04a" },
};
let SCEN = { price: 1.0, vol: 1.0, cost: 1.0 };
let MCP = { priceSd: 0.15, volSd: 0.10, costSd: 0.08, N: 2000 };
let MC_RESULTS = null;

function scenSeries(f) {           // apply factors to the model, per period
  const m = REPORT.model, rev = m.metrics.revenue.values;
  const opx = m.metrics.opex ? m.metrics.opex.values : null;
  return rev.map((r, i) => {
    if (r == null) return { rev: null, opex: null, margin: null };
    const r2 = r * f.price * f.vol;
    const o2 = opx && opx[i] != null ? opx[i] * f.cost : null;
    return { rev: r2, opex: o2, margin: o2 != null ? r2 - o2 : null };
  });
}
const scenTotal = rows => rows.reduce((t, r) => t + (r.rev ?? 0), 0);

function renderScenario() {
  const m = REPORT.model;
  if (!m || !m.scenario_ready) return "";
  const hasCost = !!m.metrics.opex;
  const scens = {
    bear: scenSeries(SCEN_DEFS.bear), base: scenSeries(SCEN_DEFS.base),
    bull: scenSeries(SCEN_DEFS.bull), custom: scenSeries(SCEN),
  };
  const cards = Object.entries(SCEN_DEFS).map(([k, d]) => {
    const rows = scens[k];
    const mt = rows.reduce((t, r) => t + (r.margin ?? 0), 0);
    return `<div class="scard" style="--scolor:${d.color}">
      <div class="sn">${d.label}</div>
      <div class="sv">${compact(scenTotal(rows))}</div>
      <div class="ss">total revenue over the horizon${hasCost ? ` · margin ${compact(mt)}` : ""}</div>
    </div>`;
  }).join("");

  const lines = Object.entries(SCEN_DEFS).map(([k, d]) => ({
    label: d.label, color: d.color, on: true,
    values: scens[k].map(r => r.rev),
  }));
  const chart = { pseudo: true, i: "scen", range: null, lines,
    chart: { kind: "timeseries", periods: m.periods, series: [], other: null, truncated: false } };

  const sliders = `
    ${slider("Price factor", "price", 0.5, 1.8, 0.05, SCEN.price, v => (v*100).toFixed(0)+"%")}
    ${slider("Volume factor", "vol", 0.5, 1.5, 0.05, SCEN.vol, v => (v*100).toFixed(0)+"%")}
    ${hasCost ? slider("Cost factor", "cost", 0.7, 1.5, 0.05, SCEN.cost, v => (v*100).toFixed(0)+"%") : ""}
    <div style="margin-top:10px">
      ${Object.entries(SCEN_DEFS).filter(([k]) => k !== "custom").map(([k, d]) =>
        `<button class="preset" data-preset="${k}" style="background:${d.color}22;color:${d.color}">${d.label}</button>`).join("")}
    </div>`;

  return `<section id="sec-scenario"><span class="kicker">Scenario analysis — what if</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px">${cards}</div>
    <div class="scen-grid">
      <div class="card"><div class="card-head"><span class="ct">Custom levers</span></div>
        <div style="margin-top:10px">${sliders}</div></div>
      <div class="card chart-card"><div class="card-head"><span class="ct">Revenue by scenario</span>
        <span class="cs">${esc(m.metrics.revenue.label.slice(0, 30))} · adjusted</span></div>
        <div class="plot">${svgTimeseries(chart)}</div>
        <div class="legend">${lines.map(l => `<span class="lg"><span class="sw" style="background:${l.color}"></span>${l.label}</span>`).join("")}</div>
      </div>
    </div></section>`;
}

function slider(name, key, min, max, step, val, fmt) {
  return `<div class="sl"><div class="slh"><span class="sln">${name}</span>
    <span class="slv">${fmt(val)}</span></div>
    <input type="range" data-scen="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}

function attachScenario() {
  $$('#sec-scenario input[data-scen]').forEach(inp => inp.addEventListener("input", () => {
    SCEN[inp.dataset.scen] = +inp.value;
    refreshScenario();
  }));
  $$('#sec-scenario .preset').forEach(b => b.addEventListener("click", () => {
    const d = SCEN_DEFS[b.dataset.preset];
    SCEN = { price: d.price, vol: d.vol, cost: d.cost };
    refreshScenario();
  }));
}
function refreshScenario() {
  const sec = $("#sec-scenario");
  if (!sec) return;
  sec.outerHTML = renderScenario();
  attachScenario();
}

/* monte carlo */
function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function runMC() {
  const m = REPORT.model, out = [];
  for (let i = 0; i < MCP.N; i++) {
    const f = {
      price: Math.max(0.2, 1 + gauss() * MCP.priceSd),
      vol: Math.max(0.2, 1 + gauss() * MCP.volSd),
      cost: Math.max(0.4, 1 + gauss() * MCP.costSd),
    };
    out.push(scenTotal(scenSeries(f)));
  }
  out.sort((a, b) => a - b);
  MC_RESULTS = out;
}
const pctl = (a, p) => a[Math.min(a.length - 1, Math.floor(p / 100 * a.length))];

function renderMC() {
  const m = REPORT.model;
  if (!m || !m.scenario_ready) return "";
  let body = `<div class="muted" style="padding:24px 0;text-align:center">Press run to simulate.</div>`;
  if (MC_RESULTS) {
    const r = MC_RESULTS, base = scenTotal(scenSeries(SCEN_DEFS.base));
    const p10 = pctl(r, 10), p50 = pctl(r, 50), p90 = pctl(r, 90);
    const bins = 30, mn = r[0], mx = r[r.length - 1], step = (mx - mn) / bins || 1;
    const y = Array.from({ length: bins }, () => 0);
    for (const v of r) y[Math.min(bins - 1, Math.floor((v - mn) / step))]++;
    const hist = { pseudo: true, i: "mc", range: null,
      chart: { kind: "profile", x: y.map((_, i2) => compact(mn + i2 * step)), y } };
    const probs = [0.8, 1.0, 1.2].map(f2 => {
      const t = base * f2, p = r.filter(v => v >= t).length / r.length * 100;
      return `<div class="prob-row"><span>Total revenue ≥ ${compact(t)} (${(f2*100).toFixed(0)}% of base)</span>
        <span class="pv" style="color:${p >= 70 ? "var(--good)" : p >= 40 ? "var(--gold)" : "var(--critical)"}">${p.toFixed(1)}%</span></div>`;
    }).join("");
    body = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px">
        <div class="scard" style="--scolor:#b03a2a"><div class="sn">P10 — downside</div><div class="sv">${compact(p10)}</div></div>
        <div class="scard" style="--scolor:#a8821f"><div class="sn">P50 — median</div><div class="sv">${compact(p50)}</div></div>
        <div class="scard" style="--scolor:#2c5f1a"><div class="sn">P90 — upside</div><div class="sv">${compact(p90)}</div></div>
      </div>
      <div class="grid2">
        <div class="card chart-card"><div class="card-head"><span class="ct">Distribution of total revenue</span>
          <span class="cs">${MCP.N.toLocaleString()} draws</span></div>
          <div class="plot">${svgProfile(hist)}</div></div>
        <div class="card"><div class="card-head"><span class="ct">Probability of hitting targets</span></div>${probs}</div>
      </div>`;
  }
  return `<section id="sec-mc"><span class="kicker">Monte Carlo — how sure can we be</span>
    <div class="scen-grid">
      <div class="card"><div class="card-head"><span class="ct">Uncertainty</span></div>
        <div style="margin-top:10px">
        ${mcslider("Price volatility (σ)", "priceSd", 0.02, 0.4, 0.01, MCP.priceSd)}
        ${mcslider("Volume volatility (σ)", "volSd", 0.02, 0.3, 0.01, MCP.volSd)}
        ${REPORT.model.metrics.opex ? mcslider("Cost volatility (σ)", "costSd", 0.02, 0.3, 0.01, MCP.costSd) : ""}
        ${mcslider("Simulations (N)", "N", 500, 5000, 500, MCP.N)}
        <button class="runbtn" id="mc-run">Run ${MCP.N.toLocaleString()} simulations</button>
        </div></div>
      <div id="mc-body">${body}</div>
    </div></section>`;
}
function mcslider(name, key, min, max, step, val) {
  const fmt = key === "N" ? v => (+v).toLocaleString() : v => "±" + (v * 100).toFixed(0) + "%";
  return `<div class="sl"><div class="slh"><span class="sln">${name}</span>
    <span class="slv">${fmt(val)}</span></div>
    <input type="range" data-mc="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function attachMC() {
  $$('#sec-mc input[data-mc]').forEach(inp => inp.addEventListener("input", () => {
    MCP[inp.dataset.mc] = +inp.value;
    const sec = $("#sec-mc"); sec.outerHTML = renderMC(); attachMC();
  }));
  const run = $("#mc-run");
  if (run) run.addEventListener("click", () => {
    runMC();
    const sec = $("#sec-mc"); sec.outerHTML = renderMC(); attachMC();
  });
}

/* ---------- insights: decision-support bullets from the data ---------- */
function pct(a, b) { return b ? ((a - b) / Math.abs(b) * 100) : null; }

function renderInsights() {
  const out = [];   // {html, sheet}

  // 1. corrections story: what fixing the high-confidence cells is worth
  const fixable = AUDIT.findings
    .map(f => ({ ...f, safe: f.fix_confidence === "high"
      ? f.mismatches.filter(m => m.suggest !== false) : [] }))
    .filter(f => f.safe.length);
  if (fixable.length) {
    const cells = fixable.reduce((t, f) => t + f.safe.length, 0);
    const worth = fixable.reduce((t, f) =>
      t + f.safe.reduce((u, m) => u + Math.abs(m.delta), 0), 0);
    out.push({ html: `<b>${cells} cell${cells === 1 ? "" : "s"}</b> can be corrected with high
      confidence, closing <b>${compact(worth)}</b> of the ${compact(AUDIT.total_abs_delta)}
      total discrepancy — download the Corrections CSV to work through them.` });
    const worst = fixable[0], m = worst.safe[0];
    if (m) out.push({ sheet: worst.sheet, html: `Largest single correction:
      <b>${esc(worst.sheet)}</b>${m.cell ? ` cell <b>${esc(m.cell)}</b>` : ` row ${m.row}`}
      (${esc(m.label)}) — ${num(m.actual)} should be <b>${num(m.expected)}</b>,
      per a rule verified on ${worst.n_matched} other rows.` });
  } else if (AUDIT.findings.length === 0) {
    out.push({ html: `Every discovered relation holds — this workbook's internal
      math is <b>consistent</b>. Safe to circulate on that front.` });
  }

  // 2. trend: latest movement of the biggest time series
  const ts = visCharts().filter(c => c.chart.kind === "timeseries")
    .sort((a, b) => b.chart.periods.length - a.chart.periods.length)[0];
  if (ts && ts.lines.length) {
    const s = ts.lines[0];
    const pts = s.values.map((v, i) => [v, i]).filter(([v]) => v != null);
    if (pts.length >= 2) {
      const [vLast, iLast] = pts[pts.length - 1], [vPrev] = pts[pts.length - 2];
      const p = pct(vLast, vPrev);
      out.push({ sheet: ts.sheet, html: `<b>${esc(ts.sheet)}</b> — latest
        ${esc(String(ts.chart.periods[iLast]))}: “${esc(s.label)}” at <b>${num(vLast)}</b>
        ${p != null ? `(<b style="color:${p >= 0 ? "var(--good)" : "var(--critical)"}">${p >= 0 ? "+" : ""}${p.toFixed(1)}%</b> vs previous period)` : ""}.` });
    }
  }

  // 3. seasonality: where the biggest profile peaks
  const pf = visCharts().filter(c => c.chart.kind === "profile")
    .sort((a, b) => Math.max(...b.chart.y) - Math.max(...a.chart.y))[0];
  if (pf) {
    const iMax = pf.chart.y.indexOf(Math.max(...pf.chart.y));
    out.push({ sheet: pf.sheet, html: `<b>${esc(pf.sheet)}</b> peaks at
      “${esc(String(pf.chart.x[iMax]))}” (<b>${compact(pf.chart.y[iMax])}</b>) —
      plan cash and capacity around that period.` });
  }

  // 4. server-side EDA: drivers, gaps, duplicates (computed on full data)
  const SEV = { high: "var(--critical)", medium: "var(--warning)", low: "var(--ink-3)" };
  for (const i of (REPORT.insights || []).slice(0, 3)) {
    out.push({ sheet: i.sheet, html: `<span style="color:${SEV[i.severity] || "var(--ink-3)"}">●</span>
      <b>${esc(i.sheet)}</b> — ${esc(i.message)}` });
  }

  // 5. what still needs a human
  if (AUDIT.n_unverified_relations) {
    out.push({ html: `${AUDIT.n_unverified_relations} totals row${AUDIT.n_unverified_relations === 1 ? "" : "s"}
      could not be verified automatically (hierarchical sections) — worth a manual glance.` });
  }

  if (!out.length) return "";
  return `<div class="card" style="margin-top:16px"><div class="card-head">
      <span class="ct">Insights</span><span class="cs">computed from this workbook</span></div>
    ${out.slice(0, 5).map(i => `<div class="bar-row ${i.sheet ? "clicky" : ""}"
      ${i.sheet ? `data-sheet="${esc(i.sheet)}"` : ""}>
      <span style="font-size:13px;line-height:1.55">${i.html}</span></div>`).join("")}
  </div>`;
}

/* ---------- charts ---------- */
const SERIES_COLORS = ["#2a78d6", "#1baf7a", "#eda100", "#008300", "#4a3aa7"];
const OTHER_COLOR = "#9a9284";
const W = 720, H = 250, ML = 52, MR = 14, MT = 12, MB = 30;

function collectCharts(report) {
  const out = [];
  for (const s of report.sheets) {
    const grab = (tidy, loc) => {
      const c = tidy && tidy.summary && tidy.summary.chart;
      if (c) out.push({ sheet: s.name, loc, chart: c });
    };
    grab(s.tidy, null);
    for (const p of s.panels || []) {
      grab(p.tidy, "col_start" in p && p.col_start != null
        ? `cols ${p.col_start}–${p.col_end}` : `rows ${p.row_start}–${p.row_end}`);
    }
  }
  return out.map((c, i) => {
    if (c.chart.kind === "timeseries") {
      const all = c.chart.series.concat(c.chart.other ? [c.chart.other] : []);
      c.lines = all.map((s, k) => ({
        label: s.label, values: s.values,
        color: k < c.chart.series.length ? SERIES_COLORS[k % SERIES_COLORS.length] : OTHER_COLOR,
        on: true,
      }));
    }
    c.i = i; c.range = null;                     // [lo,hi] from brush
    return c;
  });
}

function chartRange(c) {
  const n = c.chart.periods.length;
  if (c.range) return c.range;
  if (FILTER.periods === "p30" && n > 30) return [n - 30, n - 1];
  if (FILTER.periods === "p90" && n > 90) return [n - 90, n - 1];
  return [0, n - 1];
}

function renderChartGrid() {
  const vis = visCharts().filter(c => !c.pseudo);
  if (!vis.length) return `<div class="card muted">No chartable series${CHARTS.length ? " for this filter" : " in this analysis — press rerun to recompute with the current pipeline"}.</div>`;
  return `<div class="grid2">${vis.map(c => chartCard(c, false)).join("")}</div>`;
}

function chartCard(c, isPrimary) {
  let span;
  if (c.chart.kind === "timeseries") {
    const [lo, hi] = chartRange(c);
    span = `${hi - lo + 1} of ${c.chart.periods.length} periods`;
  } else {
    span = `${c.chart.x.length} columns`;
  }
  const sub = [c.loc, span,
    c.chart.truncated ? "truncated" : null].filter(Boolean).join(" · ");
  const legend = c.chart.kind === "timeseries" && c.lines.length > 1
    ? `<div class="legend">${c.lines.map((s, k) => `
        <span class="lg ${s.on ? "" : "off"}" data-chart="${c.i}" data-k="${k}">
          <span class="sw" style="background:${s.color}"></span>${esc(s.label)}</span>`).join("")}</div>` : "";
  const hint = c.chart.kind === "timeseries"
    ? `<div class="hint">drag to zoom · double-click to reset</div>` : "";
  return `<div class="card chart-card" data-chart="${c.i}" data-sheet="${esc(c.sheet)}">
    <div class="card-head"><span class="ct">${esc(c.sheet)}</span><span class="cs">${esc(sub)}</span>
      <span class="grow"></span><button class="iconbtn" data-csv="${c.i}">⤓ csv</button></div>
    <div class="plot">${c.chart.kind === "timeseries" ? svgTimeseries(c) : svgProfile(c)}</div>
    ${legend}${hint}<div class="tooltip"></div></div>`;
}

function yScale(vals) {
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1;
  const pad = (hi - lo) * .06; hi += pad; if (lo < 0) lo -= pad;
  return v => MT + (H - MT - MB) * (1 - (v - lo) / (hi - lo));
}
function gridAndTicks(vals) {
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1;
  const sy = yScale(vals);
  let g = "";
  for (let t = 0; t <= 3; t++) {
    const v = lo + (hi - lo) * t / 3, y = sy(v);
    g += `<line x1="${ML}" x2="${W - MR}" y1="${y}" y2="${y}" stroke="#ece5d5"/>
          <text x="${ML - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="#99917e"
            font-family="ui-monospace,Menlo,monospace">${compact(v)}</text>`;
  }
  return g;
}

function svgTimeseries(c) {
  const [lo, hi] = chartRange(c);
  const idx = i => lo + i;
  const n = hi - lo + 1;
  const on = c.lines.filter(s => s.on);
  const flat = on.flatMap(s => s.values.slice(lo, hi + 1).filter(v => v != null));
  if (!flat.length) return `<div class="muted" style="padding:30px 0;text-align:center">all series hidden</div>`;
  const sy = yScale(flat);
  const sx = i => ML + (W - ML - MR) * (n === 1 ? .5 : i / (n - 1));

  let out = gridAndTicks(flat);
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) {
    out += `<text x="${sx(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#99917e"
      font-family="ui-monospace,Menlo,monospace">${esc(String(c.chart.periods[idx(i)]).slice(0, 10))}</text>`;
  }
  for (const s of on) {
    let d = "", pen = false;
    for (let i = 0; i < n; i++) {
      const v = s.values[idx(i)];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; pen = true;
    }
    out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if (on.length <= 4) {
    for (const s of on) {
      let last = null;
      for (let i = n - 1; i >= 0; i--) if (s.values[idx(i)] != null) { last = i; break; }
      if (last != null) out += `<text x="${sx(last) - 4}" y="${sy(s.values[idx(last)]) - 6}"
        text-anchor="end" font-size="10.5" fill="#5c564a">${esc(s.label.slice(0, 22))}</text>`;
    }
  }
  out += `<g class="hoverlayer"></g><rect class="brushrect" y="${MT}" height="${H - MT - MB}"
      fill="#c9992a" opacity="0" x="0" width="0"/>
    <rect class="hitbox" x="${ML}" y="0" width="${W - ML - MR}" height="${H}" fill="transparent" style="cursor:crosshair"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" data-kind="timeseries">${out}</svg>`;
}

/* Figma-style capsule bars on light tracks, in brand gold */
function svgProfile(c) {
  const sy = yScale(c.chart.y);
  const y0 = sy(0), yTop = MT, yBot = H - MB;
  const n = c.chart.x.length;
  const band = (W - ML - MR) / n;
  const bw = Math.min(20, Math.max(7, band * .38));
  let out = gridAndTicks(c.chart.y);
  const step = Math.max(1, Math.ceil(n / 8));
  c.chart.y.forEach((v, i) => {
    const x = ML + band * i + (band - bw) / 2;
    out += `<rect x="${x}" y="${yTop}" width="${bw}" height="${yBot - yTop}" rx="${bw/2}" fill="#eee3c4"/>`;
    const yv = sy(v);
    const top = Math.min(yv, y0), h = Math.max(bw, Math.abs(y0 - yv));
    out += `<rect class="bar" data-i="${i}" x="${x}" y="${Math.min(top, yBot - bw)}" width="${bw}"
      height="${Math.min(h, yBot - yTop)}" rx="${bw/2}" fill="#a8821f"/>`;
    if (i % step === 0) out += `<text x="${x + bw/2}" y="${H - 8}" text-anchor="middle" font-size="10"
      fill="#99917e" font-family="ui-monospace,Menlo,monospace">${esc(String(c.chart.x[i]).slice(0, 12))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" data-kind="profile">${out}</svg>`;
}

function attachCharts() {
  $$(".lg").forEach(lg => lg.addEventListener("click", () => {
    const c = CHARTS[+lg.dataset.chart], s = c.lines[+lg.dataset.k];
    s.on = !s.on;
    $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => {
      card.querySelector(".plot").innerHTML = svgTimeseries(c);
    });
    lg.classList.toggle("off", !s.on);
    bindHoverAll(c);
  }));
  $$(".iconbtn[data-csv]").forEach(b => b.addEventListener("click",
    () => downloadChartCSV(CHARTS[+b.dataset.csv])));
  CHARTS.forEach(bindHoverAll);
}

function bindHoverAll(c) {
  $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => bindHover(c, card));
}

function bindHover(c, card) {
  const svg = card.querySelector("svg"), tip = card.querySelector(".tooltip");
  if (!svg || !tip) return;
  const show = (html, evt) => {
    tip.innerHTML = html; tip.style.display = "block";
    const r = card.getBoundingClientRect();
    let x = evt.clientX - r.left + 14, y = evt.clientY - r.top + 10;
    if (x + tip.offsetWidth > r.width - 6) x -= tip.offsetWidth + 26;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  };
  const hide = () => { tip.style.display = "none"; };

  if (svg.dataset.kind === "profile") {
    svg.querySelectorAll(".bar").forEach(bar => {
      bar.addEventListener("mousemove", e => {
        const i = +bar.dataset.i;
        show(`<div class="tp">${esc(String(c.chart.x[i]))}</div>
              <div class="tv"><span>sum</span><b>${num(c.chart.y[i])}</b></div>`, e);
      });
      bar.addEventListener("mouseleave", hide);
    });
    return;
  }
  const hit = svg.querySelector(".hitbox"), layer = svg.querySelector(".hoverlayer");
  const brush = svg.querySelector(".brushrect");
  let dragFrom = null;

  const toIdx = e => {
    const box = svg.getBoundingClientRect();
    const fx = (e.clientX - box.left) / box.width * W;
    const [lo, hi] = chartRange(c), n = hi - lo + 1;
    return Math.max(0, Math.min(n - 1, Math.round((fx - ML) / (W - ML - MR) * (n - 1))));
  };
  const sxOf = (i, n) => ML + (W - ML - MR) * (n === 1 ? .5 : i / (n - 1));

  hit.addEventListener("mousedown", e => { dragFrom = toIdx(e); });
  hit.addEventListener("mousemove", e => {
    const [lo, hi] = chartRange(c), n = hi - lo + 1;
    const i = toIdx(e);
    if (dragFrom != null) {
      const a = Math.min(dragFrom, i), b = Math.max(dragFrom, i);
      brush.setAttribute("x", sxOf(a, n));
      brush.setAttribute("width", Math.max(1, sxOf(b, n) - sxOf(a, n)));
      brush.setAttribute("opacity", ".14");
      return;
    }
    const on = c.lines.filter(s => s.on);
    const flat = on.flatMap(s => s.values.slice(lo, hi + 1).filter(v => v != null));
    if (!flat.length) return;
    const sy = yScale(flat), x = sxOf(i, n);
    let marks = `<line x1="${x}" x2="${x}" y1="${MT}" y2="${H - MB}" stroke="#d8cfb9"/>`;
    let rows = "";
    for (const s of on) {
      const v = s.values[lo + i];
      if (v == null) continue;
      marks += `<circle cx="${x}" cy="${sy(v)}" r="4" fill="${s.color}" stroke="#fbf9f3" stroke-width="2"/>`;
      rows += `<div class="tv"><span class="lab"><span class="sw" style="width:8px;height:8px;border-radius:2px;display:inline-block;background:${s.color}"></span>${esc(s.label.slice(0, 24))}</span><b>${num(v)}</b></div>`;
    }
    layer.innerHTML = marks;
    show(`<div class="tp">${esc(String(c.chart.periods[lo + i]))}</div>${rows}`, e);
  });
  const endDrag = e => {
    if (dragFrom == null) return;
    const [lo] = chartRange(c);
    const i = toIdx(e), a = Math.min(dragFrom, i), b = Math.max(dragFrom, i);
    dragFrom = null; brush.setAttribute("opacity", "0");
    if (b - a >= 2) { c.range = [lo + a, lo + b]; redrawChart(c); }
  };
  hit.addEventListener("mouseup", endDrag);
  hit.addEventListener("mouseleave", e => { layer.innerHTML = ""; hide(); endDrag(e); });
  hit.addEventListener("dblclick", () => { c.range = null; redrawChart(c); });
}

function redrawChart(c) {
  $$(`.chart-card[data-chart="${c.i}"]`).forEach(card => {
    card.querySelector(".plot").innerHTML = svgTimeseries(c);
    const cs = card.querySelector(".cs");
    if (cs) {
      const [lo, hi] = chartRange(c);
      cs.textContent = [c.loc, `${hi - lo + 1} of ${c.chart.periods.length} periods`,
        c.chart.truncated ? "truncated" : null].filter(Boolean).join(" · ");
    }
  });
  bindHoverAll(c);
}

/* ---------- audit highlights (Figma topics panels) ---------- */
function auditRows() {
  let rows = [...AUDIT.findings, ...AUDIT.verified, ...AUDIT.unverified];
  rows = rows.filter(f => sheetVisible(f.sheet));
  if (FILTER.status) rows = rows.filter(f => f.status === FILTER.status);
  return rows;
}

function renderHighlights() {
  const mism = AUDIT.findings.filter(f => sheetVisible(f.sheet)).slice(0, 4);
  const ok = AUDIT.verified.filter(f => sheetVisible(f.sheet))
    .sort((a, b) => b.n_checked - a.n_checked).slice(0, 4);
  const maxD = Math.max(1, ...mism.map(f => f.total_abs_delta));
  const rowM = f => `<div class="bar-row clicky" data-sheet="${esc(f.sheet)}">
    <span class="bl" title="${esc(f.formula)}">${esc(f.sheet)} — ${esc(f.formula)}</span>
    <span class="bv">|Δ| ${num(f.total_abs_delta)}</span>
    <div class="track" style="background:var(--crit-track)"><div class="fill"
      style="width:${Math.max(4, f.total_abs_delta / maxD * 100)}%;background:var(--critical)"></div></div></div>`;
  const rowV = f => `<div class="bar-row clicky" data-sheet="${esc(f.sheet)}">
    <span class="bl" title="${esc(f.formula)}">${esc(f.sheet)} — ${esc(f.formula)}</span>
    <span class="bv">${f.n_matched}/${f.n_checked} rows</span>
    <div class="track" style="background:var(--good-track)"><div class="fill"
      style="width:${f.n_checked ? f.n_matched / f.n_checked * 100 : 0}%;background:var(--good)"></div></div></div>`;
  return `<div class="grid2">
    <div class="card"><div class="card-head"><span class="ct">Largest discrepancies</span></div>
      ${mism.length ? mism.map(rowM).join("") : `<div class="muted" style="padding:18px 0">✓ none for this filter</div>`}</div>
    <div class="card"><div class="card-head"><span class="ct">Verified relations</span></div>
      ${ok.length ? ok.map(rowV).join("") : `<div class="muted" style="padding:18px 0">none for this filter</div>`}</div>
  </div>`;
}

function renderLeaderboards() {
  const bySheetD = {};
  for (const f of AUDIT.findings) bySheetD[f.sheet] = (bySheetD[f.sheet] || 0) + f.total_abs_delta;
  const dRows = Object.entries(bySheetD).filter(([s]) => sheetVisible(s))
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rRows = REPORT.sheets.filter(s => sheetVisible(s.name)).map(s => {
    let n = s.tidy ? s.tidy.n_records : 0;
    for (const p of s.panels || []) n += p.tidy ? p.tidy.n_records : 0;
    return [s.name, n, s.orientation];
  }).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const lead = (rows, fmt) => rows.map((r, i) => `<div class="lead-row">
      <span class="rank">${i + 1}</span>${fmt(r)}</div>`).join("");
  return `<div class="grid2">
    <div class="card"><div class="card-head"><span class="ct">Most data extracted</span></div>
      ${rRows.length ? lead(rRows, ([s, n, o]) => `<div style="min-width:0"><div class="nm">${esc(s)}</div>
        <div class="sub">${esc(o)}</div></div><span class="val">${compact(n)} <span class="muted" style="font-weight:400">rows</span></span>`)
        : `<div class="muted" style="padding:18px 0">nothing extracted</div>`}</div>
    <div class="card"><div class="card-head"><span class="ct">Discrepancy by sheet</span></div>
      ${dRows.length ? lead(dRows, ([s, d]) => `<div style="min-width:0"><div class="nm">${esc(s)}</div></div>
        <span class="val" style="color:var(--critical)">${compact(d)}</span>`)
        : `<div class="muted" style="padding:18px 0">✓ no discrepancies</div>`}</div>
  </div>`;
}

const STATUS = {
  ok: { ico: "✓", cls: "ok", word: "OK" },
  mismatch: { ico: "✕", cls: "mismatch", word: "Mismatch" },
  unverified: { ico: "?", cls: "unverified", word: "Unverified" },
};
const stBadge = s => {
  const t = STATUS[s] || STATUS.unverified;
  return `<span class="st ${t.cls}">${t.ico} ${t.word}</span>`;
};

function fixCell(f) {
  if (f.status !== "mismatch") return "";
  const safe = f.fix_confidence === "high"
    ? f.mismatches.filter(m => m.suggest !== false) : [];
  if (!safe.length)
    return `<span class="muted">review inputs by hand</span>`;
  return safe.slice(0, 2).map(m =>
    m.cell ? `<div><b>${esc(m.cell)}</b>: ${num(m.actual)} → <b style="color:var(--good)">${num(m.expected)}</b></div>`
           : `<div>row ${m.row}: → <b style="color:var(--good)">${num(m.expected)}</b></div>`
  ).join("") + (safe.length > 2 ? `<div class="muted">+${safe.length - 2} more in CSV</div>` : "");
}

function renderFindingsTable() {
  const rows = auditRows();
  if (!rows.length) return `<div class="card muted">No relations for this filter.</div>`;
  const row = f => {
    const worst = f.mismatches[0];
    return `<tr class="frow" data-sheet="${esc(f.sheet)}">
      <td>${stBadge(f.status)}</td>
      <td>${esc(f.sheet)}${f.panel ? ` <span class="muted">[${esc(f.panel)}]</span>` : ""}</td>
      <td>${esc(f.formula)}</td>
      <td class="num">${f.n_mismatched}/${f.n_checked}</td>
      <td class="num">${num(f.total_abs_delta)}</td>
      <td>${worst ? `row ${worst.row} (${esc(worst.label)}): expected ${num(worst.expected)}, got ${num(worst.actual)}` : ""}</td>
      <td>${fixCell(f)}</td>
    </tr>`;
  };
  return `<div class="card"><div class="preview-wrap"><table>
    <tr><th>Status</th><th>Sheet</th><th>Relation</th><th class="num">Rows off</th>
        <th class="num">|Δ|</th><th>Worst row</th><th>Suggested fix</th></tr>
    ${rows.map(row).join("")}</table></div></div>`;
}

function attachFindingRows() {
  $$("tr.frow").forEach(tr => tr.addEventListener("click", () => jumpToSheet(tr.dataset.sheet)));
}
function attachBarRows() {
  $$(".bar-row.clicky").forEach(el => el.addEventListener("click", () => jumpToSheet(el.dataset.sheet)));
}
function jumpToSheet(name) {
  const idx = SHEET_IDX[name];
  if (idx === undefined) return;
  const el = document.getElementById("sheetcard-" + idx);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  const d = el.querySelector("details"); if (d) d.open = true;
}

/* ---------- sheets ---------- */
function renderSheets() {
  return REPORT.sheets.map((s, i) =>
    sheetVisible(s.name) ? sheetCard(s, i) : "").join("") || `<div class="card muted">No sheets for this filter.</div>`;
}

function sheetCard(s, idx) {
  let body = "";
  if (s.panels) {
    body = s.panels.map(p => {
      const where = "col_start" in p && p.col_start != null
        ? `cols ${p.col_start}–${p.col_end}` : `rows ${p.row_start}–${p.row_end}`;
      return `<div class="panel-blk">
        <span class="badge ${esc(p.orientation)}">${esc(p.orientation)}</span>
        <span class="muted" style="font-size:11px;font-family:var(--mono)">${where}</span>
        <div class="reason">${esc(p.reason)}</div>
        ${p.tidy ? tidyBlock(p.tidy) : ""}</div>`;
    }).join("");
  } else if (s.tidy) body = tidyBlock(s.tidy);
  return `<div class="card" id="sheetcard-${idx}">
    <div class="sheet-head">
      <span class="nm">${esc(s.name)}</span>
      <span class="badge ${esc(s.orientation)}">${esc(s.orientation)}</span>
      <span class="dims">${s.n_rows} × ${s.n_cols} · ${(s.fill_ratio * 100).toFixed(0)}% filled</span>
    </div>
    <div class="reason">${esc(s.orientation_reason)}</div>
    ${body}</div>`;
}

function tidyBlock(t) {
  const cols = t.columns, shown = cols.slice(0, 10), recs = t.records.slice(0, 5);
  const preview = recs.length ? `
    <div class="preview-wrap"><table>
      <tr>${shown.map(c => `<th>${esc(c)}</th>`).join("")}${cols.length > shown.length ? "<th>…</th>" : ""}</tr>
      ${recs.map(r => `<tr>${shown.map(c =>
        `<td class="${typeof r[c] === "number" ? "num" : ""}">${typeof r[c] === "number" ? num(r[c]) : esc(r[c])}</td>`).join("")}
        ${cols.length > shown.length ? "<td>…</td>" : ""}</tr>`).join("")}
    </table></div>` : "";
  const s = t.summary || {};
  const bits = [`${t.n_records} records`, `${t.n_columns} columns`];
  if (s.n_periods) bits.push(`${s.n_series} series × ${s.n_periods} periods (${esc(s.period_min)} → ${esc(s.period_max)})`);
  if (t.total_rows) bits.push(`totals rows: ${t.total_rows.join(", ")}`);
  return `<details><summary>${bits.join(" · ")}</summary>${preview}</details>`;
}

/* ---------- CSV export ---------- */
function downloadCSV(name, rows) {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function downloadChartCSV(c) {
  if (c.chart.kind === "timeseries") {
    const head = ["period", ...c.lines.map(s => s.label)];
    const rows = c.chart.periods.map((p, i) => [p, ...c.lines.map(s => s.values[i] ?? "")]);
    downloadCSV(`${c.sheet.trim()}-timeseries.csv`, [head, ...rows]);
  } else {
    downloadCSV(`${c.sheet.trim()}-profile.csv`,
      [["column", "sum"], ...c.chart.x.map((x, i) => [x, c.chart.y[i]])]);
  }
}
function downloadCorrections() {
  const rows = [["sheet", "panel", "cell", "row", "label", "current", "suggested",
    "rule", "confidence"]];
  for (const f of AUDIT.findings) {
    for (const m of f.mismatches) {
      const safe = f.fix_confidence === "high" && m.suggest !== false;
      rows.push([f.sheet, f.panel ?? "", m.cell ?? "", m.row, m.label ?? "",
        m.actual, m.expected, f.formula,
        safe ? "high — rule verified on " + f.n_matched + " rows"
             : "review — other rules contest this cell; verify inputs by hand"]);
    }
  }
  downloadCSV(`${AUDIT.filename.replace(/\.[^.]+$/, "")}-corrections.csv`, rows);
}

function downloadFindings() {
  const rows = [["status", "sheet", "panel", "kind", "formula", "rows_mismatched",
    "rows_checked", "total_abs_delta", "worst_row", "worst_label", "expected", "actual"]];
  for (const f of [...AUDIT.findings, ...AUDIT.verified, ...AUDIT.unverified]) {
    const w = f.mismatches[0] || {};
    rows.push([f.status, f.sheet, f.panel ?? "", f.kind, f.formula, f.n_mismatched,
      f.n_checked, f.total_abs_delta, w.row ?? "", w.label ?? "", w.expected ?? "", w.actual ?? ""]);
  }
  downloadCSV(`${AUDIT.filename.replace(/\.[^.]+$/, "")}-audit.csv`, rows);
}

/* ---------- boot ---------- */
(async function boot() {
  renderEmpty();
  await loadWorkbooks();
  const first = $("#wb-list .wb");
  if (first) select(first.dataset.id);
})();
</script>
